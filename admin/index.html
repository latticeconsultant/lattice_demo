<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LATTICE · Quản trị trang chủ</title>
<style>
/* Trang công tắc tính năng của lattice.business. Cloudflare Access chặn trước /admin;
   API /admin/api/cau-hinh do Worker lattice-demo phục vụ (cloudflare/worker.js). */
@font-face{font-family:Archivo;font-weight:100 900;font-display:swap;src:url(../assets/fonts/archivo-vietnamese.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:Archivo;font-weight:100 900;font-display:swap;src:url(../assets/fonts/archivo-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
:root{--ink:#201E1D;--bg:#F3F2F2;--card:#fff;--line:#E2E0DF;--muted:#6B6766;--red:#EC3013;--n:#BAB6B6}
@media (prefers-color-scheme:dark){:root{--ink:#EFEDEC;--bg:#131211;--card:#1D1B1A;--line:#34312F;--muted:#A5A09D;--n:#5C5856}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Archivo,'Helvetica Neue',Arial,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:2px solid var(--ink);background:var(--bg);position:sticky;top:0}
header b{font-weight:800;letter-spacing:.12em}
header small{color:var(--muted);letter-spacing:.14em;font-size:11px;text-transform:uppercase}
header .sp{flex:1}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:24px;margin:0 0 6px}
p.fine{color:var(--muted);font-size:13px;margin:0 0 18px}
.list{border:2px solid var(--ink);background:var(--card)}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1}
.row .t code{font-size:11.5px;color:var(--muted)}
.sw{appearance:none;width:44px;height:24px;border-radius:999px;background:var(--n);position:relative;cursor:pointer;flex:none;margin:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw:checked{background:var(--ink)}
.sw:checked::after{transform:translateX(20px);background:var(--bg)}
.st{font-size:12px;font-weight:700;letter-spacing:.1em;width:42px;text-align:right}
.bar{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
button{font:600 13px/1 inherit;letter-spacing:.12em;padding:14px 22px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;text-transform:uppercase}
button.phu{background:transparent;color:var(--ink)}
button:disabled{opacity:.5;cursor:not-allowed}
#tb{font-size:13px;color:var(--muted)}
#tb.loi{color:var(--red)}
h2{font-size:15px;margin:32px 0 8px;letter-spacing:.06em}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
a{color:inherit}
</style>
</head>
<body>
<header><b>LATTICE</b><small>Quản trị trang chủ</small><span class="sp"></span><span id="ai" style="font-size:12px;color:var(--muted)"></span></header>
<main>
  <h1>Công tắc tính năng</h1>
  <p class="fine">Bật = hiện trên trang chủ (Việt, Anh, Lào). Bấm Lưu để áp dụng; khách thấy thay đổi trong khoảng 1 phút. <a href="../" target="_blank" rel="noopener">Mở trang chủ ↗</a></p>
  <div class="list" id="ds"><div class="row">Đang tải…</div></div>
  <div class="bar"><button id="luu" disabled>Lưu</button><button class="phu" id="tatca">Bật tất cả</button><span id="tb"></span></div>
  <h2>LỊCH SỬ THAY ĐỔI</h2>
  <table id="ls"></table>
</main>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
let duLieu = null;
let ban = '';

function bao(msg, loi) { const t = $('#tb'); t.textContent = msg; t.className = loi ? 'loi' : ''; }

function ve() {
  const tat = new Set(duLieu.tat);
  $('#ds').innerHTML = duLieu.tinh_nang.map((t) => `<label class="row"><span class="t">${esc(t.nhan)}<br><code>${esc(t.ten)}</code></span>
    <span class="st">${tat.has(t.ten) ? 'ẨN' : 'HIỆN'}</span><input type="checkbox" class="sw" data-ten="${esc(t.ten)}" ${tat.has(t.ten) ? '' : 'checked'} aria-label="${esc(t.nhan)}"></label>`).join('');
  document.querySelectorAll('.sw').forEach((c) => {
    c.onchange = () => { c.parentElement.querySelector('.st').textContent = c.checked ? 'HIỆN' : 'ẨN'; doiTrangThai(); };
  });
  $('#ls').innerHTML = (duLieu.lich_su || []).map((l) => `<tr><td>${new Date(l.luc).toLocaleString('vi-VN')}</td><td>${esc(l.email)}</td>
    <td>${l.tat.length ? 'Ẩn: ' + l.tat.map(esc).join(', ') : 'Hiện tất cả'}</td></tr>`).join('') || '<tr><td>Chưa có thay đổi.</td></tr>';
  ban = JSON.stringify([...tat].sort());
  doiTrangThai();
}

function dangTat() { return [...document.querySelectorAll('.sw')].filter((c) => !c.checked).map((c) => c.dataset.ten).sort(); }
function doiTrangThai() { const doi = JSON.stringify(dangTat()) !== ban; $('#luu').disabled = !doi; bao(doi ? 'Có thay đổi chưa lưu.' : ''); }

async function nap() {
  try {
    const tl = await fetch('api/cau-hinh', { credentials: 'same-origin', cache: 'no-store' });
    if (tl.status === 401) { bao('Phiên đăng nhập hết hạn hoặc chưa cấu hình Access. Tải lại trang để đăng nhập.', true); return; }
    if (!tl.ok) throw new Error('Máy chủ trả ' + tl.status);
    duLieu = await tl.json();
    $('#ai').textContent = duLieu.email;
    ve();
  } catch (e) { bao('Không tải được cấu hình: ' + e.message, true); }
}

$('#luu').onclick = async () => {
  $('#luu').disabled = true;
  bao('Đang lưu…');
  try {
    const tl = await fetch('api/cau-hinh', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ tat: dangTat() }) });
    if (!tl.ok) throw new Error('Máy chủ trả ' + tl.status);
    await nap();
    bao('Đã lưu. Trang chủ cập nhật trong khoảng 1 phút.');
  } catch (e) { bao('Lưu không được: ' + e.message, true); $('#luu').disabled = false; }
};
$('#tatca').onclick = () => { document.querySelectorAll('.sw').forEach((c) => { c.checked = true; c.parentElement.querySelector('.st').textContent = 'HIỆN'; }); doiTrangThai(); };
nap();
</script>
</body>
</html>
