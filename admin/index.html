<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LATTICE Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23201E1D'/%3E%3Cpath d='M50 16 L84 50 L50 84 L16 50 Z M50 16 L50 84 M16 50 L84 50' fill='none' stroke='%23fff' stroke-width='5' opacity='.35'/%3E%3Ccircle cx='50' cy='50' r='11' fill='%23EC3013'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" sizes="180x180" href="../brand/logo/favicon/favicon-180.png">
<meta name="apple-mobile-web-app-title" content="LATTICE Admin">
<meta name="theme-color" content="#201E1D">
<style>
/* Trang công tắc tính năng của lattice.business. Cloudflare Access chặn trước /admin;
   API /admin/api/cau-hinh do Worker lattice-demo phục vụ (cloudflare/worker.js). */
@font-face{font-family:Archivo;font-weight:100 900;font-display:swap;src:url(../assets/fonts/archivo-vietnamese.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:Archivo;font-weight:100 900;font-display:swap;src:url(../assets/fonts/archivo-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
:root{--ink:#201E1D;--bg:#F3F2F2;--card:#fff;--line:#E2E0DF;--muted:#6B6766;--red:#EC3013;--n:#BAB6B6}
@media (prefers-color-scheme:dark){:root{--ink:#EFEDEC;--bg:#131211;--card:#1D1B1A;--line:#34312F;--muted:#A5A09D;--n:#5C5856}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Archivo,'Helvetica Neue',Arial,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:2px solid var(--ink);background:var(--bg);position:sticky;top:0}
header b{font-weight:800;letter-spacing:.12em}
header small{color:var(--muted);letter-spacing:.14em;font-size:11px;text-transform:uppercase}
header .sp{flex:1}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:24px;margin:0 0 6px}
p.fine{color:var(--muted);font-size:13px;margin:0 0 18px}
.list{border:2px solid var(--ink);background:var(--card)}
.list .row.dau{background:var(--bg);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);padding:10px 16px}
.cot{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.1em}
@media (max-width:520px){.cot{width:52px}.row{gap:8px;padding:12px 10px}}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1}
.row .t code{font-size:11.5px;color:var(--muted)}
.sw{appearance:none;width:44px;height:24px;border-radius:999px;background:var(--n);position:relative;cursor:pointer;flex:none;margin:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw:checked{background:var(--ink)}
.sw:checked::after{transform:translateX(20px);background:var(--bg)}
.st{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.bar{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
button{font:600 13px/1 inherit;letter-spacing:.12em;padding:14px 22px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;text-transform:uppercase}
button.phu{background:transparent;color:var(--ink)}
button:disabled{opacity:.5;cursor:not-allowed}
#tb{font-size:13px;color:var(--muted)}
#tb.loi{color:var(--red)}
h2{font-size:15px;margin:32px 0 8px;letter-spacing:.06em}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
a{color:inherit}
#dn{max-width:380px;margin:40px auto;border:2px solid var(--ink);background:var(--card);padding:22px}
#dn label{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
#dn input{width:100%;padding:11px 12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
#dn input:focus{border-color:var(--ink);outline:0}
#dn button{width:100%;margin-top:18px}
#dnTb{font-size:13px;color:var(--red);min-height:18px;margin-top:10px}
</style>
</head>
<body>
<header><b>LATTICE</b><small>Quản trị trang chủ</small><span class="sp"></span><span id="ai" style="font-size:12px;color:var(--muted)"></span><button class="phu" id="thoat" hidden style="padding:8px 12px;font-size:11px">Đăng xuất</button></header>
<form id="dn" hidden>
  <h1 style="font-size:20px">Đăng nhập</h1>
  <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
  <label for="mk">Mật khẩu</label><input id="mk" type="password" autocomplete="current-password" required>
  <button type="submit">Đăng nhập</button>
  <div id="dnTb" role="alert"></div>
</form>
<main id="noiDung" hidden>
  <h1>Công tắc tính năng</h1>
  <p class="fine">Bật = hiện, tắt = ẩn — riêng cho từng bản: <b>VN</b> (lattice.business), <b>EN</b> (/en/), <b>LO</b> (/lo/). Bấm Lưu để áp dụng; khách thấy thay đổi trong khoảng 1 phút. Mở: <a href="../" target="_blank" rel="noopener">VN ↗</a> · <a href="../en/" target="_blank" rel="noopener">EN ↗</a> · <a href="../lo/" target="_blank" rel="noopener">LO ↗</a></p>
  <div class="list" id="ds"><div class="row">Đang tải…</div></div>
  <div class="bar"><button id="luu" disabled>Lưu</button><button class="phu" id="tatca">Bật tất cả</button><span id="tb"></span></div>
  <h2>LỊCH SỬ THAY ĐỔI</h2>
  <table id="ls"></table>
</main>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
let duLieu = null;
let ban = '';

function bao(msg, loi) { const t = $('#tb'); t.textContent = msg; t.className = loi ? 'loi' : ''; }

const NN = [['vi', 'VN'], ['en', 'EN'], ['lo', 'LO']];
const nhanTat = (tat) => {
  if (Array.isArray(tat)) return tat.length ? 'Ẩn (mọi bản): ' + tat.map(esc).join(', ') : 'Hiện tất cả';
  const ds = NN.filter(([n]) => tat[n] && tat[n].length).map(([n, k]) => `${k}: ẩn ${tat[n].map(esc).join(', ')}`);
  return ds.length ? ds.join(' · ') : 'Hiện tất cả';
};

function ve() {
  const tat = duLieu.tat;
  $('#ds').innerHTML = `<div class="row dau"><span class="t">TÍNH NĂNG</span>${NN.map(([, k]) => `<span class="cot">${k}</span>`).join('')}</div>` +
    duLieu.tinh_nang.map((t) => `<div class="row"><span class="t">${esc(t.nhan)}<br><code>${esc(t.ten)}</code></span>${NN.map(([n, k]) => {
      const an = (tat[n] || []).includes(t.ten);
      return `<label class="cot"><input type="checkbox" class="sw" data-ten="${esc(t.ten)}" data-nn="${n}" ${an ? '' : 'checked'} aria-label="${esc(t.nhan)} — bản ${k}"><span class="st">${an ? 'ẨN' : 'HIỆN'}</span></label>`;
    }).join('')}</div>`).join('');
  document.querySelectorAll('.sw').forEach((c) => {
    c.onchange = () => { c.parentElement.querySelector('.st').textContent = c.checked ? 'HIỆN' : 'ẨN'; doiTrangThai(); };
  });
  $('#ls').innerHTML = (duLieu.lich_su || []).map((l) => `<tr><td>${new Date(l.luc).toLocaleString('vi-VN')}</td><td>${esc(l.email)}</td>
    <td>${nhanTat(l.tat)}</td></tr>`).join('') || '<tr><td>Chưa có thay đổi.</td></tr>';
  ban = JSON.stringify(dangTat());
  doiTrangThai();
}

function dangTat() {
  const ra = { vi: [], en: [], lo: [] };
  document.querySelectorAll('.sw').forEach((c) => { if (!c.checked) ra[c.dataset.nn].push(c.dataset.ten); });
  for (const n in ra) ra[n].sort();
  return ra;
}
function doiTrangThai() { const doi = JSON.stringify(dangTat()) !== ban; $('#luu').disabled = !doi; bao(doi ? 'Có thay đổi chưa lưu.' : ''); }

async function nap() {
  try {
    const tl = await fetch('api/cau-hinh', { credentials: 'same-origin', cache: 'no-store' });
    if (tl.status === 401) { $('#noiDung').hidden = true; $('#thoat').hidden = true; $('#dn').hidden = false; $('#em').focus(); return; }
    if (!tl.ok) throw new Error('Máy chủ trả ' + tl.status);
    duLieu = await tl.json();
    $('#dn').hidden = true; $('#noiDung').hidden = false; $('#thoat').hidden = false;
    $('#ai').textContent = duLieu.email;
    ve();
  } catch (e) { bao('Không tải được cấu hình: ' + e.message, true); }
}

$('#luu').onclick = async () => {
  $('#luu').disabled = true;
  bao('Đang lưu…');
  try {
    const tl = await fetch('api/cau-hinh', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ tat: dangTat() }) });
    if (!tl.ok) throw new Error('Máy chủ trả ' + tl.status);
    await nap();
    bao('Đã lưu. Trang chủ cập nhật trong khoảng 1 phút.');
  } catch (e) { bao('Lưu không được: ' + e.message, true); $('#luu').disabled = false; }
};
$('#dn').onsubmit = async (e) => {
  e.preventDefault();
  $('#dnTb').textContent = '';
  const nut = $('#dn button'); nut.disabled = true;
  try {
    const tl = await fetch('api/dang-nhap', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email: $('#em').value, mat_khau: $('#mk').value }) });
    const j = await tl.json().catch(() => ({}));
    if (!tl.ok) { $('#dnTb').textContent = j.phu || (tl.status === 503 ? 'Chưa đặt tài khoản quản trị.' : 'Đăng nhập không được (' + tl.status + ').'); return; }
    $('#mk').value = '';
    await nap();
  } catch (er) { $('#dnTb').textContent = 'Lỗi mạng: ' + er.message; }
  finally { nut.disabled = false; }
};
$('#thoat').onclick = async () => { await fetch('api/dang-xuat', { method: 'POST', credentials: 'same-origin' }); duLieu = null; nap(); };
$('#tatca').onclick = () => { document.querySelectorAll('.sw').forEach((c) => { c.checked = true; c.parentElement.querySelector('.st').textContent = 'HIỆN'; }); doiTrangThai(); };
nap();
</script>
</body>
</html>
