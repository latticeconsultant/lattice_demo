name = "lattice-demo"
main = "worker.js"
compatibility_date = "2026-09-08"

# Route: mọi yêu cầu tới lattice.business đều đi qua Worker này.
# zone_name phải là tên miền đã được thêm vào Cloudflare và đã trỏ nameserver.
[[routes]]
pattern = "lattice.business/*"
zone_name = "lattice.business"

# Công tắc tính năng cho trang /admin/ (README mục "Trang admin").
[[kv_namespaces]]
binding = "SITE"
id = "0bad0f9f706747cfad6bed89319a3600"

[vars]
ACCESS_TEAM = "lattice-ns"
ACCESS_AUD = ""   # để trống: /admin đăng nhập bằng email + mật khẩu trên chính trang
# Apps Script nhận đăng ký (tools/google-apps-script.gs). Triển khai mới → thay URL ở đây,
# ở dang-ky/index.html, register/index.html và webhook SePay. Mã truy cập là secret APPS_SCRIPT_TOKEN.
APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw7EDVxuAem13qXELI1E_gtqLUkE4RpKp20vlDxt2jtiZwi-PTO3ft4F4Xxe7bVLD-Q/exec"
