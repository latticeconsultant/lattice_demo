/* ---------------- CHƯƠNG TRÌNH 3 ---------------- */
{ id:'lt', code:'LATTICE', name:'LATTICE từ cơ bản đến nâng cao', tag:'Chương trình 03',
  who:'Bốn cấp độ theo vai: chủ doanh nghiệp, người vận hành, đội kỹ thuật và đối tác triển khai; thêm chuyên đề theo mô hình',
  intro:'Hiểu phương pháp LATTICE theo bốn cấp độ, khớp ba lộ trình của LATTICE Academy (A Nền tảng · B Vận hành · C Kiến trúc), rồi áp vào từng loại hình doanh nghiệp.',
  levels:[
  { id:'lt1', name:'Cấp 1 · Nhập môn', note:'Hiểu LATTICE là gì · không yêu cầu nền tảng', modules:[

{ id:'lt1-1', t:'LATTICE là gì', min:25,
 goals:['Nói được định vị của LATTICE trong một câu','Thuộc nguyên tắc lõi','Hiểu ý nghĩa tên gọi và dấu hiệu'],
 body:`<p><dfn data-k="lattice">LATTICE Next</dfn> là kiến trúc mô hình kinh doanh mới: thiết kế tổ chức và hệ thống kiểm soát để doanh nghiệp nhỏ vận hành được bằng AI. LATTICE không bán công cụ.</p>
<blockquote>AI thực hiện — hệ thống kiểm soát — con người quyết định ngoại lệ.</blockquote>
<h3>Vì sao tên là Lattice</h3>
<p>Lattice là giàn tinh thể: mỗi nút liên kết với các nút lân cận theo một quy luật lặp lại. Ba đặc tính của nó là ba luận điểm của công ty:</p>
<ul><li><b>Bền nhờ liên kết, không nhờ khối lượng.</b> Tháp Eiffel nặng 7.300 tấn thép, nhưng nấu chảy đổ vừa chân tháp thì lớp thép chỉ dày chừng 6 cm.</li>
<li><b>Mở rộng bằng cách lặp một đơn vị đơn giản.</b> Thêm năng lực là thêm một ô lưới giống hệt. Đó là cách một Team AI lớn lên.</li>
<li><b>Vừa là kiến trúc, vừa là mạng lưới.</b></li></ul>
<p>"Next" mô tả thời điểm: khách tìm đến để dựng mô hình kế tiếp. Tagline: <i>Kiến trúc mô hình kinh doanh mới · Structure for what comes next.</i></p>
<h3>Dấu hiệu</h3>
<p>Ô lưới hình thoi: bốn nút rỗng ở bốn đỉnh là các agent, nút đặc màu đỏ ở tâm là con người, người giữ quyền quyết định. Không bao giờ đổi màu nút tâm. Trong văn bản chính thức luôn viết LATTICE.</p>
<h3>Bốn dòng kinh doanh nuôi nhau</h3>
<p>Advisory (chẩn đoán) → Architecture & Build (thiết kế, triển khai) → Academy (chuyển giao năng lực) → Ecosystem (thư viện mẫu, bộ eval, đối tác). Không có Academy thì bàn giao chỉ là chuyển giao tài khoản; hệ thống sẽ chết sau vài tháng.</p>`,
 ex:{t:'Cùng một yêu cầu, hai cách trả lời', h:`<p>Chủ Spa An Nhiên hỏi: "Tôi nên mua chatbot nào?"</p>
<p><b>Đơn vị bán công cụ:</b> giới thiệu ba chatbot và bảng giá.</p>
<p><b>LATTICE:</b> hỏi lại việc nào đang lặp lại, ai đang trả lời khách, câu hỏi nào lặp trên 60%, chính sách đổi lịch đã viết ra chưa, ai duyệt hoàn tiền. Chatbot là quyết định cuối, không phải quyết định đầu.</p>`},
 help:{read:'Học thuộc nguyên tắc lõi. Mọi học phần sau đều là cách thi hành câu đó.',mistakes:['Gọi LATTICE là "công ty AI". LATTICE là đơn vị kiến trúc tổ chức.','Nghĩ Academy là dịch vụ bán thêm.'],rel:['lt1-2','lt1-4','ai1']},
 q:[
  ['Nguyên tắc lõi của LATTICE?',['AI quyết định, con người thực hiện','AI thực hiện — hệ thống kiểm soát — con người quyết định ngoại lệ','Tự động hóa 100%','Con người làm, AI giám sát'],1,'Nguyên tắc lõi trong mọi tài liệu LATTICE.',''],
  ['LATTICE bán gì?',['Phần mềm chatbot','Thiết kế tổ chức và hệ thống kiểm soát để doanh nghiệp nhỏ vận hành được bằng AI','Máy chủ AI','Quảng cáo'],1,'Định vị: không bán công cụ.',''],
  ['Nút đỏ ở tâm dấu hiệu LATTICE tượng trưng cho gì?',['Agent chính','Con người giữ quyền quyết định','Dữ liệu','Khách hàng'],1,'Bốn nút rỗng là agent, nút đỏ là con người.',''],
  ['Ví dụ tháp Eiffel minh họa luận điểm nào?',['Lớn mới bền','Bền nhờ liên kết, không nhờ khối lượng','Thép là vật liệu tốt nhất','Cần nhiều nhân sự'],1,'Lớp thép nấu chảy chỉ dày chừng 6 cm: sức mạnh nằm ở cấu trúc.',''],
  ['Vì sao Academy đứng ngang hàng với tư vấn và triển khai?',['Vì biên lợi nhuận cao','Vì không có đào tạo thì bàn giao chỉ là chuyển giao tài khoản, hệ thống chết sau vài tháng','Vì khách yêu cầu','Vì dễ bán'],1,'Lý do có dòng Academy trên website.','']
 ]},

{ id:'lt1-2', t:'Luận điểm doanh nghiệp một người', min:30,
 goals:['Phát biểu luận điểm trung tâm','Hiểu "một người" thực tế là 1–3 người','Thuộc ba nguyên tắc bổ sung'],
 body:`<blockquote>Đơn vị mở rộng quy mô của doanh nghiệp đã dịch chuyển từ "số nhân sự" sang "số agent + chất lượng hệ thống kiểm soát".</blockquote>
<p>Chi phí sản xuất đầu ra số (nội dung, mã nguồn, phân tích, hỗ trợ khách, tài liệu) giảm về gần bằng chi phí hạ tầng. Một người ở trung tâm hệ thống AI có thể tạo sản lượng của một đội 10–20 người.</p>
<p><dfn data-k="dnmotnguoi">Doanh nghiệp một người</dfn> là cách nói về cấu trúc, không phải về số người. Thực tế là 1–3 người; trường hợp một người tương ứng hộ kinh doanh hoặc doanh nghiệp rất nhỏ. Chính LATTICE là công ty cổ phần, tối thiểu ba cổ đông, nên ba người là con số trung thực.</p>
<h3>Ba nguyên tắc bổ sung</h3>
<ol><li><b>Trí nhớ chung là lõi, không phải phụ kiện.</b></li>
<li><b>Không có evaluation thì không có tự chủ.</b> Mức tự chủ chỉ nâng khi có số đo.</li>
<li><b>Phải thiết kế để chống mong manh.</b> Một người là một điểm gãy duy nhất: sức khỏe, phán đoán, pháp lý.</li></ol>
<h3>Giá trị thật</h3>
<p>Giá trị lớn nhất với doanh nghiệp nhỏ không nằm ở cắt nhân sự (vốn không có để cắt), mà ở việc có được những chức năng trước đây chỉ doanh nghiệp lớn duy trì nổi: phân tích dữ liệu liên tục, R&D có hệ thống, theo dõi tuân thủ, quản trị vòng đời khách hàng.</p>`,
 ex:{t:'Chính LATTICE là case study đầu tiên', h:`<p>LATTICE thiết kế cho mình: ba người, tám vai trò AI chọn từ mười một vai trò của đề án. Người 1 giữ chiến lược và là gương mặt thương hiệu; Người 2 duyệt mọi đầu ra L2 trước khi tới khách; Người 3 đứng tên mọi agent đang chạy.</p>
<p>Nhật ký thăng và hạ mức tự chủ của chính LATTICE, có ngày tháng, sự cố và quyết định, là case study duy nhất công ty có quyền trình bày trước khi có khách hàng hoàn tất.</p>`},
 help:{read:'Đọc kỹ đoạn "Giá trị thật": đó là câu trả lời khi khách hỏi "AI có phải để cắt người không?".',mistakes:['Hiểu "một người" theo nghĩa đen tuyệt đối.','Nâng mức tự chủ vì "thấy nó làm tốt".'],rel:['lt1-1','qt8','lt4-5']},
 q:[
  ['Luận điểm trung tâm của đề án?',['Càng nhiều nhân sự càng tốt','Đơn vị mở rộng quy mô chuyển từ số nhân sự sang số agent + chất lượng hệ thống kiểm soát','AI thay thế hoàn toàn con người','Doanh nghiệp nhỏ không cần quy trình'],1,'Tóm tắt điều hành của đề án.',''],
  ['"Doanh nghiệp một người" thực tế là bao nhiêu người?',['Đúng 1 người','1–3 người','5–10 người','Không giới hạn'],1,'Cách nói về cấu trúc; thực tế 1–3 người.',''],
  ['Nguyên tắc nào nói về điều kiện nâng mức tự chủ?',['Trí nhớ chung là lõi','Không có evaluation thì không có tự chủ','Chống mong manh','Mua trước xây sau'],1,'Mức tự chủ chỉ nâng khi có số đo.',''],
  ['Giá trị lớn nhất của mô hình AI-native với doanh nghiệp nhỏ?',['Cắt giảm nhân sự','Có được chức năng trước đây chỉ doanh nghiệp lớn duy trì nổi','Không cần chủ doanh nghiệp','Bỏ kế toán'],1,'Đề án mục 16.1.',''],
  ['Vì sao LATTICE vận hành với ba người chứ không phải một?',['Vì thiếu AI','Vì là công ty cổ phần, luật yêu cầu tối thiểu ba cổ đông, và dịch vụ chuyên môn có trần 60–75%','Vì khách yêu cầu','Để có nhiều video hơn'],1,'Mô hình vận hành LATTICE mục 02.','']
 ]},

{ id:'lt1-3', t:'Trần tự động hóa và ba kiến trúc', min:35,
 goals:['Đọc bảng trần tự động hóa tám nhóm','Hiểu quy tắc hàm lượng nguyên tử','Phân biệt trần với mức tự chủ'],
 body:`<div class="tbl"><table><tr><th>Nhóm</th><th>Trần</th><th>Người tối thiểu</th><th>Điểm nghẽn</th></tr>
<tr><td>Kinh doanh tri thức / nội dung</td><td class="num">85–90%</td><td>1</td><td>Độc đáo của góc nhìn</td></tr>
<tr><td>Nền tảng số / SaaS</td><td class="num">75–85%</td><td>1–2</td><td>Bảo mật, nợ kỹ thuật</td></tr>
<tr><td>Thương mại điện tử</td><td class="num">70–85%</td><td>1–2</td><td>Nguồn hàng, vốn tồn kho</td></tr>
<tr><td>Dịch vụ chuyên môn</td><td class="num">60–75%</td><td>1–2</td><td>Trách nhiệm nghề nghiệp</td></tr>
<tr><td>Môi giới / Marketplace</td><td class="num">60–75%</td><td>2</td><td>"Gà và trứng" hai phía</td></tr>
<tr><td>Thương mại (phân phối)</td><td class="num">55–70%</td><td>2</td><td>Kiểm hàng vật lý, vốn lưu động</td></tr>
<tr><td>Dịch vụ tại chỗ</td><td class="num">40–55%</td><td>2–3+</td><td>Giờ công người hành nghề</td></tr>
<tr><td>Sản xuất</td><td class="num">30–50%</td><td>3+</td><td>Tài sản vật lý, lao động trực tiếp</td></tr></table></div>
<p><b>Quy tắc:</b> <dfn data-k="tran">trần tự động hóa</dfn> tỷ lệ nghịch với <dfn data-k="nguyentu">hàm lượng nguyên tử</dfn> trong chuỗi giá trị. Mô hình 1–3 người chỉ khả thi khi phần vật lý được thuê ngoài theo hợp đồng, đẩy sang OEM/ODM, hoặc đóng gói thành năng lực của đối tác.</p>
<p><b>Trần không phải mức tự chủ.</b> Một mô hình có trần 85% vẫn có thể chạy hầu hết tác vụ ở L2–L3.</p>
<h3>Ba kiến trúc tham chiếu</h3>
<p>Tám nhóm quy về ba: <b>Thương mại & Hàng hóa</b> (TMĐT, phân phối) · <b>Dịch vụ</b> (chuyên môn, tại chỗ, marketplace, tri thức, SaaS) · <b>Sản xuất</b>.</p>`,
 ex:{t:'Kỳ vọng lệch trần', h:`<p>Chủ Spa An Nhiên chọn mục tiêu "tăng doanh thu không tăng người". Spa là dịch vụ tại chỗ, trần 40–55%, cần tối thiểu 2–3 người vì có phần việc vật lý không ủy quyền được cho AI.</p>
<p>LATTICE kích hoạt luật L13 "Kỳ vọng lệch trần" và hiệu chỉnh ngay trong buổi làm việc: AI-hóa đặt lịch, nhắc hẹn, CSKH, nội dung để bảo vệ giờ công của kỹ thuật viên, chứ không thay kỹ thuật viên.</p>`},
 help:{read:'Tìm dòng của doanh nghiệp mình trong bảng, đọc cột "điểm nghẽn" trước cột "trần".',mistakes:['Nhầm trần 85% nghĩa là AI được tự quyết 85% việc.','Đánh giá gộp mô hình lai thay vì tách lớp.'],rel:['u4','qt2','lt2-4']},
 q:[
  ['Nhóm nào có trần tự động hóa cao nhất?',['Sản xuất','Dịch vụ tại chỗ','Kinh doanh tri thức / nội dung','Thương mại phân phối'],2,'85–90%, một người khả thi.',''],
  ['Trần tự động hóa tỷ lệ nghịch với gì?',['Doanh thu','Hàm lượng nguyên tử (phần việc vật lý) trong chuỗi giá trị','Số khách hàng','Số phần mềm'],1,'Quy tắc rút ra ở đề án mục 3.',''],
  ['Trần 85% có nghĩa là?',['AI tự quyết 85% việc ở L5','Tỷ trọng việc AI đảm nhiệm được; mức tự chủ đặt riêng từng tác vụ','85% nhân viên bị thay','85% chi phí giảm'],1,'Trần là tỷ trọng việc, không phải mức tự chủ.',''],
  ['Điều kiện để sản xuất vận hành được với 1–3 người?',['Mua robot','Phần vật lý thuê ngoài, OEM/ODM, hoặc đối tác','Làm thêm giờ','Không thể'],1,'Khi đó doanh nghiệp lõi là AI Control Tower.',''],
  ['Dịch vụ tại chỗ cần tối thiểu bao nhiêu người theo bảng?',['1','1–2','2–3+','10+'],2,'Vì có phần việc vật lý không ủy quyền được.','']
 ]},

{ id:'lt1-4', t:'Thang giá trị: đi cùng LATTICE thế nào', min:30, tool:'hours',
 goals:['Mô tả hai hàng của thang giá trị','Biết bước miễn phí và chính sách phí','Dùng Tự soi và Khảo sát nhanh đúng mục đích'],
 body:`<p>LATTICE phục vụ hai nhóm khách, đi hai hàng song song (bảng gói chốt 10/10/2026, giá đã gồm VAT 10%):</p>
<div class="tbl"><table><tr><th>Bậc</th><th>Đang vận hành (<dfn data-k="nhom1">Nhóm 1</dfn>)</th><th>Khởi sự (<dfn data-k="nhom2">Nhóm 2</dfn>)</th></tr>
<tr><td>T0</td><td colspan="2"><dfn data-k="khaosat">Khảo sát nhanh</dfn> · miễn phí · 20 câu (khởi sự 19 câu), 8–10 phút</td></tr>
<tr><td>T1</td><td>LATTICE Scan · 895.000đ · qua email</td><td>LATTICE Compass · 1.950.000đ · qua email</td></tr>
<tr><td>T2</td><td>LATTICE Blueprint · 2.950.000đ · Zoom 60 phút</td><td>LATTICE Foundry · 4.950.000đ · hai buổi Zoom</td></tr>
<tr><td>T3</td><td colspan="2">LATTICE Kit · 8.950.000đ · tự triển khai theo mẫu ngành (sắp mở)</td></tr>
<tr><td>T4</td><td colspan="2">Build · theo phạm vi · 3–5 tháng, chia đợt theo cột mốc</td></tr>
<tr><td>T5</td><td colspan="2">Operate · thuê bao tháng · hủy bất cứ lúc nào</td></tr></table></div>
<p>Mỗi bước lên được trừ phí bước trước theo bảng (ví dụ Scan trừ 100% vào Blueprint nếu nâng trong 30 ngày; Blueprint trừ 100% vào Build nếu ký trong 60 ngày).</p>
<h3>Chính sách phí cần nhớ</h3>
<ul><li>Trao đổi ban đầu qua email luôn miễn phí. Khoản thu là phí tạo lập hồ sơ và quản lý, không phải phí tư vấn.</li>
<li>Đã thanh toán, LATTICE chưa gửi câu hỏi: hoàn 100%. LATTICE đã gửi câu hỏi: không hoàn.</li>
<li>LATTICE lỡ hẹn: hoàn 100%, hoặc nâng bậc kế tiếp không thu thêm, khách chọn.</li>
<li>Liên hệ chỉ qua email; công ty không liên lạc qua điện thoại hay Zalo.</li></ul>
<h3>Trước khi trả tiền</h3>
<p><b>Tự soi</b>: 14 câu, 6 nhóm, không chấm điểm, không gửi đi đâu. Bắt đầu từ câu: "Nếu anh chị nghỉ hai tuần, không liên lạc được, công ty còn chạy bình thường không?" Rồi <b>Khảo sát nhanh</b> đo những chỗ đó bằng số.</p>`,
 ex:{t:'Ai nên đi bậc nào', h:`<ul><li><b>Lam Beauty</b> đang bán, muốn biết bắt đầu từ đâu → Khảo sát nhanh → Scan.</li>
<li><b>Cơ khí Tân Phát</b> đã chắc muốn làm, cần tài liệu mang đi họp cổ đông → Blueprint.</li>
<li><b>Anh Minh</b> có ý tưởng dịch vụ học tiếng Hàn, chưa có khách trả tiền → Khảo sát nhanh (nhánh khởi sự) → Compass. Kết luận có thể là "chưa nên làm".</li></ul>`},
 help:{read:'Dùng máy tính 52 tuần bên dưới với số giờ lặp lại thật của doanh nghiệp mình.',mistakes:['Nghĩ buổi chẩn đoán miễn phí. Chỉ trao đổi ban đầu qua email là miễn phí.','Liên hệ LATTICE qua Zalo.'],rel:['u5','lt4-4','lt2-1']},
 q:[
  ['Bước nào của LATTICE là miễn phí?',['Scan','Khảo sát nhanh và trao đổi ban đầu qua email','Blueprint','Buổi Zoom 60 phút'],1,'T0 Khảo sát nhanh miễn phí; trao đổi ban đầu qua email luôn miễn phí.',''],
  ['Người có ý tưởng, chưa có doanh thu đều nên chọn gói T1 nào?',['Scan','Compass','Blueprint','Build'],1,'Compass là T1 cho người khởi sự.',''],
  ['Mốc chặn hoàn phí là gì?',['Lúc khách chuyển tiền','Lúc LATTICE gửi câu hỏi cho khách','Sau buổi Zoom','Sau 30 ngày'],1,'Đã gửi câu hỏi thì không hoàn, vì phần tạo lập hồ sơ đã làm.',''],
  ['Khi LATTICE lỡ hẹn, khách được gì?',['Không được gì','Hoàn 100% hoặc nâng bậc kế tiếp không thu thêm, khách chọn','Giảm 10%','Dời lịch'],1,'Chính sách phí trong bảng gói.',''],
  ['Kênh liên lạc chính thức với LATTICE?',['Zalo','Điện thoại','Email (và trợ lý LatticeTalk)','Facebook'],2,'Mọi trao đổi qua email.','']
 ]}
  ]},

  { id:'lt2', name:'Cấp 2 · Nền tảng', note:'Lộ trình A · chủ hộ kinh doanh, doanh nghiệp nhỏ', modules:[

{ id:'lt2-1', t:'Đọc mô hình của chính mình', min:40,
 goals:['Đánh giá năm nguồn lực bằng câu hỏi cụ thể','Hiểu các phần của điểm sẵn sàng','Biết hai điều phải sửa trước khi đưa AI vào'],
 body:`<p>Khảo sát nhanh dựng báo cáo ban đầu gồm điểm sẵn sàng 0–100, bản đồ khối đang vướng, năm nguồn lực, ba việc nên làm trước và hai điều cần sửa. Học cách đọc nó giúp anh chị tự chẩn đoán trước khi trả tiền cho ai.</p>
<h3>Năm nguồn lực, năm câu hỏi</h3>
<div class="tbl"><table><tr><th>Nguồn lực</th><th>Câu hỏi đo</th><th>Yếu khi</th></tr>
<tr><td>Vốn & Tài sản</td><td>Doanh thu dừng hôm nay, tiền đủ chi bao lâu?</td><td>Dưới 3 tháng</td></tr>
<tr><td>Thị trường & Quan hệ</td><td>Bao nhiêu doanh thu từ khách cũ, khách giới thiệu?</td><td>Dưới 10%</td></tr>
<tr><td>Thương hiệu & Uy tín</td><td>Điểm đánh giá trung bình?</td><td>Dưới 4,3 hoặc có khách chê công khai</td></tr>
<tr><td>Tri thức & Công nghệ</td><td>Cách làm việc đã viết thành quy trình chưa?</td><td>Còn nằm trong đầu</td></tr>
<tr><td>Con người & Văn hóa</td><td>Chủ chốt nghỉ hai tuần, việc gì dừng?</td><td>Từ hai việc dừng</td></tr></table></div>
<h3>Dữ liệu là phần nặng nhất</h3>
<p>Phần Dữ liệu chiếm 30% điểm sẵn sàng. AI chỉ làm đúng khi dữ liệu có một nguồn chuẩn: khách hàng, hàng/lịch, tiền/công nợ nằm ở một nơi, không phải trong điện thoại hay trong đầu.</p>
<h3>Hai điều sửa trước</h3>
<p>Ba nền được ưu tiên: quyền quyết định, dữ liệu nguồn chuẩn, quy trình. Ví dụ: "Mọi việc vượt quy định đang dồn về chủ. Đưa AI vào lúc này chỉ dời nút cổ chai sang chỗ duyệt."</p>
<blockquote>Ở mức dữ liệu thấp, tự động hóa sẽ nhân bản cái sai nhanh hơn. Việc đáng làm trước là gom dữ liệu về một chỗ.</blockquote>`,
 ex:{t:'Báo cáo ban đầu của Spa An Nhiên (minh họa)', h:`<ul><li>Vốn: 3–6 tháng → Trung bình. Quan hệ: 45% từ khách cũ → Khá. Uy tín: 4,8 → Khá.</li>
<li>Tri thức: "vài việc có ghi chú" → Trung bình. Con người: chủ nghỉ thì bán hàng và duyệt chi dừng → Yếu.</li>
<li><b>Hai điều sửa trước:</b> (1) Quyền: chủ nghỉ thì duyệt chi dừng, quyền chưa được giao. (2) Dữ liệu: lịch hẹn nằm trong điện thoại lễ tân.</li></ul>`},
 help:{read:'Trả lời năm câu hỏi trong bảng cho doanh nghiệp mình, ghi Khá / Trung bình / Yếu.',mistakes:['Chọn mức cao hơn thực tế khi không chắc. Hướng dẫn khảo sát khuyên chọn mức thấp hơn để báo cáo sát thực tế.'],rel:['qt1','lt2-2','lt1-4']},
 q:[
  ['Phần nào nặng nhất trong điểm sẵn sàng của Khảo sát nhanh?',['Công cụ','Dữ liệu (30%)','Mục tiêu','Ngân sách'],1,'Hướng dẫn câu 8: Dữ liệu là phần nặng nhất (30%).',''],
  ['Câu hỏi nào đo nguồn lực Con người?',['Điểm đánh giá trung bình','Chủ chốt nghỉ hai tuần thì việc gì dừng','Doanh thu từ khách cũ','Tiền đủ chi bao lâu'],1,'Nguồn lực Con người: chỗ gãy khi người chủ chốt vắng.',''],
  ['Vì sao không nên đưa AI vào khi mọi việc vượt quy định dồn về chủ?',['AI không làm được','AI chỉ dời nút cổ chai sang chỗ duyệt','Tốn tiền','Khách không thích'],1,'Câu chữ của phần "hai điều cần sửa".',''],
  ['Không chắc giữa hai mức khi trả lời khảo sát, nên chọn?',['Mức cao hơn','Mức thấp hơn, để báo cáo sát thực tế','Bỏ qua','Chọn ngẫu nhiên'],1,'Hướng dẫn câu 8.',''],
  ['Ba nền được ưu tiên trong "hai điều cần sửa trước"?',['Giá, kênh, quảng cáo','Quyền quyết định, dữ liệu nguồn chuẩn, quy trình','Logo, website, fanpage','Nhân sự, lương, thưởng'],1,'Chú thích luật trong mã Khảo sát nhanh.','']
 ]},

{ id:'lt2-2', t:'Chọn ba quy trình làm trước', min:45, tool:'priority',
 goals:['Tính điểm ưu tiên bằng năm biến','Áp dụng ba luật ghi đè','Hiểu vì sao là ba, không phải năm'],
 body:`<p>Công thức phải hiện ra cho khách thấy, để chứng minh kết luận không đến từ cảm tính.</p>
<blockquote><dfn data-k="diemuu">Điểm ưu tiên</dfn> = (Tần suất × Thời lượng × Mức chuẩn hóa) ÷ (Hậu quả nếu sai × Độ khó tích hợp)</blockquote>
<p>Năm biến, mỗi biến chấm 1–5. Tử số là giá trị thu được; mẫu số là cái giá phải trả để làm an toàn. Điểm cao nghĩa là thu nhiều mà trả ít: định nghĩa của thắng lợi sớm.</p>
<div class="tbl"><table><tr><th>Biến</th><th>1 điểm</th><th>5 điểm</th></tr>
<tr><td>Tần suất</td><td>Dưới 5 lần/tuần</td><td>Trên 100 lần/tuần</td></tr>
<tr><td>Thời lượng</td><td>Dưới 15 phút/lần</td><td>Trên 3 giờ/lần</td></tr>
<tr><td>Mức chuẩn hóa</td><td>Mỗi lần một khác</td><td>Viết thành quy trình rõ</td></tr>
<tr><td>Hậu quả nếu sai</td><td>Sửa trong vài phút</td><td>Mất tiền hoặc mất khách, không sửa được</td></tr>
<tr><td>Độ khó tích hợp</td><td>Một công cụ, xuất dữ liệu được</td><td>Nhiều công cụ, không lấy được dữ liệu</td></tr></table></div>
<h3>Ba luật ghi đè</h3>
<ul><li><b>L11 kích hoạt</b> (ngành có điều kiện): quy trình chạm nội dung quảng cáo bị đẩy xuống cuối, trần tự chủ L2.</li>
<li><b>L10 kích hoạt</b> (không lấy được dữ liệu ra): quy trình đó không vào danh sách; thay công cụ trước.</li>
<li><b>Việc người chủ khó chịu nhất</b> trùng hạng 2 hoặc 3: đẩy lên hạng 1. Giải được nó mua được sự ủng hộ cho phần còn lại.</li></ul>
<h3>Vì sao đúng ba</h3>
<p>Dự án thành công mất trung bình 6 tháng từ thí điểm lên vận hành thật; dự án thất bại kéo tới 18 tháng vì làm quá nhiều thứ cùng lúc. Ba quy trình chạy tốt có giá trị hơn hai mươi quy trình chạy nửa vời.</p>`,
 ex:{t:'Ba quy trình của Xưởng cà phê Mộc', h:`<p>Mở công cụ bên dưới: ba quy trình của Mộc đã được chấm sẵn. "Nhập đơn đa kênh" đứng đầu vì lặp nhiều, chuẩn hóa cao, sai thì sửa được. "Trả lời câu hỏi về cách pha" đứng thứ hai. "Đặt hạt thô" đứng cuối vì sai là mất tiền.</p>`},
 help:{read:'Kéo thanh trượt cho một quy trình thật của doanh nghiệp mình và xem điểm thay đổi.',mistakes:['Chọn quy trình "ấn tượng" thay vì quy trình điểm cao.','Quên luật ghi đè L10, L11.'],rel:['lt2-1','ai6','lt4-4']},
 q:[
  ['Mẫu số của công thức điểm ưu tiên gồm gì?',['Tần suất × Thời lượng','Hậu quả nếu sai × Độ khó tích hợp','Mức chuẩn hóa × Tần suất','Chi phí × Thời gian'],1,'Mẫu số là cái giá phải trả để làm an toàn.',''],
  ['Ngành có điều kiện (L11 kích hoạt): quy trình chạm nội dung quảng cáo thì?',['Lên hạng 1','Bị đẩy xuống cuối, trần tự chủ L2','Bỏ hẳn','Lên L4'],1,'Luật ghi đè thứ nhất.',''],
  ['Việc người chủ khó chịu nhất đang ở hạng 3. Làm gì?',['Giữ nguyên','Đẩy lên hạng 1','Loại khỏi danh sách','Chuyển cho AI quyết'],1,'Luật ghi đè thứ ba: kỹ thuật, không phải chiều khách.',''],
  ['Vì sao đề xuất đúng ba quy trình?',['Ba là con số đẹp','Làm quá nhiều thứ cùng lúc là nguyên nhân dự án thất bại kéo dài','Khách chỉ trả tiền cho ba','AI chỉ làm được ba'],1,'Ba quy trình chạy tốt có giá trị hơn hai mươi quy trình chạy nửa vời.',''],
  ['Một quy trình: tần suất 5, thời lượng 2, chuẩn hóa 4, hậu quả 2, tích hợp 1. Điểm ưu tiên?',['10','20','40','8'],1,'(5 × 2 × 4) ÷ (2 × 1) = 40 ÷ 2 = 20.','Nhân tử số, nhân mẫu số, rồi chia.']
 ]},

{ id:'lt2-3', t:'SOP trước, agent sau', min:35,
 goals:['Thuộc sáu điều kiện lập một agent','Biết khi nào phải dừng tạo agent','Nối SOP với agent'],
 body:`<p>Một agent chỉ được tạo ra khi hội đủ sáu điều kiện. Đây là bộ lọc quan trọng nhất trong toàn bộ đề án, vì nó chặn nguyên nhân thất bại số 1 (tiêu chí thành công không rõ, 41%).</p>
<div class="tbl"><table><tr><th>#</th><th>Điều kiện</th><th>Câu hỏi kiểm tra</th></tr>
<tr><td>1</td><td>Đầu vào xác định</td><td>Agent nhận gì, định dạng nào, từ đâu?</td></tr>
<tr><td>2</td><td>Đầu ra đo lường được</td><td>Thành công trông thế nào bằng con số?</td></tr>
<tr><td>3</td><td>Nguồn dữ liệu đáng tin</td><td>Dữ liệu ở đâu, ai cập nhật, khi nào?</td></tr>
<tr><td>4</td><td>Quyền hạn rõ ràng</td><td>Được đọc gì, ghi gì, chi bao nhiêu?</td></tr>
<tr><td>5</td><td>Tiêu chí chuyển việc cho người</td><td>Khi nào phải dừng và leo thang?</td></tr>
<tr><td>6</td><td>Cơ chế đánh giá</td><td>Đo chất lượng bằng bộ test nào, tần suất nào?</td></tr></table></div>
<blockquote>Nếu không trả lời được cả sáu: đừng tạo agent, hãy viết SOP trước.</blockquote>
<p>Một SOP tốt trả lời sẵn điều kiện 1, 2, 5. Phần còn lại (dữ liệu, quyền, đánh giá) là việc của người thiết kế hệ thống.</p>`,
 ex:{t:'Agent "Trả lời câu hỏi lặp" của Spa An Nhiên', h:`<ul><li><b>1 Đầu vào:</b> tin nhắn Zalo OA từ khách.</li><li><b>2 Đầu ra:</b> câu trả lời đúng chính sách; mục tiêu 90% không bị sửa.</li><li><b>3 Dữ liệu:</b> bảng giá liệu trình và chính sách đổi lịch bản hiện hành, lễ tân cập nhật mỗi thứ Hai.</li><li><b>4 Quyền:</b> đọc lịch trống, không đọc hồ sơ da liễu; không hứa giảm giá.</li><li><b>5 Chuyển người:</b> khách nhắc dị ứng, khiếu nại, xin hoàn tiền.</li><li><b>6 Đánh giá:</b> 30 câu hỏi mẫu chạy mỗi tuần.</li></ul>`},
 help:{read:'Lấy một việc anh chị muốn giao AI, thử trả lời sáu câu. Câu nào bỏ trống là việc cần làm trước.',mistakes:['Tạo agent trước, viết quy trình sau.','Bỏ qua điều kiện 6, nên không bao giờ nâng được mức tự chủ.'],rel:['qt3','lt2-4','lt3-3']},
 q:[
  ['Điều kiện số 6 để lập agent là gì?',['Có ngân sách','Cơ chế đánh giá','Có giao diện','Có tên gọi'],1,'Điều kiện bổ sung: đo chất lượng bằng bộ test nào, tần suất nào.',''],
  ['Không trả lời được cả sáu điều kiện thì?',['Tạo agent ở L1','Viết SOP trước','Thuê ngoài','Dùng chatbot có sẵn'],1,'Đề án mục 5.2.',''],
  ['Bộ lọc sáu điều kiện phòng ngừa nguyên nhân thất bại nào?',['Thiếu GPU','Tiêu chí thành công không rõ (41%)','Giá cao','Thiếu nhân lực'],1,'Nguyên nhân số 1 theo Forrester.',''],
  ['Điều kiện "quyền hạn rõ ràng" hỏi gì?',['Agent tên gì','Được đọc gì, ghi gì, chi bao nhiêu','Ai thiết kế','Chạy trên máy nào'],1,'Bảng sáu điều kiện.',''],
  ['SOP tốt trả lời sẵn những điều kiện nào?',['Chỉ điều kiện 6','Đầu vào, đầu ra, tiêu chí chuyển người','Chỉ quyền hạn','Không điều kiện nào'],1,'SOP có mục tiêu, đầu vào, ngoại lệ và định nghĩa xong.','']
 ]},

{ id:'lt2-4', t:'Sáu mức tự chủ', min:45, tool:'autonomy',
 goals:['Phân biệt L0 đến L5','Nắm điều kiện thăng cấp bằng số','Hiểu nguyên tắc hạ cấp tự động'],
 body:`<p><dfn data-k="tuchu">Mức tự chủ</dfn> gắn cho từng tác vụ, không cho cả bộ phận hay cả agent. Cùng một Team AI có tác vụ ở L1 và tác vụ ở L3. Khuyến nghị tối đa L3; việc chiến lược ở L1.</p>
<p>Từ L3 trở đi agent được hành động ra bên ngoài. Đó là ranh giới quan trọng nhất của toàn bộ mô hình (vạch đỏ trong công cụ bên dưới).</p>
<h3>Thăng cấp là hàm của bốn biến</h3>
<p>Tỷ lệ chính xác × giá trị giao dịch × khả năng phục hồi khi sai × mức rủi ro danh tiếng/pháp lý. Không bao giờ nâng mức vì "thấy nó làm tốt".</p>
<h3>Hạ cấp tự động</h3>
<p>Phải có cơ chế tự động hạ mức khi chất lượng tụt. Ví dụ: hai sự cố trong 30 ngày thì tác vụ tự rơi từ L3 về L2 chờ người xem xét; kho tri thức LATTICE nêu trường hợp agent rơi từ L4 về L2. Tự chủ là quyền có thể bị thu hồi, không phải trạng thái vĩnh viễn.</p>
<h3>Một quy ước song song</h3>
<p>Trong tài liệu kiến trúc theo loại hình, LATTICE dùng thêm quy ước gọn A1 Hỗ trợ · A2 Đề xuất → Người duyệt · A3 Thực hiện trong giới hạn, để vẽ sơ đồ khối. Đây là quy ước thiết kế, không phải chuẩn ngành.</p>`,
 ex:{t:'Một tác vụ đi qua các mức', h:`<p>Tác vụ "gửi email nhắc hẹn" của Spa An Nhiên:</p>
<ul><li>Tháng 1, <b>L1</b>: AI đề xuất danh sách khách cần nhắc. Sau 30 mẫu, đúng 80%.</li>
<li>Tháng 2, <b>L2</b>: AI soạn email, lễ tân duyệt. 65% gửi đi không sửa.</li>
<li>Tháng 4, <b>L3</b>: có rollback (gửi thư đính chính), 100 lần gửi đúng 94% → AI tự gửi trong khung giờ đã định.</li>
<li>Tháng 6: hai lần gửi nhầm giờ trong 30 ngày → tự hạ về <b>L2</b>.</li></ul>`},
 help:{read:'Bấm từng mức trong công cụ, đọc cột "Điều kiện để lên mức này".',mistakes:['Gắn một mức cho cả bộ phận marketing.','Không có rollback mà vẫn cho lên L3.'],rel:['lt2-5','lt3-3','lt4-5']},
 q:[
  ['Mức tự chủ được gắn cho đâu?',['Cả bộ phận','Cả agent','Từng tác vụ','Cả doanh nghiệp'],2,'Gắn cho từng tác vụ.',''],
  ['Từ mức nào agent được hành động ra bên ngoài?',['L1','L2','L3','L5'],2,'Vạch đỏ: từ L3 trở đi.',''],
  ['Điều kiện để lên L2?',['≥30 mẫu, đề xuất đúng ≥70%','Tỷ lệ đầu ra được duyệt không sửa ≥60%','≥90% chính xác trên 100 giao dịch','Có kill switch'],1,'L1 cần ≥30 mẫu và ≥70%; L2 cần ≥60% duyệt không sửa; L3 cần ≥90% trên 100 giao dịch và rollback.',''],
  ['Ví dụ hạ cấp tự động trong đề án?',['Một sự cố là về L0','Hai sự cố trong 30 ngày thì từ L3 về L2','Không bao giờ hạ','Hạ theo lịch'],1,'Tự chủ là quyền có thể bị thu hồi.',''],
  ['Mức tự chủ khuyến nghị tối đa?',['L1','L2','L3','L5'],2,'L4, L5 hiếm dùng.','']
 ]},

{ id:'lt2-5', t:'Ma trận quyền và bốn ranh giới Việt Nam', min:40,
 goals:['Xếp việc vào bốn nhóm quyền','Thuộc bốn ranh giới bắt buộc có người tại Việt Nam','Biết điều gì bị chặn cứng'],
 body:`<div class="tbl"><table><tr><th>Nhóm</th><th>Ví dụ</th><th>Kiểm soát</th></tr>
<tr><td>AI tự thực hiện</td><td>Tổng hợp dữ liệu, CSKH theo chính sách, lập lịch, giao dịch nhỏ trong hạn mức</td><td>Log tự động, review mẫu ngẫu nhiên hằng tuần</td></tr>
<tr><td>AI thực hiện + nhật ký bắt buộc</td><td>Đổi giá trong biên độ, chỉnh ngân sách quảng cáo nhỏ, cấp voucher, đề nghị đặt hàng khi chạm ngưỡng</td><td>Nhật ký + cảnh báo tức thời + hạn mức cứng</td></tr>
<tr><td>Bắt buộc người phê duyệt</td><td>Hợp đồng, chuyển tiền lớn, nhân sự nhạy cảm, đổi chiến lược/giá lớn, nội dung rủi ro pháp lý</td><td>Chặn cứng ở tầng orchestration</td></tr>
<tr><td>Người trực tiếp làm</td><td>Việc vật lý, đàm phán chiến lược, xử lý khủng hoảng, trách nhiệm nghề nghiệp</td><td>Không ủy quyền</td></tr></table></div>
<h3>Bốn ranh giới riêng cho Việt Nam 2026</h3>
<ol><li><b>Livestream và nội dung bán hàng:</b> xác minh danh tính người livestream; nội dung AI tạo phải qua duyệt của người có danh tính đăng ký.</li>
<li><b>Công bố sản phẩm sức khỏe/mỹ phẩm/TPCN:</b> không bao giờ để agent tự phát ngôn công dụng.</li>
<li><b>Hóa đơn và thuế:</b> AI chuẩn bị, con người ký. Không có ngoại lệ.</li>
<li><b>Dữ liệu cá nhân:</b> quyền đọc phải phân tách.</li></ol>
<p>Kho tri thức LATTICE trả lời câu "AI có thể tự chuyển tiền không": đăng bài đã kiểm duyệt và chốt đơn nhỏ trong hạn mức thì có, ở L3; chuyển tiền lớn, ký hợp đồng và mọi cam kết pháp lý thì không, chặn cứng ở tầng orchestration.</p>`,
 ex:{t:'Xếp nhóm cho Lam Beauty', h:`<ul><li>Trả lời "đơn của tôi đến đâu rồi" → AI tự thực hiện.</li><li>Cấp voucher 50.000đ cho đơn giao trễ → AI thực hiện + nhật ký.</li><li>Bài đăng "kem giúp trắng da" → bắt buộc người duyệt, và câu công dụng bị gạch theo ranh giới 2.</li><li>Ký hợp đồng phân phối độc quyền → người duyệt, chặn cứng.</li><li>Kiểm lô hàng về kho → người trực tiếp làm.</li></ul>`},
 help:{read:'Liệt kê mười việc, xếp mỗi việc vào một trong bốn nhóm.',mistakes:['Để AI ký hóa đơn vì "chỉ là thủ tục".','Coi duyệt nội dung livestream là tùy chọn.'],rel:['qt4','ai3','u1']},
 q:[
  ['Ký hợp đồng thuộc nhóm nào?',['AI tự thực hiện','AI thực hiện + nhật ký','Bắt buộc người phê duyệt, chặn cứng','Không cần kiểm soát'],2,'Hợp đồng và cam kết pháp lý: chặn cứng ở tầng orchestration.',''],
  ['Cấp voucher, xử lý khiếu nại thông thường thuộc nhóm?',['AI thực hiện + nhật ký bắt buộc','Người trực tiếp làm','Bắt buộc người duyệt','Không thuộc nhóm nào'],0,'Có nhật ký, cảnh báo tức thời, hạn mức cứng.',''],
  ['Ranh giới về hóa đơn và thuế?',['AI tự ký khi đúng mẫu','AI chuẩn bị, con người ký, không ngoại lệ','Thuê ngoài toàn bộ','Không cần hóa đơn'],1,'Ranh giới số 3.',''],
  ['Đâu KHÔNG phải một trong bốn ranh giới Việt Nam?',['Livestream và nội dung bán hàng','Công bố sản phẩm sức khỏe','Màu sắc logo','Dữ liệu cá nhân'],2,'Bốn ranh giới: livestream, sản phẩm sức khỏe, hóa đơn & thuế, dữ liệu cá nhân.',''],
  ['AI được chốt đơn nhỏ trong hạn mức ở mức nào?',['L0','L1','L3','Không bao giờ'],2,'Kho tri thức: chốt đơn nhỏ trong hạn mức thì có, ở L3.','']
 ]}
  ]},

  { id:'lt3', name:'Cấp 3 · Vận hành', note:'Lộ trình B · người trực tiếp quản trị hệ thống · cần qua Cấp 2', modules:[

{ id:'lt3-1', t:'Work Object: việc có sổ sách', min:40,
 goals:['Thuộc 11 trường của Work Object','Hiểu vì sao việc không được chuyển bằng hội thoại mơ hồ','Áp dụng quy tắc "mọi việc AI có người đứng tên"'],
 body:`<p>Nhiệm vụ không được chuyển tự do giữa các agent bằng hội thoại mơ hồ. Mọi việc đi qua một <dfn data-k="wo">Work Object</dfn>:</p>
<div class="tbl"><table><tr><th>Trường</th><th>Nội dung</th><th>Vì sao bắt buộc</th></tr>
<tr><td>objective</td><td>Mục tiêu diễn đạt bằng kết quả</td><td>Chống trôi mục tiêu</td></tr>
<tr><td>owner</td><td>Người hoặc agent chịu trách nhiệm</td><td>Không có chủ = không ai sửa khi sai</td></tr>
<tr><td>inputs</td><td>Dữ liệu, tài liệu, ngữ cảnh</td><td>Truy vết nguồn</td></tr>
<tr><td>deadline</td><td>Hạn chót</td><td>Cơ sở cho SLA</td></tr>
<tr><td>budget</td><td>Ngân sách tiền và token</td><td>Chặn chi phí chạy loạn</td></tr>
<tr><td>risk_level</td><td>Thấp / trung bình / cao</td><td>Quyết định mức phê duyệt</td></tr>
<tr><td>done_criteria</td><td>Tiêu chí hoàn thành</td><td>Điều kiện đóng việc</td></tr>
<tr><td>evidence</td><td>Bằng chứng thực hiện</td><td>Kiểm toán được</td></tr>
<tr><td>approval_state</td><td>Trạng thái phê duyệt</td><td>Ngăn hành động vượt quyền</td></tr>
<tr><td>trace_id</td><td>ID truy vết xuyên agent</td><td>Điều tra sự cố</td></tr>
<tr><td>cost_actual</td><td>Chi phí thực tế</td><td>Đơn vị kinh tế từng quy trình</td></tr></table></div>
<p>Nhờ vậy doanh nghiệp thành một hệ thống có sổ sách, không phải một chuỗi chatbot khó kiểm soát.</p>
<h3>LATTICE Work thi hành thế nào</h3>
<p>LATTICE Work lấy "việc được giao" làm trung tâm, mỗi việc mang theo mạch trao đổi của nó. Quy tắc trung tâm: mọi việc giao cho agent đều phải có một người chủ trì (trường owner không cho phép rỗng), và kết quả của agent bắt buộc qua trạng thái Chờ duyệt. Lý do: AI không chịu trách nhiệm được, nó không giải trình với khách, không ra tòa.</p>`,
 ex:{t:'Một Work Object của LATTICE', h:`<div class="tbl"><table><tr><th>Trường</th><th>Giá trị</th></tr>
<tr><td>objective</td><td>Gửi bộ câu hỏi bổ sung đúng loại hình cho hồ sơ LTC đã thu tiền</td></tr>
<tr><td>owner</td><td>Người 2 (Vận hành & Quan hệ)</td></tr>
<tr><td>inputs</td><td>Kết quả Khảo sát nhanh, loại hình, ngành</td></tr>
<tr><td>deadline</td><td>2 ngày làm việc từ khi tiền về</td></tr>
<tr><td>risk_level</td><td>Trung bình: gửi đi là đóng mốc hoàn phí</td></tr>
<tr><td>done_criteria</td><td>Khách nhận thư; trạng thái hồ sơ chuyển "đã gửi câu hỏi"</td></tr>
<tr><td>approval_state</td><td>Chờ duyệt (agent soạn ở L2)</td></tr></table></div>`},
 help:{read:'Chuyển một việc đang giao qua chat thành một Work Object 11 trường.',mistakes:['Để owner là chính agent.','Bỏ trace_id, đến khi có sự cố không lần được.'],rel:['ai2','lt3-3','lt4-2']},
 q:[
  ['Trường nào ngăn hành động vượt quyền?',['objective','approval_state','inputs','cost_actual'],1,'approval_state: trạng thái phê duyệt.',''],
  ['Vì sao trường owner bắt buộc?',['Để đẹp báo cáo','Không có chủ sở hữu thì không ai sửa khi sai','Để tính lương','Để phân quyền đăng nhập'],1,'Bảng Work Object.',''],
  ['Trường dùng để điều tra sự cố xuyên agent?',['trace_id','deadline','budget','evidence'],0,'trace_id là ID truy vết xuyên agent.',''],
  ['Quy tắc trung tâm của LATTICE Work?',['Agent tự duyệt việc của mình','Mọi việc giao cho agent đều phải có một người chủ trì','Không dùng agent','Mọi tin nhắn đều là việc'],1,'Vì AI không chịu trách nhiệm được.',''],
  ['Work Object có bao nhiêu trường bắt buộc theo đề án?',['6','9','11','13'],2,'9 trường gốc + trace_id + cost_actual = 11.','']
 ]},

{ id:'lt3-2', t:'Knowledge base và sổ đăng bộ mô hình', min:40,
 goals:['Vận hành kho tri thức có kiểm','Thi hành luật một mô hình, một định nghĩa','Đổi chính sách mà không vỡ nhất quán'],
 body:`<h3>Lớp tri thức và trí nhớ</h3>
<p>Lớp Identity & Memory quyết định agent cộng dồn giá trị hay chạm trần. Câu hỏi kiểm tra: kết quả nghiên cứu hôm nay có được agent khác dùng lại tháng sau không? Lớp Enterprise Knowledge cần một nguồn sự thật duy nhất cho mỗi loại dữ liệu.</p>
<h3><dfn data-k="sodangbo">Sổ đăng bộ mô hình</dfn></h3>
<p>Luật: mỗi mô hình có đúng một định nghĩa gốc, ở đúng một nơi; mọi nơi khác trích dẫn nguyên văn, không diễn đạt lại.</p>
<div class="tbl"><table><tr><th>Mã</th><th>Mô hình</th><th>Gốc</th></tr>
<tr><td>MR-01</td><td>Trần tự động hóa tám nhóm</td><td>Đề án mục 3</td></tr>
<tr><td>MR-02</td><td>Sáu mức tự chủ</td><td>Đề án mục 7</td></tr>
<tr><td>MR-03</td><td>Work Object 11 trường</td><td>Đề án mục 6</td></tr>
<tr><td>MR-04</td><td>Ma trận quyền · Tầng con người</td><td>Đề án mục 4, 8</td></tr>
<tr><td>MR-05</td><td>Bảy lớp hạ tầng</td><td>Đề án mục 9</td></tr>
<tr><td>MR-09</td><td>Sáu điều kiện lập agent</td><td>Đề án mục 5.2</td></tr>
<tr><td>MR-11</td><td>Bốn ranh giới Việt Nam</td><td>Đề án mục 8</td></tr>
<tr><td>MR-13</td><td>Chính sách gói, phí, hoàn phí</td><td>Sổ quyết định</td></tr></table></div>
<h3>Đổi chính sách thế nào</h3>
<ul><li>Luồng bên ngoài (trợ lý, web, thư) chỉ <b>đọc</b> sổ chính sách, không bao giờ ghi.</li>
<li>Đổi giá là việc của luồng quản trị nội bộ, qua quy trình đổi chính sách và một mục trong Sổ quyết định.</li>
<li>Trước mỗi lần đổi, mở bảng "ai nói gì ở đâu" và sửa hết cùng lúc; đưa câu cũ vào danh sách câu đã bỏ.</li></ul>
<blockquote>Với một công ty bán chính khả năng thiết kế hệ thống kiểm soát, sự nhất quán đó không phải chi phí vận hành, nó là sản phẩm.</blockquote>`,
 ex:{t:'Sổ quyết định của LATTICE', h:`<p>Định dạng mỗi mục: bối cảnh · quyết định · hệ quả · trạng thái. Không xóa mục cũ, thay bằng quyết định mới dẫn chiếu quyết định cũ.</p>
<p>Ví dụ D-C01 "Một hệ tên gói, một chính sách phí": chọn website thật và kho tri thức chatbot làm nguồn gốc, sửa bộ slide và bản mô tả website theo, lưu bản trước khi sửa vào thư mục riêng.</p>`},
 help:{read:'Chọn ba khái niệm quan trọng của doanh nghiệp mình, viết định nghĩa gốc và ghi nơi lưu.',mistakes:['Mỗi tài liệu tự viết lại định nghĩa theo cách riêng.','Sửa giá trên website mà quên chatbot.'],rel:['ai4','lt3-1','lt4-2']},
 q:[
  ['Luật của sổ đăng bộ mô hình?',['Mỗi tài liệu tự định nghĩa','Một mô hình, một định nghĩa gốc, nơi khác trích dẫn nguyên văn','Định nghĩa đổi theo khách','Không cần định nghĩa'],1,'Mục 13 tài liệu chu trình khách hàng.',''],
  ['Luồng tương tác bên ngoài được làm gì với sổ chính sách?',['Đọc và ghi','Chỉ đọc','Chỉ ghi','Không truy cập'],1,'Luồng A chỉ đọc sổ chính sách, không bao giờ ghi.',''],
  ['Câu hỏi kiểm tra của lớp Identity & Memory?',['Có dashboard không','Kết quả nghiên cứu hôm nay có được agent khác dùng lại tháng sau không','Có bao nhiêu agent','Chi phí bao nhiêu'],1,'Bảng bảy lớp hạ tầng.',''],
  ['Sổ quyết định xử lý mục cũ thế nào?',['Xóa khi lỗi thời','Không xóa; thay bằng quyết định mới dẫn chiếu quyết định cũ','Sửa trực tiếp','Ẩn đi'],1,'Quy ước của SO-QUYET-DINH.',''],
  ['MR-02 là mô hình nào?',['Bảy lớp hạ tầng','Sáu mức tự chủ L0–L5','Work Object','Trần tự động hóa'],1,'Sổ đăng bộ mô hình.','']
 ]},

{ id:'lt3-3', t:'Bộ công cụ an toàn khi vận hành', min:40,
 goals:['Vận hành kill switch, rollback, trần chi phí','Chạy eval hằng tuần và đọc kết quả','Định nghĩa "sự cố" cụ thể cho quy trình của mình'],
 body:`<p>Ba lớp phòng vệ khi agent làm sai: rollback bắt buộc trước khi lên L3; eval suite chạy hằng tuần để phát hiện chất lượng tụt; cơ chế tự động hạ mức. Ngoài ra luôn có <dfn data-k="kill">kill switch</dfn> dừng mọi hành động ra ngoài trong một thao tác.</p>
<h3>Định nghĩa sự cố bằng chữ cụ thể</h3>
<p>Luật hạ cấp chỉ chạy được khi "sự cố" được định nghĩa. Với chu trình khách hàng của chính mình, LATTICE ghi bốn loại:</p>
<ul><li>Một thư gửi sai người hoặc sai nội dung chính sách.</li><li>Một đề xuất có con số không dẫn được về câu trả lời của khách.</li><li>Một hồ sơ quá hạn cam kết mà khách phải nhắc trước.</li><li>Một câu chatbot trả lời sai về phí, hoàn phí, hoặc hạn đợt.</li></ul>
<h3>Ràng buộc hạ tầng cũng là rủi ro</h3>
<p>Thư đi qua MailApp có trần 100 thư/ngày; một hồ sơ tiêu thụ tối thiểu 5 thư. Chạm trần là "hỏng im lặng": khách không nhận được gì và không ai biết. Biện pháp: hàng đợi gửi theo ngày ưu tiên thư xác nhận thanh toán; bảng đếm thư còn lại trên trang quản trị, cảnh báo ở 20 thư; dưới 5 thư chỉ giữ thư xác nhận thanh toán.</p>
<h3>Diễn tập</h3>
<p>Trước khi đưa trợ lý lên sóng, LATTICE đặt điều kiện kiểm thử 60 ca, diễn tập bốn sự cố và sáu cổng duyệt. Không nén việc này vào tuần đông khách nhất.</p>`,
 ex:{t:'Phiếu sự cố mẫu', h:`<ul><li><b>Sự cố:</b> chatbot trả lời "buổi chẩn đoán miễn phí" (câu đã bỏ).</li><li><b>Phát hiện:</b> eval tuần, câu hỏi mẫu số 14.</li><li><b>Xử lý:</b> rút cặp hỏi đáp lỗi khỏi kho; thêm câu vào danh sách câu đã bỏ; kiểm lại kịch bản kiểm tự động.</li><li><b>Mức tự chủ:</b> sự cố thứ hai trong 30 ngày → tác vụ trả lời về phí tự hạ hai bậc, chờ người xem xét.</li></ul>`},
 help:{read:'Viết bốn dòng "sự cố là gì" cho một quy trình đang chạy ở doanh nghiệp mình.',mistakes:['Có kill switch nhưng chưa ai thử bấm.','Không theo dõi trần của hạ tầng (thư, API).'],rel:['ai7','lt2-4','lt3-4']},
 q:[
  ['Ba lớp phòng vệ khi agent làm sai?',['Thuê người, mua bảo hiểm, xin lỗi','Rollback trước L3, eval hằng tuần, tự động hạ mức','Tắt máy, gọi điện, báo cáo','Đổi mô hình, đổi prompt, đổi nhà cung cấp'],1,'Kho tri thức LATTICE.',''],
  ['Vì sao phải định nghĩa "sự cố" bằng chữ cụ thể?',['Cho đủ tài liệu','Để luật hạ cấp tự động chạy được','Để báo cáo cổ đông','Vì luật yêu cầu'],1,'Không định nghĩa thì không đếm được hai sự cố trong 30 ngày.',''],
  ['"Hỏng im lặng" khi chạm trần thư nghĩa là?',['Hệ thống báo lỗi to','Khách không nhận được gì và không ai biết','Thư bị trễ vài phút','Thư vào spam'],1,'Mục 3 tài liệu chu trình khách hàng.',''],
  ['Khi thư còn dưới 5 lượt trong ngày, giữ loại thư nào?',['Thư nuôi dưỡng','Thư xác nhận thanh toán','Bản tin','Thư mời hội thảo'],1,'Cơ chế nhường trần (D-C07).',''],
  ['Điều kiện LATTICE đặt trước khi đưa trợ lý lên sóng?',['Có 1.000 khách','Kiểm thử 60 ca, diễn tập bốn sự cố, sáu cổng duyệt','Có video giới thiệu','Không cần điều kiện'],1,'Tài liệu chu trình mục 17.','']
 ]},

{ id:'lt3-4', t:'Quản trị bằng ngoại lệ: bốn vòng kiểm soát', min:40,
 goals:['Mô tả bốn vòng kiểm soát','Thiết kế đường đi ngoại lệ theo loại vấn đề','Dựng nhịp kiểm toán người'],
 body:`<div class="tbl"><table><tr><th>Vòng</th><th>Ai</th><th>Kiểm tra gì</th><th>Tần suất</th></tr>
<tr><td>1 · Thực thi</td><td>Agent chuyên môn</td><td>Tự kiểm đầu ra theo tiêu chí hoàn thành</td><td>Mỗi Work Object</td></tr>
<tr><td>2 · Quản lý</td><td>Trưởng khối và giám đốc phụ trách</td><td>Chất lượng, chi phí, tiến độ của Team AI</td><td>Hằng ngày</td></tr>
<tr><td>3 · Kiểm soát độc lập</td><td>Risk & Compliance Agent</td><td>Cả agent thực thi lẫn vai điều phối; có quyền tạm dừng</td><td>Liên tục + hằng tuần</td></tr>
<tr><td>4 · Kiểm toán người</td><td>Con người</td><td>Mẫu ngẫu nhiên, xem xét sự cố, duyệt thay đổi mức tự chủ</td><td>Hằng tuần + hằng quý</td></tr></table></div>
<h3>Ngoại lệ theo loại vấn đề</h3>
<div class="tbl"><table><tr><th>Ngoại lệ</th><th>Người xử lý</th></tr>
<tr><td>Giá, chiết khấu, điều kiện thương mại</td><td>Thẩm quyền kinh doanh</td></tr>
<tr><td>Lịch, công suất, đối tác không xác nhận</td><td>Phụ trách vận hành</td></tr>
<tr><td>Chất lượng, an toàn, sai sót chuyên môn</td><td>Phụ trách chuyên môn</td></tr>
<tr><td>Thanh toán, công nợ, hoàn tiền</td><td>Thẩm quyền tài chính</td></tr>
<tr><td>Hợp đồng, quyền dữ liệu, tuân thủ</td><td>Pháp chế/tuân thủ</td></tr>
<tr><td>Vượt thẩm quyền, đổi chính sách lớn</td><td>Ban điều hành</td></tr></table></div>
<p>Sự cố khẩn cấp có đường chuyển trực tiếp đến người phụ trách, không chờ hàng đợi phê duyệt thông thường hay chờ CEO.</p>
<blockquote>Luồng nội bộ chỉ nhìn luồng bên ngoài qua nhật ký sự kiện. Không ai trong nội bộ mở hộp thư khách để biết chuyện gì đang xảy ra.</blockquote>`,
 ex:{t:'Một ngày ngoại lệ ở Spa An Nhiên', h:`<ul><li>Khách xin đổi lịch lần 3 → phụ trách vận hành (lễ tân trưởng).</li><li>Khách báo kích ứng sau liệu trình → phụ trách chuyên môn, kích hoạt quy trình sự cố, đường chuyển trực tiếp.</li><li>Khách xin hoàn 1,2 triệu → thẩm quyền tài chính (chủ spa kiêm).</li><li>AI Risk tạm dừng chiến dịch tin nhắn vì 30% số điện thoại thiếu Consent → vòng 3.</li></ul>`},
 help:{read:'Viết bảng "loại ngoại lệ → người xử lý → thời hạn" cho doanh nghiệp mình.',mistakes:['Cho mọi ngoại lệ về CEO.','Để agent kiểm soát độc lập báo cáo cho chính khối nó kiểm.'],rel:['qt7','qt4','lt3-5']},
 q:[
  ['Vòng nào có quyền tạm dừng quy trình?',['Vòng 1','Vòng 2','Vòng 3 · Kiểm soát độc lập','Không vòng nào'],2,'Risk & Compliance Agent có quyền tạm dừng.',''],
  ['Vòng 4 do ai thực hiện?',['Agent','Trưởng khối AI','Con người','Nhà cung cấp'],2,'Kiểm toán người.',''],
  ['Khách báo sai sót chuyên môn, ai xử lý?',['Thẩm quyền kinh doanh','Phụ trách chuyên môn','Pháp chế','CEO'],1,'Chất lượng, an toàn, sai sót chuyên môn → phụ trách chuyên môn.',''],
  ['Sự cố khẩn cấp đi đường nào?',['Hàng đợi phê duyệt thông thường','Đường chuyển trực tiếp đến người phụ trách phù hợp','Chờ CEO','Chờ cuối tuần'],1,'Không phụ thuộc hàng đợi hay chờ CEO.',''],
  ['Luồng nội bộ theo dõi luồng bên ngoài qua đâu?',['Đọc hộp thư khách','Nhật ký sự kiện','Hỏi nhân viên','Zalo nhóm'],1,'Mô hình vận hành LATTICE mục 01.','']
 ]},

{ id:'lt3-5', t:'Chỉ số, kinh tế học và lộ trình 12 tháng', min:45,
 goals:['Theo dõi sáu chỉ số kinh tế của mô hình','Đi lộ trình bốn giai đoạn có điều kiện chuyển bằng số','Dùng checklist 30/60/90 ngày'],
 body:`<div class="tbl"><table><tr><th>Chỉ số</th><th>Công thức</th><th>Ngưỡng lành mạnh</th></tr>
<tr><td>Doanh thu / người</td><td>Doanh thu ÷ số người</td><td>Tăng ≥50%/năm</td></tr>
<tr><td>Chi phí AI / doanh thu</td><td>Chi hạ tầng AI ÷ doanh thu</td><td>2–8% tùy ngành</td></tr>
<tr><td>Chi phí mỗi Work Object</td><td>Tổng chi phí ÷ số việc xong</td><td>Giảm dần</td></tr>
<tr><td><dfn data-k="tuxuly">Tỷ lệ tự xử lý</dfn></td><td>Việc AI xong không cần người ÷ tổng việc</td><td>Tăng dần, mục tiêu &gt;70%</td></tr>
<tr><td>Hoàn vốn mỗi quy trình</td><td>Chi phí xây ÷ tiết kiệm tháng</td><td>&lt;6 tháng (trung vị ngành ~5,1)</td></tr>
<tr><td>Số ngày tiền mặt</td><td>Tiền mặt ÷ chi phí ngày</td><td>&gt;180 ngày</td></tr></table></div>
<h3>Bốn giai đoạn</h3>
<div class="tbl"><table><tr><th>Giai đoạn</th><th>Thời lượng</th><th>Điều kiện chuyển</th></tr>
<tr><td>1 · AI hỗ trợ</td><td>1–3 tháng</td><td>Knowledge base phủ ≥80% câu hỏi lặp lại</td></tr>
<tr><td>2 · AI workflow</td><td>2–4 tháng</td><td>≥5 quy trình chạy ổn định ở L3</td></tr>
<tr><td>3 · Team AI</td><td>3–6 tháng</td><td>Tự xử lý &gt;60%; hàng chờ phê duyệt &lt;24h</td></tr>
<tr><td>4 · Tối ưu có kiểm soát</td><td>Liên tục</td><td>—</td></tr></table></div>
<p>Trong lộ trình LATTICE, quy trình đầu tiên chạy ở L1–L2 khoảng tháng thứ 3 và lên L3 khoảng tháng thứ 6. Ai hứa kết quả trong vài tuần là dấu hiệu họ bỏ qua bước đo lường.</p>
<h3>30 / 60 / 90 ngày</h3>
<ul><li><b>30:</b> liệt kê quy trình kèm thời gian; chọn đúng 3; viết SOP trước khi tạo agent; gom dữ liệu khách về một chỗ; đặt trần chi phí AI.</li>
<li><b>60:</b> 3 agent ở L1–L2; 3–5 tích hợp; knowledge base; audit log và kill switch; ký với kế toán ngoài và tư vấn pháp lý.</li>
<li><b>90:</b> ít nhất 1 quy trình lên L3 có rollback; chạy eval lần đầu, ghi điểm gốc; khởi động một gốc nhiều nhánh; báo cáo ngoại lệ hằng tuần; rà tuân thủ; lịch cố định với cố vấn.</li></ul>`,
 ex:{t:'Hoàn vốn quy trình "nhập đơn" của Mộc', h:`<p>Chi phí dựng: 9 triệu (công cụ gom đơn + cấu hình). Tiết kiệm: 6 giờ/tuần × khoảng 4,3 tuần × 70.000đ/giờ ≈ 1,8 triệu/tháng.</p>
<p>Hoàn vốn = 9 ÷ 1,8 = <b>5 tháng</b>, dưới ngưỡng 6 tháng. Đạt.</p>`},
 help:{read:'Đánh dấu doanh nghiệp đang ở giai đoạn nào và đã đạt điều kiện chuyển chưa.',mistakes:['Chuyển giai đoạn theo lịch thay vì theo điều kiện bằng số.','Hứa với sếp kết quả trong vài tuần.'],rel:['qt7','lt3-4','lt4-5']},
 q:[
  ['Điều kiện chuyển từ giai đoạn AI workflow sang Team AI?',['Có website mới','≥5 quy trình chạy ổn định ở L3','Có 10 agent','Sau 6 tháng'],1,'Bảng lộ trình đề án mục 18.',''],
  ['Thời gian hoàn vốn trung vị của triển khai agent theo chuẩn ngành?',['1 tháng','~5,1 tháng','12 tháng','24 tháng'],1,'BCG / Forrester.',''],
  ['Mục tiêu tỷ lệ tự xử lý?',['>20%','>50%','>70%','100%'],2,'Tăng dần, mục tiêu trên 70%.',''],
  ['Trong 30 ngày đầu, việc nào phải làm trước khi tạo agent?',['Mua phần mềm','Viết SOP cho 3 quy trình đã chọn','Chạy quảng cáo','Tuyển người'],1,'Checklist 30 ngày.',''],
  ['Chi phí dựng 12 triệu, tiết kiệm 3 triệu/tháng. Hoàn vốn?',['3 tháng','4 tháng','6 tháng','36 tháng'],1,'12 ÷ 3 = 4 tháng, dưới ngưỡng 6.','Chi phí xây ÷ tiết kiệm tháng.']
 ]}
  ]},

  { id:'lt4', name:'Cấp 4 · Kiến trúc', note:'Lộ trình C · đội kỹ thuật, đối tác triển khai · cũng là chương trình đối tác', modules:[

{ id:'lt4-1', t:'Bộ máy người + AI và Team AI', min:45,
 goals:['Thiết kế bộ máy bốn tầng có Hiến chương AI','Phân Team AI dưới từng giám đốc','Đặt kiểm soát độc lập đúng chỗ'],
 body:`<p>Bản đề án 2.0 sửa hai điểm của phiên bản trước: ban điều hành luôn là người (AI làm trong Team AI dưới từng giám đốc), và mức tự chủ gắn cho từng tác vụ.</p>
<div class="tbl"><table><tr><th>Giám đốc (người)</th><th>Nguồn lực giữ</th><th>Team AI</th><th>Tác vụ & mức</th></tr>
<tr><td>CEO</td><td>Điều phối chung</td><td>AI Chief of Staff</td><td>Báo cáo tuần L3; đề xuất ưu tiên L1</td></tr>
<tr><td>GĐ Tài chính</td><td>Vốn & Tài sản</td><td>AI Finance Controller</td><td>Đối soát L3; dự báo dòng tiền L1; hồ sơ thuế L2</td></tr>
<tr><td>GĐ Công nghệ</td><td>Tri thức & Công nghệ</td><td>AI R&D Manager, Team dữ liệu</td><td>Quét công nghệ L1; báo cáo dữ liệu L3</td></tr>
<tr><td>GĐ Truyền thông – MKT</td><td>Thương hiệu & Uy tín</td><td>AI Growth, AI Social & Brand</td><td>Soạn nội dung L2; đăng theo lịch đã duyệt L3</td></tr>
<tr><td>GĐ Kinh doanh</td><td>Thị trường & Quan hệ</td><td>AI Sales, CRM, Customer Success</td><td>Qualify lead L3; báo giá L2</td></tr>
<tr><td>GĐ Vận hành & Cung ứng</td><td>Giao thế nào</td><td>AI Operations</td><td>Đổi lịch L3; đề nghị đặt hàng L2</td></tr>
<tr><td>Kiểm soát độc lập</td><td>Bảo vệ cả năm nguồn lực</td><td>AI Risk & Compliance</td><td>Chặn giao dịch vượt ngưỡng L3; có quyền tạm dừng</td></tr></table></div>
<p>Ở doanh nghiệp sản xuất có thêm GĐ Chất lượng & An toàn, báo cáo thẳng CEO, không nằm trong luồng đẩy sản lượng.</p>
<h3><dfn data-k="hienchuong">Hiến chương AI</dfn></h3>
<p>Do HĐQT duyệt: mức tự chủ tối đa toàn doanh nghiệp; quyết định không bao giờ giao AI; cách kiểm toán nhật ký AI.</p>
<h3>Agent chuyên môn</h3>
<p>Mỗi Team AI gồm agent thực thi theo cụm (Nghiên cứu, Nội dung, Bán hàng, Vận hành, Tài chính, Khách hàng, Dữ liệu, R&D). Đây là danh sách tham chiếu, không phải danh sách phải xây hết.</p>`,
 ex:{t:'LATTICE bật tám vai trò AI', h:`<p>Từ mười một vai trò, LATTICE bật tám, mỗi vai có người đứng tên và mức nay/đích. Ví dụ: Chief of Staff soạn bản tin ngoại lệ 7:30 mỗi sáng từ nhật ký sự kiện (nay L2, đích L4), người đứng tên là Người 1; Social & Brand sinh bảy nhánh từ gốc tuần và kịch bản video.</p>`},
 help:{read:'Vẽ bảng giám đốc · nguồn lực · Team AI cho một khách hàng mẫu ba người.',mistakes:['Đặt AI Risk báo cáo cho GĐ Kinh doanh.','Xây đủ mọi agent trong danh sách tham chiếu.'],rel:['qt4','lt4-2','lt4-5']},
 q:[
  ['Hai điểm bản đề án 2.0 sửa so với bản trước?',['Bỏ AI, thêm người','Ban điều hành luôn là người; mức tự chủ gắn cho từng tác vụ','Thêm L6; bỏ L0','Bỏ Hiến chương AI'],1,'Đề án mục 5.',''],
  ['AI Risk & Compliance báo cáo cho ai?',['GĐ Kinh doanh','Báo cáo thẳng CEO, có quyền tạm dừng','GĐ Công nghệ','Không ai'],1,'Kiểm soát độc lập báo cáo thẳng CEO.',''],
  ['Ở doanh nghiệp sản xuất, ai không được nằm trong luồng đẩy sản lượng?',['GĐ Kinh doanh','GĐ Chất lượng & An toàn','AI Operations','CEO'],1,'Chất lượng và an toàn là thẩm quyền độc lập.',''],
  ['GĐ Tài chính giữ nguồn lực nào?',['Thương hiệu & Uy tín','Vốn & Tài sản','Thị trường & Quan hệ','Tri thức & Công nghệ'],1,'Bảng giám đốc · nguồn lực.',''],
  ['Danh sách agent chuyên môn nên dùng thế nào?',['Xây hết','Tham chiếu, chọn theo nhu cầu','Bỏ qua','Chỉ dùng cho doanh nghiệp lớn'],1,'Đề án ghi rõ: không phải danh sách phải xây hết.','']
 ]},

{ id:'lt4-2', t:'Bảy lớp hạ tầng', min:45,
 goals:['Mô tả chức năng từng lớp','Dùng câu hỏi kiểm tra để rà một hệ thống','Biết lớp nào nên tự xây'],
 body:`<div class="tbl"><table><tr><th>Lớp</th><th>Chức năng</th><th>Câu hỏi kiểm tra</th></tr>
<tr><td>1 · Business Interface</td><td>Một dashboard để CEO giao mục tiêu; mỗi vai duyệt và xem ngoại lệ</td><td>CEO điều hành từ điện thoại trong 15 phút/ngày được không?</td></tr>
<tr><td>2 · Agent Orchestration</td><td>Điều phối, lập kế hoạch, phục hồi khi lỗi</td><td>Agent lỗi thì tự phục hồi hay đứng im?</td></tr>
<tr><td>3 · MCP / Integration</td><td>Kết nối email, lịch, CRM, kế toán, ngân hàng…</td><td>Thêm một hệ thống mới mất bao lâu?</td></tr>
<tr><td>4 · Business Process</td><td>Workflow: thứ tự, điều kiện, SLA, người duyệt</td><td>Quy trình có phiên bản và quay lui được không?</td></tr>
<tr><td>5 · Identity & Memory</td><td>Danh tính agent, phân tách quyền, trí nhớ dài hạn chia sẻ</td><td>Kết quả hôm nay có được agent khác dùng lại tháng sau không?</td></tr>
<tr><td>6 · Enterprise Knowledge</td><td>Chính sách, hợp đồng, sản phẩm, lịch sử giao dịch</td><td>Mỗi loại dữ liệu có một nguồn sự thật không?</td></tr>
<tr><td>7 · Governance & Observability</td><td>Phân quyền, nhật ký, eval, chi phí, kill switch</td><td>Trả lời được "vì sao agent làm việc này" sau 3 tháng không?</td></tr></table></div>
<p>Lớp 5 được bổ sung ở bản 2.0: nó quyết định agent cộng dồn giá trị hay chạm trần.</p>
<p><b>Chọn công cụ:</b> mua trước, xây sau. Chỉ tự xây ở lớp 5 và 6 (dữ liệu, tri thức riêng); còn lại dùng nền tảng sẵn có. Lớp mô hình được trừu tượng hóa để đổi nhà cung cấp không phải làm lại.</p>
<h3>Bộ sản phẩm của LATTICE trên bảy lớp</h3>
<ul><li><b>LatticeTalk</b>: trợ lý AI trên website, một lõi trợ lý với bốn tầng quyền; mọi việc vượt quyền chuyển bằng phiếu chuyển tiếp.</li>
<li><b>LATTICE Work</b>: hệ điều hành bên trong cho đội người + AI (lớp 1, 4, 7).</li>
<li><b>LATTICE DP</b>: xử lý tài liệu, chuyển sang Markdown, làm sạch, tóm tắt, rút dữ liệu theo mẫu, có báo trước chi phí và trần chi phí (nạp lớp 6).</li></ul>`,
 ex:{t:'Rà nhanh hệ thống của Lam Beauty', h:`<ul><li>Lớp 1: chủ phải mở 4 ứng dụng để biết hôm nay ra sao → chưa đạt.</li><li>Lớp 3: đơn sàn chưa nối với kế toán → chưa đạt.</li><li>Lớp 6: chính sách đổi trả có hai bản khác nhau trên web và fanpage → chưa đạt.</li><li>Lớp 7: không có nhật ký ai đã sửa giá → chưa đạt.</li></ul><p>Thứ tự sửa: 6 → 3 → 7 → 1. Nguồn sự thật trước, giao diện sau.</p>`},
 help:{read:'Trả lời bảy câu hỏi kiểm tra cho hệ thống hiện tại, đánh dấu Đạt / Chưa.',mistakes:['Bắt đầu từ dashboard đẹp khi lớp tri thức còn mâu thuẫn.','Tự xây lớp orchestration thay vì dùng nền tảng.'],rel:['ai6','lt3-2','lt4-1']},
 q:[
  ['Lớp nào được bổ sung ở bản 2.0?',['Business Interface','Identity & Memory','MCP','Governance'],1,'Lớp 5 quyết định agent cộng dồn giá trị hay chạm trần.',''],
  ['Câu hỏi "trả lời được vì sao agent làm việc này sau 3 tháng không" kiểm lớp nào?',['Lớp 1','Lớp 4','Lớp 7 Governance & Observability','Lớp 3'],2,'Bảng bảy lớp.',''],
  ['Nên tự xây ở lớp nào?',['Lớp 2 và 3','Lớp 5 và 6','Lớp 1','Tất cả'],1,'Dữ liệu và tri thức riêng là nơi tạo khác biệt.',''],
  ['CEO điều hành từ điện thoại trong bao nhiêu phút mỗi ngày là câu hỏi của lớp 1?',['5','15','60','120'],1,'15 phút/ngày.',''],
  ['LatticeTalk được thiết kế thế nào?',['Bốn chatbot riêng','Một lõi trợ lý, bốn tầng quyền','Không có trợ lý','Chatbot của bên thứ ba'],1,'Mô hình vận hành LATTICE.','']
 ]},

{ id:'lt4-3', t:'Bốn động cơ và lớp quản trị', min:45,
 goals:['Thiết kế bốn động cơ Social, Marketing, CRM, R&D','Chạy quy trình thí nghiệm sáu bước','Hiểu vì sao lớp quản trị là lớp thứ năm'],
 body:`<p>Bốn động cơ tạo ra việc. Lớp quản trị quyết định ai duyệt việc nào, ai chịu trách nhiệm khi sai, bộ máy tự sửa ra sao. Thiếu lớp này, bốn động cơ chỉ là bốn chuỗi chatbot không sổ sách.</p>
<div class="tbl"><table><tr><th>Động cơ</th><th>Cốt lõi</th><th>Ranh giới người</th></tr>
<tr><td>Social Media</td><td>Một gốc nhiều nhánh; bản đồ kênh Việt Nam</td><td>Nguồn gốc góc nhìn; khủng hoảng; livestream</td></tr>
<tr><td>Marketing</td><td>Phễu tám tầng, mỗi tầng một agent; SEO + GEO/AEO</td><td>Lịch nhạy cảm văn hóa; chiến lược ngân sách</td></tr>
<tr><td>CRM & Vòng đời</td><td>Một nguồn sự thật; kịch bản lead mới → winback</td><td>Khách sắp rời bỏ; khách VIP</td></tr>
<tr><td>R&D & Đổi mới</td><td>Bốn dòng R&D; thí nghiệm 2 tuần/chu kỳ</td><td>Giả thuyết; kết luận giữ/sửa/bỏ</td></tr></table></div>
<h3>Ngân sách marketing tham chiếu</h3>
<p>Nội dung gốc 30% (không cắt được) · quảng cáo trả phí 25–35% · hạ tầng AI 15–20% (trần cứng) · GEO/AEO 10% · thử nghiệm 10%.</p>
<h3>Quy trình thí nghiệm chuẩn</h3>
<ol><li>Giả thuyết "nếu làm X thì Y đổi Z%" (người).</li><li>Thiết kế mẫu, đối chứng, ngân sách trần (AI đề xuất, người duyệt).</li><li>Nguyên mẫu nhỏ nhất (AI).</li><li>Chạy 7–14 ngày (AI).</li><li>Kết luận giữ / sửa / bỏ, bắt buộc chọn một (người).</li><li>Lưu tri thức, kể cả khi thất bại (tự động).</li></ol>
<blockquote>Thí nghiệm thất bại có ghi chép còn giá trị hơn thí nghiệm thành công không ghi chép.</blockquote>`,
 ex:{t:'Thí nghiệm giá của Mộc', h:`<p><b>Giả thuyết:</b> nếu bán combo "hạt + phễu giấy" thì giá trị đơn trung bình tăng 15%.</p><p>Thiết kế: 50% khách thấy combo, 50% không; ngân sách quảng cáo trần 2 triệu; chạy 14 ngày. Kết quả tăng 6%. <b>Kết luận: sửa</b> (đổi phễu sang bộ lọc vải). Ghi vào knowledge base dù không đạt.</p>`},
 help:{read:'Viết một giả thuyết theo mẫu "nếu X thì Y đổi Z%" cho doanh nghiệp mình.',mistakes:['Chạy thí nghiệm mà không chọn kết luận.','Không lưu thí nghiệm thất bại.'],rel:['ai5','qt6','lt4-2']},
 q:[
  ['Lớp thứ năm cạnh bốn động cơ là gì?',['Lớp quảng cáo','Lớp quản trị','Lớp thiết kế','Lớp bán hàng'],1,'Bốn động cơ chạy được là nhờ lớp quản trị.',''],
  ['Bước 5 của quy trình thí nghiệm bắt buộc gì?',['Chạy thêm','Chọn một kết luận: giữ, sửa hoặc bỏ','Báo cáo cổ đông','Tăng ngân sách'],1,'Bắt buộc chọn một, do người quyết.',''],
  ['Hạng mục ngân sách marketing nào "không cắt được"?',['Quảng cáo','Nội dung gốc (30%)','Thử nghiệm','Hạ tầng AI'],1,'Nguồn khác biệt.',''],
  ['Chu kỳ thí nghiệm sản phẩm trong động cơ R&D?',['1 ngày','2 tuần','6 tháng','1 năm'],1,'Product Experimentation: 2 tuần/chu kỳ.',''],
  ['Vì sao lưu cả thí nghiệm thất bại?',['Để phạt','Ngăn lặp lại sai lầm và thành ngữ cảnh cho mọi agent','Vì luật','Cho đẹp báo cáo'],1,'Bước 6 tạo giá trị cộng dồn lớn nhất.','']
 ]},

{ id:'lt4-4', t:'Chẩn đoán như một hệ thống', min:50,
 goals:['Mô tả chu trình chín chặng C0–C8 và ba cổng sàng lọc','Chạy máy phát hiện điểm đau 14 luật','Viết đề xuất cơ bản bảy khối'],
 body:`<p>LATTICE bán một thứ khó bán: kết luận về tổ chức của người khác. Chu trình chia quãng đường thành chín chặng, mỗi chặng vừa sàng lọc vừa giao một thứ dùng được.</p>
<p><b>C0</b> Thu hút → <b>C1</b> Tự chẩn đoán miễn phí → <b>C2</b> Đăng ký & thu phí → <b>C3</b> Bộ câu hỏi cơ bản → <b>C4</b> Buổi làm việc + đề xuất cơ bản → <b>C5</b> Bộ câu hỏi chuyên sâu → <b>C6</b> Hồ sơ chẩn đoán → <b>C7</b> Hợp đồng triển khai → <b>C8</b> Triển khai & đồng hành.</p>
<h3>Bốn nguyên tắc lõi</h3>
<ol><li>Mỗi chặng tự trả tiền cho chính nó: khách dừng giữa đường vẫn cầm về thứ dùng được.</li><li>Không hỏi thứ mình không dùng: mỗi câu ánh xạ tới đúng một ô mô hình.</li><li>Chỉ nêu con số khách tự cung cấp.</li><li>Một mô hình, một định nghĩa gốc.</li></ol>
<h3>Ba cổng sàng lọc</h3>
<p>C1 lọc người mới tò mò và mô hình có trần quá thấp. C4 lọc hồ sơ dữ liệu chưa đủ sạch (cần làm sạch trước, chưa cần kiến trúc). C7 lọc người chủ chưa sẵn sàng đổi cách làm của chính mình.</p>
<h3>Máy phát hiện điểm đau</h3>
<p>Mười bốn luật, mỗi luật là một điều kiện trên câu trả lời, một tên gọi bằng chữ của khách, một cách định giá chỉ dùng số của khách. Ví dụ: L01 CEO là nút cổ chai · L04 Trả lời đi trả lời lại cùng vài câu · L07 Chép tay từ chỗ này sang chỗ kia · L11 Ngành có điều kiện · L14 Đã thử AI và thất vọng. Người đọc hồ sơ chạy luật, không tự nghĩ ra điểm đau.</p>
<h3>Đề xuất cơ bản bảy khối</h3>
<p>1 Chúng tôi hiểu thế này · 2 Trần tự động hóa · 3 Ba điểm đau · 4 Ba quy trình nên làm trước · 5 Một việc làm được ngay · 6 Điều chúng tôi chưa biết · 7 Bước tiếp theo. Khối 6 quan trọng nhất. Không có trong đề xuất cơ bản: báo giá triển khai, sơ đồ kiến trúc, số ngành không nguồn.</p>`,
 ex:{t:'Luật kích hoạt trên hồ sơ Lam Beauty (minh họa)', h:`<ul><li>E3 = 60–85% câu hỏi lặp → <b>L04</b>. Định giá: 120 câu/ngày × 2 phút × 30 ngày = 120 giờ/tháng × đơn giá giờ khách nêu.</li>
<li>B4 = không lưu bằng chứng đồng ý, có kênh nhắn tin → <b>L08</b>: rủi ro tuân thủ, xử lý trước khi tự động hóa marketing.</li>
<li>F2 = có (mỹ phẩm) → <b>L11</b>: trần tự chủ L2 cho nội dung quảng cáo.</li>
<li>G2 = đã thử, thất vọng → <b>L14</b>: buổi làm việc bắt đầu bằng "vì sao lần trước hỏng".</li></ul>`},
 help:{read:'Học thuộc bốn nguyên tắc lõi trước khi học 14 luật.',mistakes:['Tự nghĩ điểm đau thay vì chạy luật.','Đưa sơ đồ kiến trúc vào đề xuất cơ bản.'],rel:['lt2-2','ai3','u5']},
 q:[
  ['Nguyên tắc "mỗi chặng tự trả tiền cho chính nó" nghĩa là?',['Mỗi chặng đều thu phí','Khách dừng ở chặng nào vẫn cầm về thứ dùng được; công ty từ chối ở chặng đó vẫn không lỗ','Chặng sau rẻ hơn','Không có chặng miễn phí'],1,'Nguyên tắc lõi 1.',''],
  ['Cổng C7 lọc ai?',['Người mới tò mò','Hồ sơ dữ liệu chưa sạch','Người chủ chưa sẵn sàng đổi cách làm việc của chính mình','Khách không trả tiền'],2,'Nguyên nhân thất bại phổ biến nhất, không sửa được bằng kỹ thuật.',''],
  ['Khối nào quan trọng nhất trong đề xuất cơ bản?',['Khối 1','Khối 4','Khối 6 · Điều chúng tôi chưa biết','Khối 7'],2,'Khách tự thấy khoảng trống thay vì bị thuyết phục.',''],
  ['Thứ nào KHÔNG được có trong đề xuất cơ bản?',['Ba điểm đau','Một việc làm được ngay','Báo giá hợp đồng triển khai','Bước tiếp theo'],2,'Báo giá biến tài liệu chuyên môn thành tờ chào hàng.',''],
  ['Luật L14 "Đã thử AI và thất vọng" thay đổi điều gì?',['Tăng giá','Đổi thứ tự trình bày buổi làm việc, bắt đầu bằng vì sao lần trước hỏng','Từ chối khách','Bỏ qua'],1,'Định giá: không định giá, đổi thứ tự trình bày.','']
 ]},

{ id:'lt4-5', t:'Thiết kế thăng, hạ cấp và tự áp lên chính mình', min:45,
 goals:['Thiết kế "hai tầng tự động hóa" cho mỗi mắt xích','Viết điều kiện thăng cấp bằng số','Dùng chính doanh nghiệp mình làm case study'],
 body:`<p>Mỗi mắt xích có hai trạng thái: chạy được hôm nay trên hạ tầng hiện có, và trạng thái tự chủ mục tiêu. Giữa hai trạng thái là một điều kiện thăng cấp bằng số, không phải một ngày trên lịch.</p>
<div class="tbl"><table><tr><th>Chặng</th><th>Nay</th><th>Đích</th><th>Điều kiện</th></tr>
<tr><td>C0 Nội dung</td><td>L1</td><td>L3</td><td>≥30 nhánh, ≥70% duyệt không sửa</td></tr>
<tr><td>C3 Bộ câu hỏi</td><td>L2</td><td>L3</td><td>20 hồ sơ chọn đúng bộ, 0 sai</td></tr>
<tr><td>C4 Đề xuất</td><td>L1</td><td>L2</td><td>15 hồ sơ, luật khớp phán đoán người ≥85%</td></tr>
<tr><td>C6 Hồ sơ</td><td>L1</td><td>L2</td><td>10 hồ sơ, giữ nguyên bản nháp ≥60%</td></tr>
<tr><td>C7 Hợp đồng</td><td>L0</td><td>L0</td><td>Không thăng cấp: vùng không ủy quyền</td></tr></table></div>
<h3>Luật hạ cấp</h3>
<p>Hai sự cố trong 30 ngày thì mắt xích tự rơi xuống hai bậc. "Sự cố" phải được định nghĩa cụ thể cho từng chu trình (học phần 3.3).</p>
<h3>Tự áp lên mình</h3>
<p>LATTICE vận hành theo hai luồng: tương tác bên ngoài (Truyền thông & Marketing, Khách hàng, Kinh doanh) và quản trị nội bộ (cổ đông, tài chính & vốn, quy trình & chính sách, đội người + AI, pháp lý & dữ liệu), nối bằng một lõi chung: hồ sơ khách một mã, sổ mô hình, sổ chính sách, kho tri thức, nhật ký sự kiện chỉ ghi thêm. Mỗi bậc trả phí mở một <dfn data-k="phong">Phòng</dfn>. Bốn bậc đầu chạy không cần gặp người; người xuất hiện lần đầu ở Blueprint.</p>
<blockquote>Một công ty bán khả năng thiết kế hệ thống kiểm soát không thể vận hành bằng thiện chí và trí nhớ.</blockquote>`,
 ex:{t:'Bài tập đối tác (Lộ trình C)', h:`<p>Chọn chặng C4 của một khách: hôm nay người chạy 14 luật bằng tay trên bảng tính, viết đề xuất theo mẫu (L1). Đích: luật chạy tự động, sinh bản nháp, người sửa và duyệt (L2).</p>
<p>Viết: điều kiện thăng (15 hồ sơ, khớp ≥85%), định nghĩa sự cố (một đề xuất có con số không dẫn về câu trả lời khách), luật hạ cấp (hai sự cố/30 ngày → về L0), người đứng tên.</p>`},
 help:{read:'Lập bảng nay · đích · điều kiện cho ba mắt xích trong doanh nghiệp anh chị.',mistakes:['Đặt mốc thăng cấp theo ngày.','Cho hợp đồng một lộ trình thăng cấp.'],rel:['lt2-4','lt3-3','lt1-2']},
 q:[
  ['Giữa trạng thái hôm nay và trạng thái đích là gì?',['Một ngày trên lịch','Một điều kiện thăng cấp bằng số','Quyết định của nhà cung cấp','Không có gì'],1,'Mục 14 tài liệu chu trình.',''],
  ['Chặng C7 Hợp đồng có đích là mức nào?',['L2','L3','L0, không thăng cấp','L4'],2,'Ký hợp đồng nằm trong vùng không ủy quyền.',''],
  ['Điều kiện thăng cấp của C4 Đề xuất?',['5 hồ sơ','15 hồ sơ, luật khớp phán đoán người ≥85%','100 hồ sơ','Không có'],1,'Bảng hai tầng tự động hóa.',''],
  ['Lõi chung nối hai luồng của LATTICE KHÔNG gồm?',['Sổ chính sách','Nhật ký sự kiện chỉ ghi thêm','Nhóm Zalo nội bộ','Kho tri thức'],2,'LATTICE không dùng Zalo cho công việc; lõi là dữ liệu và tri thức dùng chung.',''],

  { id:'lt5', name:'Chuyên đề · Ứng dụng theo mô hình doanh nghiệp', note:'Áp LATTICE vào từng loại hình · học sau Cấp 2', modules:[

{ id:'u1', t:'Thương mại & Hàng hóa', min:45,
 goals:['Nắm 8 khối, 7 chuỗi, 54 nghiệp vụ','Đặt mức AI cho tác vụ thương mại','Bảo vệ vốn lưu động'],
 body:`<p>Kiến trúc tham chiếu cho thương mại điện tử và phân phối: <b>8 khối, 7 chuỗi, 54 nghiệp vụ</b>. Sáu khối tạo giá trị: Ngành hàng & Nguồn cung; Hoạch định Cung–Cầu & Tồn kho; Thị trường, Marketing & Tăng trưởng; Kinh doanh & Kênh phân phối; Đơn hàng, Kho vận & Giao nhận; Dịch vụ khách hàng & Phát triển quan hệ; cộng Quản trị & Điều hành và Năng lực hỗ trợ.</p>
<h3>Bảy chuỗi xuyên suốt</h3>
<p>Kế hoạch → Hàng sẵn sàng · Nguồn cung → Thanh toán · Thị trường → Khách tiềm năng · Cơ hội → Đơn hàng · Đơn hàng → Thu tiền · Yêu cầu → Giải quyết · Khách hàng → Mua lại.</p>
<h3>Mức AI khởi điểm</h3>
<div class="tbl"><table><tr><th>Tác vụ</th><th>Mức</th></tr>
<tr><td>Trả lời trạng thái đơn</td><td>A3</td></tr><tr><td>Báo giá theo bảng giá đã duyệt</td><td>A3 khi đủ điều kiện</td></tr>
<tr><td>Đề xuất đơn mua bổ sung</td><td>A2</td></tr><tr><td>Cấp tín dụng, tăng hạn mức khách</td><td>A2</td></tr>
<tr><td>Phê duyệt nhà cung cấp mới</td><td>A2</td></tr><tr><td>Thanh toán nhà cung cấp</td><td>A2, theo phân quyền tài chính</td></tr></table></div>
<p>Giữ phân tách giữa tạo giao dịch, phê duyệt và thực hiện.</p>
<h3>Con người tập trung ở đâu</h3>
<p>Chọn sản phẩm, quan hệ nhà cung cấp, kiểm hàng, quyết định vốn tồn kho. <b>Điểm nghẽn thật là vốn lưu động</b>, không phải năng lực vận hành. Ở Việt Nam, agent vận hành phải xử lý đối soát COD và tỷ lệ hoàn.</p>`,
 ex:{t:'Lam Beauty sau 90 ngày (kịch bản minh họa)', h:`<ul><li>Ba quy trình: trả lời câu hỏi lặp (L3), đối soát COD theo lô (L3 có rollback), đề xuất nhập hàng khi chạm ngưỡng tồn (L2).</li>
<li>Nội dung quảng cáo mỹ phẩm giữ L2, người duyệt từng bài (L11).</li>
<li>Chủ dành thời gian lấy lại cho đàm phán với hai nhãn hàng Hàn Quốc.</li></ul>`},
 help:{read:'Đánh dấu chuỗi nào trong bảy chuỗi đang đứt ở doanh nghiệp mình.',mistakes:['Để AI tự thanh toán nhà cung cấp.','Tối ưu quảng cáo khi vốn đang kẹt trong tồn kho.'],rel:['qt2','lt2-5','ai6']},
 q:[
  ['Kiến trúc Thương mại & Hàng hóa có bao nhiêu khối, chuỗi, nghiệp vụ?',['10 · 9 · 71','8 · 7 · 54','8 · 8 · 58','6 · 5 · 40'],1,'Đề án mục 14.1.',''],
  ['Điểm nghẽn thật của mô hình thương mại?',['Năng lực vận hành','Vốn lưu động','Thiếu agent','Website'],1,'Không phải năng lực vận hành.',''],
  ['Mức AI khởi điểm cho "đề xuất đơn mua bổ sung"?',['A1','A2','A3','Không dùng AI'],1,'Đề xuất → người duyệt.',''],
  ['Đặc thù Việt Nam agent vận hành thương mại phải xử lý?',['Thuế nhập khẩu','Đối soát COD và tỷ lệ hoàn','Tỷ giá','Bảo hiểm'],1,'Bảng bốn khác biệt Việt Nam.',''],
  ['Nguyên tắc phân quyền trong thương mại?',['Một người tạo, duyệt và thực hiện','Giữ phân tách giữa tạo giao dịch, phê duyệt và thực hiện','AI duyệt hết','Không cần phân quyền'],1,'Mức tự động hóa cao không có nghĩa AI có mọi quyền.','']
 ]},

{ id:'u2', t:'Dịch vụ', min:45,
 goals:['Nắm 8 khối, 8 chuỗi, 58 nghiệp vụ','Phân biệt ba vai trò trong dịch vụ','Cấu hình theo ngành: tư vấn, sức khỏe, du lịch'],
 body:`<p>Kiến trúc Dịch vụ: <b>8 khối, 8 chuỗi, 58 nghiệp vụ</b>. Nguồn lực quyết định là Con người & chuyên môn, và Uy tín. <b>Điểm nghẽn thật là giờ công của người có chuyên môn</b>, nên chiến lược là đóng gói tri thức thành sản phẩm số để bán được ngoài giờ công.</p>
<h3>Ba vai trò cần phân biệt</h3>
<ul><li><b>Người sở hữu quy trình</b>: chịu trách nhiệm hiệu quả xuyên suốt.</li><li><b>Người phụ trách chuyên môn</b>: quyết định tiêu chuẩn, xử lý vấn đề chuyên môn.</li><li><b>Người thực hiện</b>: trực tiếp cung cấp dịch vụ.</li></ul>
<p>AI hỗ trợ các vai trò này, không thay thế trách nhiệm của họ. Quyết định chuyên môn do người có chứng chỉ; AI chuẩn bị tài liệu, checklist, hồ sơ.</p>
<h3>Cấu hình theo ngành</h3>
<div class="tbl"><table><tr><th>Ngành</th><th>Đơn vị quản trị</th><th>Lưu ý</th></tr>
<tr><td>Tư vấn</td><td>Hợp đồng / dự án</td><td>Phạm vi công việc, quản trị thay đổi phạm vi, nghiệm thu</td></tr>
<tr><td>Chăm sóc sức khỏe</td><td>Hồ sơ khách/người bệnh, lượt dịch vụ</td><td>Phân biệt khám chữa bệnh với chăm sóc không thuộc khám chữa bệnh; không dùng doanh số làm thước đo duy nhất</td></tr>
<tr><td>Du lịch</td><td>Booking / đoàn / chuyến</td><td>Không dùng thông tin khả dụng cũ làm xác nhận đặt chỗ</td></tr></table></div>`,
 ex:{t:'Spa An Nhiên tách lớp giờ công', h:`<ul><li>AI đảm nhiệm: đặt lịch, nhắc hẹn (A3), trả lời thông tin gói đã duyệt (A3), tóm tắt hồ sơ trước buổi (A1–A2, kỹ thuật viên xác minh).</li>
<li>Người giữ: tư vấn liệu trình, thực hiện, xử lý kích ứng.</li>
<li>Đóng gói tri thức: khóa video "chăm da tại nhà giữa hai liệu trình" bán ngoài giờ công.</li></ul>`},
 help:{read:'Tính số giờ công chuyên môn mỗi tuần đang bị việc hành chính chiếm.',mistakes:['Đo spa chỉ bằng doanh số.','Để AI tư vấn chuyên môn sức khỏe.'],rel:['qt2','lt1-3','u4']},
 q:[
  ['Điểm nghẽn thật của mô hình dịch vụ?',['Vốn lưu động','Giờ công của người có chuyên môn','Tồn kho','Thiết bị'],1,'Chiến lược: đóng gói tri thức thành sản phẩm số.',''],
  ['Ai quyết định chuyên môn trong dịch vụ?',['AI','Người có chứng chỉ/thẩm quyền chuyên môn','Lễ tân','Khách hàng'],1,'AI chuẩn bị tài liệu, checklist, hồ sơ.',''],
  ['Trong du lịch, điều gì bị cấm?',['Dùng AI soạn hành trình','Dùng thông tin khả dụng cũ làm xác nhận đặt chỗ','Báo giá','Đặt cọc'],1,'Thông tin biến động phải kiểm từ nguồn hiện hành.',''],
  ['Kiến trúc Dịch vụ có bao nhiêu nghiệp vụ?',['54','58','71','40'],1,'8 khối, 8 chuỗi, 58 nghiệp vụ.',''],
  ['Ở chăm sóc sức khỏe, cần phân biệt gì trước khi triển khai?',['Khách mới và khách cũ','Dịch vụ khám/chữa bệnh và chăm sóc không thuộc khám/chữa bệnh','Giá cao và giá thấp','Online và offline'],1,'Hai phạm vi có yêu cầu chuyên môn khác nhau.','']
 ]},

{ id:'u3', t:'Sản xuất · mô hình Control Tower', min:45,
 goals:['Nắm 10 khối, 9 chuỗi, 71 nghiệp vụ','Hiểu vì sao AI không điều khiển máy','Kiểm soát chất lượng từ xa'],
 body:`<p>Kiến trúc Sản xuất: <b>10 khối, 9 chuỗi, 71 nghiệp vụ</b>, tám khối tạo giá trị từ Thị trường & Quản trị nhu cầu tới Kho vận & Dịch vụ sau bán. Nguồn lực quyết định: Tri thức & Công nghệ, Vốn & Tài sản (thiết bị), Uy tín chất lượng.</p>
<blockquote>AI không điều khiển máy. Phần điều khiển do hệ thống tự động hóa công nghiệp đảm nhiệm; AI dự báo, lập kế hoạch, đề xuất.</blockquote>
<h3>Chất lượng là thẩm quyền độc lập</h3>
<p>GĐ Chất lượng & An toàn báo cáo thẳng CEO, không nằm trong luồng đẩy sản lượng. Cặp vai sản xuất + nghiệm thu chất lượng không được một người kiêm.</p>
<h3><dfn data-k="controltower">AI Control Tower</dfn></h3>
<p>Mô hình 1–3 người chỉ khả thi khi phần vật lý thuê ngoài, dùng OEM/ODM, hoặc tự động hóa cao. Khi đó doanh nghiệp lõi điều phối, nhà máy và logistics là mạng lưới đối tác thực thi. Điểm nghẽn thật là <b>kiểm soát chất lượng từ xa</b>: Team AI QC bằng hình ảnh phát hiện và đề xuất, người có thẩm quyền chất lượng kết luận, kèm kiểm tra thực địa định kỳ.</p>`,
 ex:{t:'Cơ khí Tân Phát chuyển sang Control Tower (minh họa)', h:`<ul><li>Giữ: thiết kế quy trình gia công, quan hệ khách đặt hàng, nghiệm thu.</li><li>Thuê ngoài: hai xưởng vệ tinh gia công theo bản vẽ.</li><li>AI: dự báo nhu cầu, lập kế hoạch giao lệnh, đối chiếu ảnh QC từ xưởng với chuẩn (đề xuất đạt/không đạt).</li><li>Người QC kết luận; mỗi tháng kiểm thực địa một lần.</li></ul>`},
 help:{read:'Liệt kê phần vật lý nào có thể thuê ngoài hoặc OEM/ODM.',mistakes:['Cho AI điều khiển thiết bị.','Để trưởng sản xuất tự nghiệm thu.'],rel:['lt1-3','lt4-1','u4']},
 q:[
  ['Kiến trúc Sản xuất có bao nhiêu khối, chuỗi, nghiệp vụ?',['8 · 7 · 54','10 · 9 · 71','8 · 8 · 58','12 · 10 · 80'],1,'Đề án mục 14.3.',''],
  ['AI làm gì trong sản xuất?',['Điều khiển máy','Dự báo, lập kế hoạch, đề xuất','Ký nghiệm thu','Vận hành thiết bị'],1,'AI không điều khiển máy.',''],
  ['Điểm nghẽn thật của mô hình Control Tower?',['Marketing','Kiểm soát chất lượng từ xa','Kế toán','Website'],1,'Giải bằng QC hình ảnh + người kết luận + kiểm thực địa.',''],
  ['GĐ Chất lượng & An toàn báo cáo cho ai?',['GĐ Sản xuất','Thẳng CEO','GĐ Kinh doanh','Đối tác OEM'],1,'Không nằm trong luồng đẩy sản lượng.',''],
  ['Khi nào sản xuất khả thi với 1–3 người?',['Khi có nhiều vốn','Khi phần vật lý thuê ngoài, OEM/ODM hoặc tự động hóa cao','Khi dùng AI mạnh','Không bao giờ'],1,'Mô hình Control Tower.','']
 ]},

{ id:'u4', t:'Mô hình lai: tách lớp', min:40,
 goals:['Tách mô hình lai thành các lớp có trần riêng','Dùng chung một lớp dữ liệu khách và một lớp tri thức','Dùng lớp dễ tự động hóa để bảo vệ lớp đắt nhất'],
 body:`<p>Mô hình lai cần được tách lớp chứ không đánh giá gộp. Ví dụ trong đề án: nền tảng vật lý trị liệu.</p>
<div class="tbl"><table><tr><th>Lớp</th><th>Bản chất</th><th>Trần</th><th>Người phụ trách</th></tr>
<tr><td>Nội dung & giáo dục</td><td>Kinh doanh tri thức</td><td>85%</td><td>AI + biên tập của người sáng lập</td></tr>
<tr><td>Marketplace kết nối KTV–khách</td><td>Môi giới</td><td>70%</td><td>AI + xác minh của người</td></tr>
<tr><td>Bán thiết bị hỗ trợ</td><td>Thương mại điện tử</td><td>80%</td><td>AI gần toàn bộ</td></tr>
<tr><td>Trị liệu trực tiếp</td><td>Dịch vụ tại chỗ</td><td>45%</td><td>Người hành nghề, không ủy quyền</td></tr></table></div>
<blockquote>AI-hóa tối đa ba lớp trên để nuôi và bảo vệ giờ công đắt nhất ở lớp thứ tư.</blockquote>
<p>Nguyên tắc: mỗi lớp có kiến trúc AI riêng, nhưng dùng chung một lớp dữ liệu khách hàng và một lớp tri thức. Đó là điều kiện để nội dung nuôi marketplace, marketplace nuôi thương mại, và thương mại tài trợ giờ công trị liệu.</p>`,
 ex:{t:'Xưởng cà phê Mộc: ba trong một', h:`<div class="tbl"><table><tr><th>Lớp</th><th>Kiến trúc</th><th>AI hỗ trợ</th></tr>
<tr><td>Rang & đóng gói</td><td>Sản xuất</td><td>Theo dõi hạt thô, gợi ý lịch rang theo dự báo đơn</td></tr>
<tr><td>Workshop pha chế</td><td>Dịch vụ</td><td>Nhận lịch, nhắc học viên, cấp chứng nhận</td></tr>
<tr><td>Bán lẻ, bán sỉ</td><td>Thương mại</td><td>Gom đơn đa kênh, tính biên lợi nhuận</td></tr></table></div>
<p>Một danh sách khách chung: học viên workshop thành khách mua hạt; khách mua hạt được mời workshop.</p>`},
 help:{read:'Chia doanh nghiệp mình thành các lớp, ghi trần ước lượng cho từng lớp.',mistakes:['Tính một trần chung cho cả mô hình lai.','Mỗi lớp một danh sách khách riêng.'],rel:['lt1-3','u2','qt1']},
 q:[
  ['Nguyên tắc với mô hình lai?',['Đánh giá gộp','Tách lớp; mỗi lớp có kiến trúc AI riêng, dùng chung dữ liệu khách và tri thức','Chọn một lớp, bỏ các lớp khác','Thuê ngoài toàn bộ'],1,'Đề án mục 14.4.',''],
  ['Trong ví dụ vật lý trị liệu, lớp nào có trần thấp nhất?',['Nội dung','Marketplace','Bán thiết bị','Trị liệu trực tiếp (45%)'],3,'Dịch vụ tại chỗ, không ủy quyền được.',''],
  ['Mục đích AI-hóa tối đa các lớp trên?',['Cắt người trị liệu','Nuôi và bảo vệ giờ công đắt nhất ở lớp trị liệu','Tăng quảng cáo','Bỏ dịch vụ tại chỗ'],1,'Câu kết luận của bảng tách lớp.',''],
  ['Lớp marketplace kết nối KTV–khách cần thêm gì từ người?',['Biên tập','Xác minh','Không gì','Ký hợp đồng mỗi lần'],1,'AI + xác minh của người.',''],
  ['Điều kiện để các lớp nuôi nhau?',['Mỗi lớp một phần mềm riêng','Dùng chung lớp dữ liệu khách và lớp tri thức','Một người làm hết','Giá giống nhau'],1,'Nguyên tắc mô hình lai.','']
 ]},

{ id:'u5', t:'Khởi sự từ ý tưởng', min:45,
 goals:['Chuyển từ kiểm kê sang kiểm chứng giả định','Biết khi nào kết luận "chưa nên làm"','Đi đúng đường Compass → Foundry'],
 body:`<p>Nhóm 1 hỏi "việc này đang tốn bao nhiêu". Nhóm 2 hỏi "anh chị tin điều gì, và nếu điều đó sai thì mất gì". Người khởi sự không có quy trình để kiểm kê, chỉ có giả định để kiểm chứng.</p>
<h3>Vì sao là dòng sản phẩm riêng</h3>
<ul><li>Đầu ra khác bản chất: kiến trúc mục tiêu cộng bảng giả định cần kiểm chứng theo thứ tự rủi ro.</li><li>Việc nặng hơn: phải dựng giả định và định cỡ thị trường.</li><li>Phải có quyền nói không: kết luận "chưa nên làm" là kết quả hợp lệ của một cuộc thẩm định, và là thứ đáng tiền nhất.</li></ul>
<h3>Câu hỏi mạnh nhất</h3>
<p>"Trong số người anh chị đã nói chuyện, bao nhiêu người đã trả tiền hoặc đặt cọc?" là chỉ báo mạnh nhất. Lời khen, lượt thích, lời hứa không tính. "Đến mốc nào thì anh chị dừng lại?" là chỉ báo chín chắn; "chưa đặt mốc dừng" là cờ đỏ.</p>
<h3>Kết luận "chưa nên làm"</h3>
<p>Kích hoạt khi đồng thời: chưa ai trả tiền, đã nói chuyện với 5 người trở xuống, và chưa đặt mốc dừng. Khi đó không đưa kiến trúc, mà đưa kế hoạch kiểm chứng bốn tuần: hai mươi cuộc nói chuyện với khách mục tiêu, một bản chào thử, một mốc dừng bằng số.</p>
<p>Gói tương ứng: Compass (báo cáo kiểm chứng 6–8 trang: năm giả định rủi ro nhất, cách kiểm chứng rẻ trong 30 ngày, kết luận nên làm / làm nhỏ thử / chưa nên làm) → Foundry (bản thiết kế 15–20 trang, kế hoạch 90 ngày ra mắt).</p>
<blockquote>Một tỷ lệ "chưa nên làm" bằng không là bằng chứng bộ câu hỏi đang được đọc theo hướng có lợi cho việc bán hàng. Khoảng lành mạnh dự kiến: 15–30% hồ sơ Compass.</blockquote>`,
 ex:{t:'Ý tưởng của anh Minh (ví dụ giả định)', h:`<p>Anh Minh muốn mở dịch vụ luyện phỏng vấn tiếng Hàn trực tuyến cho người đi làm ở Hàn. Đã nói chuyện với 4 người, chưa ai trả tiền, chưa đặt mốc dừng.</p>
<p>Ba điều kiện đều thỏa → <b>chưa nên làm</b>. Kế hoạch bốn tuần: 20 cuộc trò chuyện với người đang chuẩn bị đi Hàn; một bản chào thử 3 buổi với giá cụ thể; mốc dừng "dưới 5 người đặt cọc sau 4 tuần thì dừng". Quay lại Foundry khi có kết quả.</p>`},
