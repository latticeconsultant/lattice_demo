<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="LATTICE Academy — hệ thống học nền tảng doanh nghiệp người + AI: lộ trình, học phần, bài kiểm tra và chứng nhận (bản demo).">
<link rel="icon" type="image/png" sizes="32x32" href="../brand/logo/favicon/favicon-32.png">
<style>body{margin:0}</style>
<title>LATTICE Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Bố cục: "giàn" — lưới mô-đun chia bằng nét 2px, không bo góc, mọi thứ căn trái.
   Mục lục bên trái là sơ đồ nút; nút đặc = đã đạt; đỏ chỉ dùng cho con người, ngưỡng, quyết định. */
:root{
  --paper:#fff1e5; --panel:#f7e5d4; --band:#f2dfce;
  --ink:#33302e; --mute:#5e5955; --rule:#c2b5a9; --line:#33302e;
  --red:#ec3013; --red-ink:#ae1800; --red-soft:#ffe0d9;
  --ok:#2f6b3a; --ok-soft:#dcebd9; --bad:#ae1800; --bad-soft:#ffe0d9;
  --f:'Archivo', 'Helvetica Neue', Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1e1b19; --panel:#27231f; --band:#2f2a26;
  --ink:#f1e4d6; --mute:#b5a99c; --rule:#4f4945; --line:#e9dccd;
  --red:#ff563c; --red-ink:#ff8a75; --red-soft:#4d170e;
  --ok:#8fcf98; --ok-soft:#1f3322; --bad:#ff8a75; --bad-soft:#4d170e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1e1b19; --panel:#27231f; --band:#2f2a26;
  --ink:#f1e4d6; --mute:#b5a99c; --rule:#4f4945; --line:#e9dccd;
  --red:#ff563c; --red-ink:#ff8a75; --red-soft:#4d170e;
  --ok:#8fcf98; --ok-soft:#1f3322; --bad:#ff8a75; --bad-soft:#4d170e; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3,h4{font-weight:800;letter-spacing:-.025em;line-height:1.15;text-wrap:balance;margin:0}
.lbl{font-weight:600;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.num{font-variant-numeric:tabular-nums}

/* Khung */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:2px solid var(--line);
  display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand b{font-weight:800;font-stretch:80%;font-size:20px;letter-spacing:-.01em}
.brand span{font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.top .sp{flex:1}
.tbtn{border:2px solid var(--line);background:transparent;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap}
.tbtn:hover{background:var(--band)}
#menuBtn{display:none}
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{border-right:2px solid var(--line);padding:18px 0 40px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);height:calc(100vh - 58px - env(safe-area-inset-top,0px));overflow:auto;background:var(--paper)}
.main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px}

/* Mục lục dạng nút */
.nav-p{padding:6px 18px 10px}
.nav-p>a{display:block;text-decoration:none;font-weight:800;font-size:15px;padding:6px 0;letter-spacing:-.01em}
.nav-p>a small{display:block;font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.nav-l{margin:6px 0 8px;padding-left:10px;border-left:2px solid var(--rule)}
.nav-l .lbl{display:block;padding:6px 0 2px 8px}
.nav-m{display:flex;gap:9px;align-items:flex-start;text-decoration:none;font-size:13.5px;line-height:1.35;padding:5px 6px 5px 8px}
.nav-m:hover{background:var(--band)}
.nav-m.cur{background:var(--band);font-weight:600}
.nav-x{border-top:2px solid var(--line);margin-top:10px;padding:14px 18px 0;display:grid;gap:4px}
.nav-x a{text-decoration:none;font-weight:600;font-size:14px;padding:4px 0}
.node{flex:none;width:11px;height:11px;margin-top:3px;transform:rotate(45deg);border:2px solid var(--line);background:transparent}
.node.done{background:var(--line)}
.node.tried{background:linear-gradient(135deg,var(--line) 50%,transparent 50%)}

/* Khối chung */
.eyebrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.h1{font-size:clamp(30px,4.6vw,52px);font-stretch:78%;font-weight:800;letter-spacing:-.02em}
.lead{font-size:18px;max-width:66ch;color:var(--ink);margin:14px 0 0}
.sec{margin-top:44px}
.sec>h2{font-size:24px;font-stretch:85%;margin-bottom:6px}
.sec>p.sub{margin:0 0 16px;color:var(--mute);max-width:68ch}
.grid{display:grid;gap:0;border:2px solid var(--line)}
.grid>*{border-right:2px solid var(--line);border-bottom:2px solid var(--line);margin:-0px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid{overflow:hidden}
.grid>*{margin-right:-2px;margin-bottom:-2px}
.cell{padding:20px;min-width:0}
.cell h3{font-size:20px;font-stretch:85%;margin:6px 0 8px}
.cell p{margin:0 0 10px}
.cell a.go{font-weight:700;text-decoration:none;border-bottom:2px solid var(--line)}
.stat b{display:block;font-size:34px;font-weight:800;font-stretch:75%;line-height:1}
.stat span{font-size:13px;color:var(--mute)}
.bar{height:8px;border:2px solid var(--line);margin-top:10px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--line)}
.tbl{overflow-x:auto;border:2px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--rule)}
th{font-weight:600;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);border-bottom:2px solid var(--line);background:var(--band)}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:2px solid var(--line);padding:2px 7px;line-height:1.3}
.pill.red{border-color:var(--red);color:var(--red-ink)}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--line);color:var(--paper);padding:10px 16px;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{background:transparent;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--band)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Trang module */
.mod{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:36px;align-items:start}
.crumb{font-size:13px;color:var(--mute);margin-bottom:12px}
.crumb a{text-decoration:none;border-bottom:1px solid var(--rule)}
.goals{border:2px solid var(--line);padding:16px 18px;margin-top:22px}
.goals ul{margin:8px 0 0;padding-left:20px}
.body{max-width:70ch;margin-top:26px}
.body p{margin:0 0 14px}
.body h3{font-size:19px;font-stretch:88%;margin:28px 0 10px}
.body ul,.body ol{padding-left:22px;margin:0 0 14px}
.body li{margin-bottom:5px}
.body .tbl{margin:6px 0 18px}
.body blockquote{margin:18px 0;padding:12px 16px;border-left:6px solid var(--red);background:var(--panel);font-weight:600}
dfn{font-style:normal;border-bottom:2px dotted var(--mute);cursor:help}
dfn:hover{border-bottom-color:var(--red)}
.ex{margin-top:28px;border:2px solid var(--line);background:var(--panel)}
.ex header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:2px solid var(--line)}
.ex .in{padding:16px 18px;max-width:72ch}
.ex .in p{margin:0 0 10px}
.ex .in ul{margin:0 0 10px;padding-left:20px}
.tool{margin-top:28px;border:2px solid var(--line)}
.tool header{padding:10px 16px;border-bottom:2px solid var(--line);background:var(--band)}
.tool .in{padding:16px 18px}
.rowf{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center;margin-bottom:10px}
.rowf label{font-size:14px}
input[type=range]{width:100%;accent-color:var(--ink)}
input[type=number],input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);padding:7px 9px;width:100%;border-radius:0}
.big{font-size:40px;font-weight:800;font-stretch:75%;line-height:1}
.lv{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:2px solid var(--line)}
.lv button{border:0;border-right:2px solid var(--line);background:transparent;padding:12px 4px;font-weight:800;font-stretch:80%;font-size:20px;cursor:pointer}
.lv button:last-child{border-right:0}
.lv button.on{background:var(--line);color:var(--paper)}
.lv button.redline{box-shadow:inset 3px 0 0 var(--red)}
.lvd{border:2px solid var(--line);border-top:0;padding:14px 16px}

/* Trắc nghiệm */
.quiz{margin-top:40px;border-top:6px solid var(--line);padding-top:18px}
.quiz h2{font-size:26px;font-stretch:82%}
.q{border:2px solid var(--line);margin-top:16px}
.q .qh{display:flex;gap:12px;padding:12px 16px;border-bottom:2px solid var(--line);background:var(--band)}
.q .qh b{font-stretch:80%;font-size:18px;flex:none}
.q .qh p{margin:0;font-weight:600}
.opts{display:grid}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;border-bottom:1px solid var(--rule);background:transparent;padding:11px 16px;cursor:pointer;font-size:15px;line-height:1.45}
.opt:last-child{border-bottom:0}
.opt:hover{background:var(--panel)}
.opt .k{flex:none;width:24px;height:24px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:12px}
.opt.sel .k{background:var(--line);color:var(--paper)}
.opt.right{background:var(--ok-soft)} .opt.right .k{border-color:var(--ok);background:var(--ok);color:var(--paper)}
.opt.wrong{background:var(--bad-soft)} .opt.wrong .k{border-color:var(--bad);background:var(--bad);color:var(--paper)}
.qf{padding:10px 16px;border-top:2px solid var(--line);font-size:14.5px}
.qf.hint{border-top:1px dashed var(--rule);color:var(--mute)}
.qtools{display:flex;gap:14px;flex-wrap:wrap;padding:8px 16px;border-top:1px solid var(--rule)}
.linkbtn{background:none;border:0;padding:0;font-weight:600;font-size:13px;border-bottom:1px solid var(--mute);cursor:pointer;color:var(--mute)}
.linkbtn:hover{color:var(--ink)}
.result{margin-top:18px;border:2px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);gap:0}
.result .sc{padding:16px 22px;border-right:2px solid var(--line);display:grid;place-items:center}
.result .sc b{font-size:46px;font-weight:800;font-stretch:72%;line-height:1}
.result .ms{padding:16px 18px}
.result.pass .sc{background:var(--ok-soft)}
.result.fail .sc{background:var(--bad-soft)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* Trợ giúp ngữ cảnh */
.aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);border:2px solid var(--line);max-height:calc(100vh - 100px);overflow:auto}
.aside section{padding:14px 16px;border-bottom:2px solid var(--line)}
.aside section:last-child{border-bottom:0}
.aside h4{font-size:15px;margin:2px 0 8px}
.aside p,.aside li{font-size:14px;line-height:1.5}
.aside ul{margin:0;padding-left:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:transparent;padding:3px 8px;font-size:12.5px;cursor:pointer}
.chip:hover{background:var(--band)}
.tutor-log{display:grid;gap:8px;margin:8px 0;max-height:300px;overflow:auto}
.msg{font-size:13.5px;line-height:1.5;padding:8px 10px;white-space:pre-wrap}
.msg.u{background:var(--band)}
.msg.a{border-left:3px solid var(--line);background:var(--panel)}
.tutor textarea{min-height:64px;font-size:14px;resize:vertical}
.helpBtn{display:none}

/* Popover thuật ngữ */
#pop{position:fixed;z-index:50;max-width:340px;background:var(--paper);border:2px solid var(--line);padding:12px 14px;font-size:14px;line-height:1.5;box-shadow:6px 6px 0 var(--line)}
#pop b{display:block;font-weight:800;margin-bottom:4px}
#pop .lbl{display:block;margin-top:8px}

/* Thuật ngữ, chứng nhận */
.gl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:2px solid var(--line)}
.gl>div{padding:14px 16px;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);min-width:0}
.gl b{display:block}
.cert{border:2px solid var(--line);padding:26px;margin-top:20px;position:relative;background:var(--panel)}
.cert h3{font-size:30px;font-stretch:75%;margin:8px 0}
.cert .who{font-size:24px;font-weight:800;border-bottom:2px solid var(--line);display:inline-block;padding-bottom:4px;margin:8px 0 12px}
.mark{display:inline-block;vertical-align:middle}
.note{font-size:13px;color:var(--mute)}
.path{display:flex;flex-wrap:wrap;gap:0;margin-top:8px}
.path span{border:2px solid var(--line);margin:0 -2px -2px 0;padding:6px 10px;font-size:13px;font-weight:600}
.path span.h{background:var(--line);color:var(--paper)}

@media (max-width:1100px){.mod{grid-template-columns:minmax(0,1fr)}.aside{position:static;max-height:none}.helpBtn{display:inline-flex}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  #menuBtn{display:inline-block}
  .side{position:fixed;z-index:25;left:0;top:calc(env(safe-area-inset-top,0px) + 58px);width:min(340px,88vw);height:calc(100vh - 58px - env(safe-area-inset-top,0px));transform:translateX(-105%);transition:transform .2s;background:var(--paper);padding-left:env(safe-area-inset-left,0px);border-bottom:2px solid var(--line)}
  .side.open{transform:none}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){
  .g2,.g3,.g4,.gl{grid-template-columns:minmax(0,1fr)}
  .brand span{display:none}
  .brand b{font-size:17px;white-space:nowrap}
  .top{gap:10px}
  .result{grid-template-columns:minmax(0,1fr)}
  .result .sc{border-right:0;border-bottom:2px solid var(--line)}
  .rowf{grid-template-columns:minmax(0,1fr)}
  .lv button{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== v2: màu theo chương trình · chặng học · sơ đồ trực quan · luyện tập ===== */
:root{ --c-qt:#25467F; --c-ai:#2f6fd0; --c-lt:#ec3013; --c:var(--ink); }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --c-qt:#93b3ec; --c-ai:#80b3ff; --c-lt:#ff6a52; }}
:root[data-theme="dark"]{ --c-qt:#93b3ec; --c-ai:#80b3ff; --c-lt:#ff6a52; }
[data-prog="qt"]{--c:var(--c-qt)} [data-prog="ai"]{--c:var(--c-ai)} [data-prog="lt"]{--c:var(--c-lt)}
[data-prog]{--c-soft:color-mix(in srgb,var(--c) 10%,var(--paper));--c-mid:color-mix(in srgb,var(--c) 28%,var(--paper))}

/* Hero học phần */
.hero{border:2px solid var(--line);background:var(--c-soft);padding:22px 22px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end;position:relative;overflow:hidden}
.hero .code{font-weight:800;font-stretch:70%;font-size:15px;letter-spacing:.12em;color:var(--c);text-transform:uppercase}
.hero h1{font-size:clamp(28px,4.2vw,46px);font-stretch:76%;margin:6px 0 10px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px}
.hero .meta span{border:1.5px solid var(--line);padding:2px 8px;font-size:12.5px;font-weight:600;background:var(--paper)}
.motif{display:block}
.motif .ln{stroke:var(--line);stroke-width:2;fill:none}
.motif .nd{fill:var(--paper);stroke:var(--line);stroke-width:2.5;transition:fill .3s}
.motif .nd.on{fill:var(--c)}
.motif .nd.cur{stroke:var(--c);stroke-width:4}
.motif .hm{fill:var(--red)}

/* Thanh chặng */
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:2px solid var(--line);border-top:0;background:var(--paper);position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:5}
.steps button{border:0;border-right:2px solid var(--line);background:transparent;padding:10px 8px 9px;text-align:left;cursor:pointer;display:grid;gap:1px;min-width:0}
.steps button:last-child{border-right:0}
.steps button i{font-style:normal;font-weight:800;font-stretch:75%;font-size:13px;color:var(--mute)}
.steps button span{font-size:13px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.steps button.seen i{color:var(--c)}
.steps button.on{background:var(--line);color:var(--paper)} .steps button.on i{color:var(--paper)}
.stepbar{height:4px;background:var(--rule)} .stepbar i{display:block;height:100%;background:var(--c);transition:width .35s}
.panel{padding-top:26px;animation:rise .35s ease both}
@keyframes rise{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:30px;border-top:2px solid var(--line);padding-top:16px}
.ptitle{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.ptitle b{font-size:44px;font-weight:800;font-stretch:65%;color:var(--c);line-height:1}
.ptitle h2{font-size:24px;font-stretch:85%}
.warm{border:2px solid var(--line);padding:22px 22px 20px;background:var(--panel);font-size:21px;font-weight:600;line-height:1.45;letter-spacing:-.01em;max-width:62ch;position:relative}
.warm::before{content:"Câu hỏi khởi động";display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--c);font-weight:700;margin-bottom:8px}
.chips2{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips2 span{background:var(--c-soft);border:1.5px solid var(--c);padding:4px 10px;font-size:13px;font-weight:600}

/* Bộ sơ đồ trực quan */
.viz{margin:4px 0 26px;display:grid;gap:16px}
.v-cap{margin:0;color:var(--mute);font-size:14px}
.v-flow{display:flex;flex-wrap:wrap;gap:0;counter-reset:fl}
.v-flow>div{flex:1 1 140px;min-width:0;border:2px solid var(--line);margin:0 -2px -2px 0;padding:12px 26px 12px 12px;position:relative;background:var(--paper);counter-increment:fl}
.v-flow>div::before{content:counter(fl,decimal-leading-zero);display:block;font-weight:800;font-stretch:70%;color:var(--c);font-size:13px}
.v-flow>div::after{content:"→";position:absolute;right:7px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--c)}
.v-flow>div:last-child::after{content:""}
.v-flow b{display:block;font-size:15px;line-height:1.25}
.v-flow span{display:block;font-size:13px;color:var(--mute);line-height:1.4;margin-top:3px}
.v-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;border:2px solid var(--line)}
.v-cards>div{padding:14px;border-right:2px solid var(--line);border-bottom:2px solid var(--line);margin:0 -2px -2px 0;min-width:0;background:var(--paper)}
.v-cards i{font-style:normal;font-weight:800;font-stretch:65%;font-size:30px;color:var(--c);line-height:1;display:block}
.v-cards b{display:block;margin:6px 0 3px;line-height:1.25}
.v-cards span{font-size:13.5px;color:var(--mute);line-height:1.45;display:block}
.v-cards{overflow:hidden}
.v-vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.v-vs>div{border:2px solid var(--line);padding:14px 16px;min-width:0}
.v-vs .bad{border-color:var(--bad);background:var(--bad-soft)} .v-vs .good{border-color:var(--ok);background:var(--ok-soft)}
.v-vs b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.v-vs .bad b{color:var(--bad)} .v-vs .good b{color:var(--ok)}
.v-vs b::before{margin-right:6px} .v-vs .bad b::before{content:"✕"} .v-vs .good b::before{content:"✓"}
.v-vs p{margin:6px 0 0;font-size:14.5px}
.v-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:2px solid var(--line);overflow:hidden}
.v-stats>div{padding:14px 16px;border-right:2px solid var(--line);margin-right:-2px;min-width:0}
.v-stats b{display:block;font-size:40px;font-weight:800;font-stretch:65%;line-height:1;color:var(--c)}
.v-stats span{font-size:13.5px;color:var(--mute);display:block;margin-top:6px;line-height:1.4}
.v-ladder{display:flex;align-items:flex-end;gap:0;overflow-x:auto;padding-bottom:2px}
.v-ladder>div{flex:1 0 110px;border:2px solid var(--line);margin-right:-2px;padding:10px;background:linear-gradient(var(--c-soft),var(--c-soft));min-height:calc(70px + var(--i,0) * 22px);display:flex;flex-direction:column;justify-content:flex-end}
.v-ladder b{font-weight:800;font-stretch:70%;font-size:22px;color:var(--c);line-height:1}

.v-layers{display:grid;border:2px solid var(--line)}

.case{border:2px solid var(--line);margin-top:24px}

.case header .lbl{color:var(--paper);opacity:.8}
.case .in{padding:16px 18px}
.case .ask{font-weight:700;border-left:5px solid var(--c);padding:6px 12px;background:var(--c-soft);margin:12px 0}
.reveal{border-top:2px dashed var(--rule);margin-top:12px;padding-top:12px}
.task{border:2px solid var(--line);margin-top:24px}
.task header{padding:12px 16px;border-bottom:2px solid var(--line);background:var(--c-soft)}
.task .in{padding:16px 18px}
.task ol{padding-left:22px;margin:6px 0 12px}
.task .out{border:1.5px dashed var(--line);padding:10px 12px;margin:10px 0 16px;font-weight:600}
.rub td:last-child{white-space:nowrap}
.seg{display:inline-flex;border:1.5px solid var(--line)}
.seg button{border:0;border-right:1.5px solid var(--line);background:transparent;padding:3px 9px;font-size:12.5px;font-weight:600;cursor:pointer}

.seg button.on{background:var(--line);color:var(--paper)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:2px solid var(--line)}

.keys>div:last-child{border-right:0}

.keys i em{transform:rotate(-45deg);font-style:normal;font-weight:800;font-size:13px;color:var(--c)}
.keys p{margin:0;font-weight:600;line-height:1.45}
.flips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.flip{perspective:900px;cursor:pointer;min-height:150px;border:0;padding:0;background:none;text-align:left}
.flip .fi{position:relative;width:100%;height:100%;min-height:150px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;border:2px solid var(--line);padding:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:space-between}
.flip .fa{background:var(--paper)} .flip .fb{background:var(--c-soft);transform:rotateY(180deg)}
.flip .fa p,.flip .fb p{margin:0;font-weight:600;font-size:16px;line-height:1.45}

@media (prefers-reduced-motion:reduce){.flip .fi{transition:none}.panel{animation:none}}

/* Luyện tập / kiểm tra */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}

.burst{display:flex;gap:6px;margin-top:8px}
.burst i{width:10px;height:10px;transform:rotate(45deg) scale(0);background:var(--c);animation:pop .5s ease forwards}
.burst i:nth-child(2){animation-delay:.08s}.burst i:nth-child(3){animation-delay:.16s;background:var(--red)}.burst i:nth-child(4){animation-delay:.24s}.burst i:nth-child(5){animation-delay:.32s}

@media (prefers-reduced-motion:reduce){.burst i{animation:none;transform:rotate(45deg)}}

/* Đáp án, quy chế, điểm */
details.key{border:2px solid var(--line);margin-top:-2px}
details.key>summary{cursor:pointer;padding:12px 16px;font-weight:700;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;list-style:none}

.lvlband>div{padding:14px;border-right:2px solid var(--line)} .lvlband>div:last-child{border-right:0}
.lvlband b{display:block;font-size:22px;font-stretch:80%}
.prog-tag{display:inline-block;width:10px;height:10px;transform:rotate(45deg);background:var(--c);margin-right:8px;vertical-align:middle}

@media (max-width:900px){

const PROGRAMS = [

  intro:'Nền quản trị cần có trước khi đưa AI vào: doanh nghiệp là một hệ thống, quy trình là đơn vị tổ chức, quyền phải viết ra, số phải nhìn thấy kịp lúc.',

{ id:'qt1', t:'Doanh nghiệp là một hệ thống', min:35,
 goals:['Phân biệt chuỗi tạo giá trị, năng lực hỗ trợ và nguồn lực cốt lõi','Gọi tên năm nguồn lực cốt lõi của doanh nghiệp mình','Hiểu vì sao đơn vị tổ chức là quy trình chứ không chỉ là phòng ban'],
 body:`<p>Một doanh nghiệp, dù một người hay ba mươi người, đều gồm ba lớp khác bản chất. Nhìn lẫn ba lớp này là lý do phổ biến khiến chủ doanh nghiệp đầu tư sai chỗ.</p>
<div class="tbl"><table><tr><th>Lớp</th><th>Là gì</th><th>Ví dụ</th></tr>
<tr><td><b><dfn data-k="chuoi">Chuỗi tạo giá trị</dfn></b></td><td>Các khối nghiệp vụ tạo ra doanh thu</td><td>Kinh doanh, vận hành, sản xuất, dịch vụ khách hàng</td></tr>
<tr><td><b><dfn data-k="hotro">Năng lực hỗ trợ</dfn></b></td><td>Bộ phận phục vụ chuỗi tạo giá trị</td><td>Kế toán, nhân sự, pháp chế, hành chính</td></tr>
<tr><td><b><dfn data-k="nguonluc">Nguồn lực cốt lõi</dfn></b></td><td>Thứ doanh nghiệp sở hữu, mất nhanh, xây chậm</td><td>Vốn & Tài sản; Tri thức & Công nghệ; Con người & Văn hóa; Thương hiệu & Uy tín; Thị trường & Quan hệ</td></tr></table></div>
<p>Chuỗi tạo giá trị huy động nguồn lực, và kết quả của nó phải bồi đắp lại nguồn lực. Một tháng bán được nhiều nhưng làm mất uy tín vì giao trễ là một tháng tiêu hao nguồn lực, dù doanh thu tăng.</p>
<h3>Quy trình là đơn vị tổ chức</h3>
<p>Đơn vị tổ chức công việc không chỉ là phòng ban, mà là quy trình có đầu vào, đầu ra, người chịu trách nhiệm và chỉ tiêu đo lường. Quy trình "Từ đơn hàng đến thu tiền" đi qua kinh doanh, kho, giao nhận và kế toán, nhưng phải có một người chịu trách nhiệm hiệu quả của toàn quy trình.</p>
<blockquote>Khi chưa ai sở hữu một quy trình xuyên suốt, mỗi bộ phận làm đúng phần mình mà khách vẫn nhận hàng trễ.</blockquote>`,
 ex:{t:'Xưởng cà phê Mộc (ví dụ giả định)', h:`<p>Mộc tự rang và đóng gói cà phê, mở workshop pha chế, bán túi cà phê và dụng cụ trên sàn.</p>
<ul><li><b>Chuỗi tạo giá trị:</b> rang & đóng gói; tổ chức workshop; bán lẻ, bán sỉ trên Shopee, TikTok, website.</li>
<li><b>Năng lực hỗ trợ:</b> kế toán dịch vụ thuê ngoài, hành chính.</li>
<li><b>Nguồn lực cốt lõi:</b> công thức rang riêng (Tri thức), điểm đánh giá 4,8 trên sàn (Uy tín), danh sách học viên cũ (Thị trường & Quan hệ), vốn nằm trong hạt thô tồn kho (Vốn).</li></ul>
<p>Câu hỏi quản trị đầu tiên của Mộc không phải "dùng AI gì", mà là "quy trình nào đang tiêu hao nguồn lực nhanh nhất".</p>`},
 help:{read:'Đọc bảng ba lớp trước, rồi tự điền ba lớp cho doanh nghiệp của mình trên một tờ giấy.',mistakes:['Coi kế toán là "chuỗi tạo giá trị" vì nó quan trọng. Quan trọng không có nghĩa là tạo doanh thu.','Đánh đồng nguồn lực với tài sản hữu hình. Uy tín và tri thức cũng là nguồn lực.'],rel:['qt3','lt1-3','u4']},
 q:[
  ['Thành phần nào dưới đây thuộc lớp "nguồn lực cốt lõi"?',['Kế toán và nhân sự','Kinh doanh và vận hành','Thương hiệu & Uy tín','Website bán hàng'],2,'Nguồn lực cốt lõi gồm Vốn & Tài sản, Tri thức & Công nghệ, Con người & Văn hóa, Thương hiệu & Uy tín, Thị trường & Quan hệ.','Nguồn lực là thứ "mất nhanh, xây chậm".'],
  ['Đặc tính nào mô tả đúng nguồn lực cốt lõi?',['Dễ thuê ngoài','Mất nhanh, xây chậm','Luôn ghi trên bảng cân đối kế toán','Chỉ doanh nghiệp lớn mới có'],1,'Định nghĩa trong đề án: thứ doanh nghiệp sở hữu, mất nhanh, xây chậm.',''],
  ['Kế toán nằm ở lớp nào?',['Chuỗi tạo giá trị','Năng lực hỗ trợ','Nguồn lực cốt lõi','Không thuộc lớp nào'],1,'Kế toán phục vụ chuỗi tạo giá trị, không trực tiếp tạo doanh thu.',''],
  ['Quy trình "Từ đơn hàng đến thu tiền" đi qua bốn bộ phận. Điều gì là bắt buộc?',['Mỗi bộ phận tự đặt chỉ tiêu riêng','Một người chịu trách nhiệm hiệu quả toàn quy trình','Gộp bốn bộ phận thành một','Giao cho AI quản lý'],1,'Quy trình xuyên suốt cần một người sở hữu kết quả toàn tuyến, dù nhiều bộ phận cùng làm.','Ai chịu trách nhiệm khi khách nhận hàng trễ?'],
  ['Quan hệ đúng giữa chuỗi tạo giá trị và nguồn lực là gì?',['Chuỗi dùng nguồn lực và không cần hoàn lại','Chuỗi huy động nguồn lực và kết quả phải bồi đắp lại nguồn lực','Nguồn lực chỉ dùng cho năng lực hỗ trợ','Hai thứ độc lập'],1,'Đề án mục 14: chuỗi tạo giá trị huy động nguồn lực, kết quả của nó phải bồi đắp lại nguồn lực.','']
 ]},

{ id:'qt2', t:'Mô hình kinh doanh và hình thức pháp lý', min:40,
 goals:['Xếp doanh nghiệp vào đúng một trong ba kiến trúc tham chiếu','Biết ba tín hiệu nên chuyển từ hộ kinh doanh lên công ty','Nắm các thay đổi pháp lý 2026 ảnh hưởng tới vận hành'],
 body:`<p>Trước khi thiết kế bộ máy, phải gọi đúng tên mình đang bán gì. LATTICE quy tám nhóm ngành về ba kiến trúc tham chiếu theo bản chất của thứ được bán:</p>
<div class="tbl"><table><tr><th>Kiến trúc</th><th>Bản chất</th><th>Ví dụ</th></tr>
<tr><td><b>Thương mại & Hàng hóa</b></td><td>Mua về bán lại, có tồn kho</td><td>Phân phối, bán lẻ, bán sàn, nhập khẩu</td></tr>
<tr><td><b>Dịch vụ</b></td><td>Bán giờ công, chỗ phục vụ hoặc chuyên môn</td><td>Spa, phòng khám, tư vấn, đào tạo, sửa chữa</td></tr>
<tr><td><b>Sản xuất</b></td><td>Làm ra hàng (hoặc thuê gia công theo công thức của mình) rồi xuất kho</td><td>Cơ khí, thực phẩm, mỹ phẩm tự sản xuất</td></tr></table></div>
<p>Làm cả hai thì chọn mảng tạo nhiều doanh thu nhất làm kiến trúc chính; các mảng còn lại được xử lý như lớp riêng (học phần U4).</p>
<h3>Hộ kinh doanh hay công ty</h3>
<p>Không nhất thiết phải chuyển lên công ty trước. Nhưng dù giữ hình thức nào, nên vận hành sổ sách như một doanh nghiệp ngay từ đầu, vì chất lượng dữ liệu tài chính quyết định agent tài chính có làm việc được hay không. Ba tín hiệu nên chuyển đổi: khách đòi hóa đơn VAT; có hợp đồng rủi ro pháp lý đáng kể; cần ký kết dài hạn với đối tác lớn.</p>
<h3>Bối cảnh pháp lý 2026</h3>
<ul><li>Từ 01/01/2026, hộ và cá nhân kinh doanh tự kê khai – tự tính – tự nộp theo doanh thu thực tế; ngưỡng miễn thuế nâng lên 1 tỷ đồng/năm (NĐ 68/2026, sửa đổi bởi NĐ 141/2026).</li>
<li>Hộ kinh doanh doanh thu từ 1 tỷ đồng/năm dùng hóa đơn điện tử khởi tạo từ máy tính tiền (NĐ 70/2025).</li>
<li>Luật Thương mại điện tử hiệu lực 01/7/2026: xác minh danh tính người bán và người livestream.</li></ul>
<p class="note">Văn bản pháp luật đang thay đổi nhanh. Kiểm tra lại hiệu lực trước khi trích dẫn trong hồ sơ chính thức.</p>
<blockquote>Đề án đọc chính sách như một cơ hội thiết kế: chi phí tuân thủ và chi phí AI-hóa hội tụ vào cùng một khoản đầu tư là dữ liệu sạch.</blockquote>`,
 ex:{t:'Ba chủ doanh nghiệp, ba kiến trúc (ví dụ giả định)', h:`<ul><li><b>Lam Beauty</b> nhập mỹ phẩm Hàn về bán trên Shopee và TikTok → <b>Thương mại & Hàng hóa</b>. Nghẽn thật là vốn lưu động trong tồn kho.</li>
<li><b>Spa An Nhiên</b> bán liệu trình chăm sóc da → <b>Dịch vụ</b>. Nghẽn thật là giờ công của kỹ thuật viên.</li>
<li><b>Cơ khí Tân Phát</b> gia công chi tiết theo bản vẽ → <b>Sản xuất</b>. Nghẽn thật là tài sản vật lý và lao động trực tiếp.</li></ul>
<p>Xưởng cà phê Mộc làm cả ba. Doanh thu bán túi cà phê lớn nhất, nên kiến trúc chính là Thương mại & Hàng hóa, còn rang xay và workshop là hai lớp riêng.</p>`},
 help:{read:'Xác định kiến trúc trước, rồi mới đọc phần pháp lý: kiến trúc quyết định khối nghiệp vụ, pháp lý quyết định ranh giới.',mistakes:['Chọn kiến trúc theo ngành nghe "oai" thay vì theo mảng tạo nhiều doanh thu nhất.','Nghĩ hộ kinh doanh thì không cần sổ sách chuẩn.'],rel:['lt1-3','u1','u2']},
 q:[
  ['Một spa bán liệu trình chăm sóc da thuộc kiến trúc nào?',['Thương mại & Hàng hóa','Dịch vụ','Sản xuất','Không xếp được'],1,'Spa bán giờ công và chỗ phục vụ, nên thuộc kiến trúc Dịch vụ.',''],
  ['Đâu KHÔNG phải một trong ba tín hiệu nên chuyển từ hộ kinh doanh lên công ty?',['Khách đòi hóa đơn VAT','Có hợp đồng rủi ro pháp lý đáng kể','Muốn dùng phần mềm AI','Cần ký kết dài hạn với đối tác lớn'],2,'Ba tín hiệu là: khách đòi VAT, hợp đồng rủi ro pháp lý đáng kể, ký kết dài hạn với đối tác lớn.',''],
  ['Vì sao nên vận hành sổ sách như doanh nghiệp ngay cả khi là hộ kinh doanh?',['Để được miễn thuế','Vì chất lượng dữ liệu tài chính quyết định agent tài chính có làm việc được hay không','Vì luật bắt buộc mọi hộ phải có kế toán trưởng','Để dễ vay ngân hàng'],1,'Đây là lập luận của kho tri thức LATTICE: dữ liệu tài chính sạch là điều kiện để AI tài chính làm việc.',''],
  ['Doanh nghiệp làm cả thương mại và dịch vụ chọn kiến trúc chính thế nào?',['Chọn mảng có nhiều nhân viên nhất','Chọn mảng tạo nhiều doanh thu nhất','Luôn chọn Dịch vụ','Chọn mảng mới nhất'],1,'Hướng dẫn của Khảo sát nhanh: làm cả hai thì chọn mảng tạo nhiều doanh thu nhất.',''],
  ['Theo đề án, ngưỡng miễn thuế của hộ kinh doanh từ 2026 là bao nhiêu?',['100 triệu đồng/năm','500 triệu đồng/năm','1 tỷ đồng/năm','3 tỷ đồng/năm'],2,'NĐ 68/2026 (sửa đổi bởi NĐ 141/2026) nâng ngưỡng miễn thuế lên 1 tỷ đồng/năm. Luôn kiểm tra lại hiệu lực văn bản.','']
 ]},

{ id:'qt3', t:'Quy trình và SOP', min:40,
 goals:['Kiểm kê được 5–10 việc lặp lại nhiều nhất','Viết một SOP mà người mới đọc là làm được','Nhận ra ngoại lệ là nơi tự động hóa thường vỡ'],
 body:`<p>AI chỉ học được việc đã viết thành các bước. Vì vậy quy trình là nền của mọi thứ phía sau. "Có quy trình" nghĩa là có văn bản hoặc tệp mà người mới đọc vào làm được, không cần hỏi lại.</p>
<h3>Bước 1 · Kiểm kê</h3>
<p>Liệt kê 5–10 việc lặp lại nhiều nhất trong tuần. Với mỗi việc ghi: một tuần làm bao nhiêu lần, mỗi lần mất bao lâu, ai làm, và nếu người đó nghỉ một tuần thì việc gì xảy ra (vẫn chạy, chậm lại, hay dừng hẳn).</p>
<h3>Bước 2 · Viết <dfn data-k="sop">SOP</dfn></h3>
<p>Một SOP dùng được có năm phần: mục tiêu diễn đạt bằng kết quả; đầu vào và nơi lấy; các bước theo thứ tự; ngưỡng và ngoại lệ (khi nào phải dừng hỏi ai); định nghĩa xong (làm sao biết đã làm đúng).</p>
<h3>Bước 3 · Săn ngoại lệ</h3>
<p>Quy trình chuẩn thì ai cũng mô tả được. Thứ làm hỏng mọi dự án tự động hóa là ca ngoại lệ không ai nhắc trong cuộc họp đầu tiên: khách đặt hàng qua điện thoại lúc 10 giờ đêm, lô hàng về thiếu, một khách lớn được miễn quy trình.</p>
<blockquote>Tri thức nằm trong đầu người là rủi ro gián đoạn: một người nghỉ là một việc dừng.</blockquote>`,
 ex:{t:'SOP "Xác nhận đơn sỉ" của Xưởng cà phê Mộc', h:`<ul><li><b>Mục tiêu:</b> mọi đơn sỉ được xác nhận trong 2 giờ làm việc, đúng giá theo bảng giá đại lý.</li>
<li><b>Đầu vào:</b> đơn từ email hoặc form; bảng giá đại lý bản hiện hành; tồn kho hạt rang.</li>
<li><b>Các bước:</b> kiểm mã đại lý → áp bảng giá → kiểm tồn → gửi xác nhận kèm ngày giao.</li>
<li><b>Ngoại lệ:</b> chiết khấu ngoài bảng → chuyển chủ xưởng; thiếu hàng → đề xuất ngày giao mới, không tự hứa.</li>
<li><b>Xong khi:</b> đại lý nhận xác nhận, đơn có trạng thái "đã xác nhận" trong bảng tính.</li></ul>
<p>Bản SOP này là đầu vào trực tiếp để sau này giao cho một agent ở mức L2.</p>`},
 help:{read:'Làm bài tập ngay: chọn một việc lặp lại và viết SOP năm phần trong 20 phút.',mistakes:['Viết SOP chỉ có bước, thiếu ngoại lệ và định nghĩa xong.','Viết SOP cho việc hiếm khi xảy ra thay vì việc lặp lại nhiều nhất.'],rel:['lt2-3','qt4','ai2']},
 q:[
  ['Theo LATTICE, "có quy trình" nghĩa là gì?',['Có sơ đồ tổ chức','Có văn bản hoặc tệp mà người mới đọc vào làm được, không cần hỏi lại','Có người làm việc đó lâu năm','Có phần mềm quản lý'],1,'Định nghĩa trong hướng dẫn Khảo sát nhanh.',''],
  ['Phần nào của SOP xác định khi nào phải dừng và hỏi người?',['Mục tiêu','Đầu vào','Ngưỡng và ngoại lệ','Định nghĩa xong'],2,'Ngưỡng và ngoại lệ chỉ ra lúc nào việc vượt quyền và phải chuyển ai.',''],
  ['Vì sao phải săn ngoại lệ trước khi tự động hóa?',['Ngoại lệ chiếm phần lớn khối lượng','Ngoại lệ không ai nhắc tới là thứ làm hỏng tự động hóa trong tuần đầu vận hành','Để tăng số bước trong SOP','Vì luật yêu cầu'],1,'Tài liệu chu trình khách hàng: ca ngoại lệ không ai nhắc tới làm hồ sơ đúng trên giấy và sai khi chạy thật.',''],
  ['Kiểm kê một việc lặp lại cần ghi những gì?',['Chỉ tên việc','Tần suất, thời lượng, ai làm, hậu quả nếu người đó nghỉ','Chi phí phần mềm','Ý kiến của khách'],1,'Bộ câu hỏi Nhóm 1 (A1–A3) hỏi đúng các thông tin này.',''],
  ['Tri thức chỉ nằm trong đầu một người được LATTICE nêu là gì?',['Lợi thế cạnh tranh','Rủi ro gián đoạn','Bí mật kinh doanh cần giữ','Điều bình thường ở doanh nghiệp nhỏ'],1,'Luật L05 "Một người nghỉ là một việc dừng" coi đây là rủi ro gián đoạn.','']
 ]},

{ id:'qt4', t:'Cơ cấu tổ chức và phân quyền', min:40,
 goals:['Mô tả bộ máy bốn tầng','Tránh ba cặp vai xung đột khi một người kiêm nhiều vai','Thiết kế đường đi của ngoại lệ đến đúng người'],
 body:`<div class="tbl"><table><tr><th>Tầng</th><th>Ai</th><th>Quyết định gì</th><th>AI đảm nhiệm?</th></tr>
<tr><td>1</td><td>Chủ sở hữu / HĐQT</td><td>Chiến lược, ngân sách năm, đầu tư lớn; ban hành <dfn data-k="hienchuong">Hiến chương AI</dfn></td><td>Không</td></tr>
<tr><td>2</td><td>Ban điều hành</td><td>Điều hành theo phạm vi; mỗi giám đốc giữ một nguồn lực cốt lõi</td><td>Không. Luôn là người</td></tr>
<tr><td>3</td><td>Trưởng khối</td><td>Phân việc, theo dõi SLA, xử lý ngoại lệ trong quyền</td><td>Người hoặc AI, khi việc chủ yếu là điều phối theo luật</td></tr>
<tr><td>4</td><td><dfn data-k="teamai">Team AI</dfn></td><td>Thực hiện tác vụ trong phạm vi được giao</td><td>Có, theo mức tự chủ từng tác vụ</td></tr></table></div>
<h3>Một người, nhiều vai</h3>
<p>Công ty nhỏ thì một người kiêm nhiều vai và đăng nhập theo từng vai. Chỉ tránh ba cặp xung đột: bán hàng + duyệt chi, công nợ; mua hàng + thanh toán; sản xuất + nghiệm thu chất lượng.</p>
<h3>Ngoại lệ đi tới đúng vai</h3>
<p>Ngoại lệ không dồn về CEO. Tác vụ vượt ngưỡng chuyển cho vai có thẩm quyền; vượt quyền vai thì lên giám đốc phụ trách; vượt quyền giám đốc mới tới CEO. Mỗi ngoại lệ phải có: lý do chuyển, người có thẩm quyền, thời hạn xử lý, dữ liệu và phương án đề xuất, kết quả quyết định và lưu vết.</p>
<blockquote>Phải viết ra ai được duyệt việc gì, tới ngưỡng tiền nào, ngoài ngưỡng chuyển ai. Chưa viết ra thì AI cũng chỉ dời nút cổ chai sang chỗ duyệt.</blockquote>`,
 ex:{t:'Bảng ngưỡng của Lam Beauty (ví dụ giả định)', h:`<div class="tbl"><table><tr><th>Việc</th><th>Trong ngưỡng</th><th>Vượt ngưỡng chuyển</th></tr>
<tr><td>Hoàn tiền đơn lỗi</td><td>Dưới 300.000đ: nhân viên CSKH tự duyệt</td><td>Trưởng kinh doanh</td></tr>
<tr><td>Chiết khấu đại lý</td><td>Theo bảng giá đã duyệt</td><td>Chủ doanh nghiệp</td></tr>
<tr><td>Đặt hàng bổ sung</td><td>Dưới hạn mức tồn kho tháng</td><td>GĐ Tài chính (do chủ kiêm)</td></tr></table></div>
<p>Chủ Lam Beauty kiêm cả Trưởng kinh doanh lẫn GĐ Tài chính. Hệ thống vẫn ghi ngoại lệ theo vai, để khi tuyển thêm người chỉ cần chuyển vai.</p>`},
 help:{read:'Lập bảng "việc · ngưỡng · người duyệt" cho năm việc thường vượt quy định nhất.',mistakes:['Để một người vừa bán hàng vừa duyệt công nợ.','Ghi "hỏi sếp" thay cho ngưỡng tiền cụ thể.'],rel:['lt2-5','lt3-4','lt4-1']},
 q:[
  ['Tầng nào trong bộ máy luôn là người?',['Trưởng khối','Team AI','Ban điều hành','Không tầng nào bắt buộc'],2,'Đề án mục 5: ban điều hành luôn là người.',''],
  ['Cặp vai nào cần tránh để một người kiêm?',['Marketing + nội dung','Mua hàng + thanh toán','Kế toán + báo cáo','CSKH + bán hàng online'],1,'Ba cặp xung đột: bán hàng + duyệt chi, công nợ; mua hàng + thanh toán; sản xuất + nghiệm thu chất lượng.',''],
  ['Ngoại lệ vượt quyền một vai đi tiếp tới đâu?',['Thẳng tới CEO','Tới giám đốc phụ trách, vượt quyền giám đốc mới tới CEO','Tới AI Risk & Compliance','Bị hủy'],1,'Ngoại lệ đi tới đúng vai, rồi giám đốc phụ trách, rồi mới tới CEO.',''],
  ['Hiến chương AI do ai duyệt?',['CEO','Người vận hành hệ thống','HĐQT / chủ sở hữu','Nhà cung cấp AI'],2,'Hiến chương AI do HĐQT duyệt, ghi mức tự chủ tối đa, quyết định không giao AI và cách kiểm toán nhật ký.',''],
  ['Trưởng khối có thể là AI khi nào?',['Khi doanh nghiệp dưới 3 người','Khi việc của khối chủ yếu là điều phối theo luật','Khi CEO bận','Không bao giờ'],1,'Tầng 3 có thể là người hoặc AI, khi việc chủ yếu là điều phối theo luật.','']
 ]},

{ id:'qt5', t:'Tài chính cho người điều hành', min:35,
 goals:['Tính số ngày tiền mặt và đọc ngưỡng','Biết vì sao thấy lãi lỗ chậm là một điểm đau','Đặt trần chi phí AI ngay từ đầu'],
 body:`<p>Người điều hành không cần làm kế toán, nhưng cần ba con số luôn nhìn thấy được.</p>
<h3>1 · Số ngày tiền mặt</h3>
<p><dfn data-k="ngaytien">Số ngày tiền mặt</dfn> = tiền mặt ÷ chi phí ngày. Ngưỡng lành mạnh trên 180 ngày cho doanh nghiệp một người (vì rủi ro một người); dưới 120 ngày là cảnh báo. Khi tính, lấy tiền mặt và tiền tài khoản hiện có; không tính tiền khách còn nợ hay hàng tồn, vì chưa thu về được ngay.</p>
<h3>2 · Lãi lỗ kịp lúc</h3>
<p>Nếu phải đến giữa tháng sau hoặc cuối quý mới biết tháng trước lãi hay lỗ, thì "đến khi biết tháng trước lỗ thì tháng này đã lỗ tiếp". LATTICE coi đây là điểm đau L06: không quy ra tiền, mà nêu độ trễ quyết định.</p>
<h3>3 · Chi phí AI trên doanh thu</h3>
<p>Chuẩn tham chiếu 2–8% doanh thu tùy ngành. Quan trọng hơn con số là phải có trần chi phí cứng theo ngày ngay từ đầu.</p>
<h3>Ranh giới tiền</h3>
<p>Mọi khoản thu vào tài khoản đứng tên công ty và có hóa đơn. LATTICE tự áp nguyên tắc này lên chính mình (quyết định D-M03): tiền thu chuyển về tài khoản Công ty Cổ phần Giải pháp LATTICE Next, xuất hóa đơn điện tử từng khoản.</p>`,
 ex:{t:'Mộc tính số ngày tiền mặt', h:`<p>Mộc có 180 triệu trong tài khoản. Chi phí cố định mỗi tháng (thuê xưởng, lương, công cụ, trả nợ) là 60 triệu, tức khoảng 2 triệu/ngày.</p>
<p>Số ngày tiền mặt = 180 ÷ 2 = <b>90 ngày</b>. Dưới ngưỡng cảnh báo 120 ngày. 250 triệu nằm trong hạt thô tồn kho không được tính.</p>
<p>Kết luận quản trị: ưu tiên quy trình thu tiền, công nợ đại lý và tồn kho trước khi đầu tư nội dung.</p>`},
 help:{read:'Tính ngay số ngày tiền mặt của doanh nghiệp mình bằng con số tháng gần nhất.',mistakes:['Cộng hàng tồn và công nợ phải thu vào tiền mặt.','Để chi phí AI không có trần theo ngày.'],rel:['qt7','qt8','ai7']},
 q:[
  ['Công thức số ngày tiền mặt là gì?',['Doanh thu ÷ chi phí ngày','Tiền mặt ÷ chi phí ngày','Lợi nhuận ÷ 30','Tồn kho ÷ chi phí ngày'],1,'Đề án mục 16.2: tiền mặt ÷ chi phí ngày.',''],
  ['Ngưỡng lành mạnh của số ngày tiền mặt cho doanh nghiệp một người?',['Trên 30 ngày','Trên 90 ngày','Trên 180 ngày','Trên 365 ngày'],2,'Trên 180 ngày, do rủi ro một người. Dưới 120 ngày là cảnh báo.',''],
  ['Khoản nào KHÔNG tính vào tiền mặt khi ước số tháng chạy được?',['Tiền trong tài khoản','Tiền mặt tại quỹ','Tiền khách còn nợ','Cả ba đều tính'],2,'Tiền khách còn nợ và hàng tồn chưa thu về ngay, nên không tính.',''],
  ['Chuẩn tham chiếu chi phí AI trên doanh thu là bao nhiêu?',['Dưới 1%','2–8% tùy ngành','10–15%','Trên 20%'],1,'Kho tri thức LATTICE: 2–8% doanh thu tùy ngành, kèm trần chi phí cứng theo ngày.',''],
  ['Điểm đau L06 "không nhìn thấy lãi lỗ kịp lúc" được định giá thế nào?',['Quy ra số tiền thiệt hại','Nêu độ trễ quyết định, không quy ra tiền','Lấy số liệu ngành','Không nêu trong đề xuất'],1,'Luật L06 nêu độ trễ quyết định, không quy ra tiền.','']
 ]},

{ id:'qt6', t:'Khách hàng, marketing và CRM', min:45,
 goals:['Nắm bốn khác biệt của thị trường Việt Nam','Dựng mô hình dữ liệu khách hàng tối thiểu','Biết khoảnh khắc nào bắt buộc có con người'],
 body:`<h3>Bốn điểm Việt Nam phải thiết kế riêng</h3>
<div class="tbl"><table><tr><th>Yếu tố</th><th>Việt Nam</th><th>Điều chỉnh</th></tr>
<tr><td>Kênh giao tiếp</td><td>Zalo là trục chính, Messenger, điện thoại</td><td>CSKH lấy Zalo OA/ZNS làm kênh gốc</td></tr>
<tr><td>Hành vi mua</td><td>Video ngắn → livestream → chốt qua inbox</td><td>Cần agent hội thoại bán hàng</td></tr>
<tr><td>Thanh toán</td><td>COD còn nặng, nhiều nhà vận chuyển</td><td>Đối soát COD và tỷ lệ hoàn</td></tr>
<tr><td>Niềm tin</td><td>Quan hệ cá nhân, uy tín người bán</td><td>Con người phải xuất hiện thật</td></tr></table></div>
<p>Chiến lược đúng: AI vận hành phía sau, con người có tên và mặt phía trước.</p>
<h3>CRM là nguồn sự thật</h3>
<p><dfn data-k="crm">CRM</dfn> tối thiểu gồm bảy thực thể: Person, Account, Interaction, Opportunity, Transaction, <dfn data-k="consent">Consent</dfn>, Health Score. Trường Consent phải được kiểm tra trước mọi hành động tiếp cận tự động.</p>
<h3>Vòng đời và ranh giới</h3>
<p>Lead mới được phản hồi trong 5 phút (L3). Nhưng hai khoảnh khắc phải có người: khách có dấu hiệu rời bỏ (leo thang cho người) và khách VIP (người trực tiếp chăm sóc). Tự động hóa việc giữ chân một khách đang thất vọng là cách nhanh nhất để mất họ.</p>
<h3>Bốn chỉ số marketing tối thiểu</h3>
<p>CAC (chi phí có một khách), ROAS (doanh thu trên chi phí quảng cáo), LTV (giá trị vòng đời khách), tỷ lệ giữ chân. Dữ liệu sạch khi: trùng dưới 2%, thiếu trường bắt buộc dưới 5%, liên hệ không hợp lệ dưới 3%, độ trễ đồng bộ dưới 15 phút.</p>`,
 ex:{t:'Lam Beauty chăm khách sau mua', h:`<ul><li>Khách mới mua lần đầu → AI gửi hướng dẫn dùng qua Zalo ZNS, sau khi kiểm trường Consent (L3).</li>
<li>Khách 7 ngày chưa mua sau khi hỏi → chuỗi nuôi dưỡng theo sản phẩm đã quan tâm (L3).</li>
<li>Khách để lại đánh giá 2 sao kèm chữ "dị ứng" → <b>chuyển người</b>, không trả lời tự động. Đây vừa là khách thất vọng, vừa chạm ranh giới sản phẩm sức khỏe/mỹ phẩm.</li></ul>`},
 help:{read:'Đối chiếu bảng bốn điểm Việt Nam với kênh hiện có của doanh nghiệp mình.',mistakes:['Gửi tin quảng cáo khi chưa lưu bằng chứng đồng ý.','Để chatbot xử lý khách đang khiếu nại nặng.'],rel:['ai5','lt4-3','ai7']},
 q:[
  ['Kênh nào là trục chính chăm sóc khách hàng ở Việt Nam theo đề án?',['Email','SMS','Zalo','Điện thoại bàn'],2,'Agent CSKH phải lấy Zalo OA/ZNS làm kênh gốc, email là phụ.',''],
  ['Trường nào phải kiểm tra trước mọi tiếp cận tự động?',['Health Score','Opportunity','Consent','Account'],2,'Consent là yêu cầu pháp lý về dữ liệu cá nhân và điều kiện để không bị chặn trên Zalo/Facebook.',''],
  ['Khi khách có dấu hiệu rời bỏ, AI nên làm gì?',['Gửi mã giảm giá tự động','Leo thang cho người','Ngừng liên lạc','Gửi khảo sát'],1,'Kịch bản vòng đời: dấu hiệu rời bỏ → leo thang cho người, không tự động hóa.',''],
  ['Chiến lược hiện diện đúng cho doanh nghiệp vận hành bằng AI ở Việt Nam?',['Ẩn hoàn toàn sau AI','AI vận hành phía sau, con người có tên và mặt phía trước','Chỉ dùng người, không dùng AI','Dùng nhân vật ảo làm đại diện'],1,'Doanh nghiệp vô danh do AI vận hành sẽ chạm trần niềm tin rất sớm.',''],
  ['Ngưỡng chấp nhận của tỷ lệ bản ghi khách hàng trùng là bao nhiêu?',['Dưới 2%','Dưới 10%','Dưới 20%','Không cần đo'],0,'Vòng kiểm tra dữ liệu hằng tuần: trùng dưới 2%.','']
 ]},

{ id:'qt7', t:'Đo lường và quản trị bằng ngoại lệ', min:40,
 goals:['Chọn bộ chỉ số điều hành vừa đủ','Áp dụng nguyên tắc bốn loại thông tin cho mỗi vai','Nhận diện sớm CEO thành nút cổ chai'],
 body:`<p>Với doanh nghiệp 1–3 người, <dfn data-k="ngoaile">quản trị bằng ngoại lệ</dfn> không phải phong cách mà là điều kiện sống còn. Mỗi vai chỉ nhận bốn loại thông tin:</p>
<ol><li>Quyết định cần phê duyệt</li><li>Ngoại lệ vượt quyền hạn</li><li>Rủi ro mới xuất hiện</li><li>Báo cáo hiệu quả và đề xuất chiến lược</li></ol>
<h3>Triệu chứng CEO là nút cổ chai</h3>
<div class="tbl"><table><tr><th>Triệu chứng</th><th>Ngưỡng cảnh báo</th><th>Biện pháp</th></tr>
<tr><td>Hàng chờ phê duyệt</td><td>Trên 10 mục hoặc trên 48 giờ</td><td>Nâng mức tự chủ cho tác vụ rủi ro thấp (tối đa L3)</td></tr>
<tr><td>Tỷ lệ việc bị AI leo thang</td><td>Trên 20%</td><td>Bổ sung chính sách, không bổ sung agent</td></tr>
<tr><td>Thời gian CEO cho việc L0–L2</td><td>Trên 30% quỹ thời gian</td><td>Sai phân bổ vai trò</td></tr>
<tr><td>Số quyết định mỗi ngày</td><td>Trên 20 quyết định thực chất</td><td>Gộp thành lô, đặt lịch cố định</td></tr></table></div>
<h3>Đo ít, đo đúng</h3>
<p>Ở giai đoạn đầu chỉ đo vài con số. Ngưỡng ban đầu là giả thiết đặt ra để có cái mà bác bỏ, không phải mục tiêu cam kết; xem lại sau khi có đủ dữ liệu.</p>`,
 ex:{t:'Bản tin ngoại lệ 7:30 sáng', h:`<p>LATTICE thiết kế cho chính mình một bản tin ngoại lệ mỗi sáng, do AI Chief of Staff soạn từ nhật ký sự kiện. Bản tin không liệt kê việc đã chạy bình thường, chỉ có:</p>
<ul><li>2 hồ sơ chờ duyệt đề xuất (quyết định cần duyệt)</li><li>1 yêu cầu hoàn phí ngoài chính sách (ngoại lệ vượt quyền)</li><li>Hộp thư còn 18 lượt gửi trong ngày (rủi ro mới, dưới ngưỡng 20)</li></ul>`},
 help:{read:'Đếm thử số việc chờ anh chị duyệt hôm nay và so với ngưỡng 10 mục / 48 giờ.',mistakes:['Thêm agent khi tỷ lệ leo thang cao. Đề án khuyên bổ sung chính sách.','Đo hàng chục chỉ số khi chưa có đủ dữ liệu để tách nhiễu.'],rel:['lt3-4','lt3-5','qt4']},
 q:[
  ['Đâu KHÔNG thuộc bốn loại thông tin một vai nhận?',['Quyết định cần phê duyệt','Danh sách mọi việc đã chạy bình thường','Rủi ro mới xuất hiện','Ngoại lệ vượt quyền hạn'],1,'Quản trị bằng ngoại lệ không báo việc chạy bình thường.',''],
  ['Tỷ lệ việc bị AI leo thang vượt 20%. Biện pháp đúng?',['Thêm agent mới','Bổ sung chính sách','Hạ mọi tác vụ về L0','Thuê thêm người'],1,'Đề án: bổ sung chính sách, không bổ sung agent.',''],
  ['Ngưỡng cảnh báo hàng chờ phê duyệt là gì?',['Trên 3 mục','Trên 10 mục hoặc trên 48 giờ','Trên 50 mục','Trên 1 tuần'],1,'Bảng triệu chứng nút cổ chai, đề án mục 4.',''],
  ['CEO dành trên 30% thời gian cho việc L0–L2 nghĩa là gì?',['Bình thường','Sai phân bổ vai trò','CEO chăm chỉ','Cần tăng ngân sách AI'],1,'Đây là dấu hiệu sai phân bổ vai trò.',''],
  ['Ngưỡng chỉ số ban đầu nên được hiểu thế nào?',['Mục tiêu cam kết với khách','Giả thiết để có cái mà bác bỏ, xem lại sau khi đủ dữ liệu','Con số cố định không đổi','Số liệu ngành'],1,'Tài liệu chu trình khách hàng: ngưỡng đợt đầu đặt để có cái mà bác bỏ.','']
 ]},

{ id:'qt8', t:'Rủi ro và chống mong manh', min:35,
 goals:['Nhìn thẳng mặt tối của doanh nghiệp một người','Dựng vành đai người bên ngoài','Chấp nhận kém hiệu quả có chủ đích ở đúng chỗ'],
 body:`<p>Dữ liệu 2026 về solopreneur Mỹ: thu nhập trung vị khoảng 39.000 USD/năm; chỉ 3,6% vượt 1 triệu USD; 68% có dưới 6 tháng tiền dự phòng; 35% báo cáo căng thẳng cao, so với 26% ở chủ doanh nghiệp có nhân viên.</p>
<blockquote>AI loại bỏ con người khỏi khâu thực thi nhưng giữ nguyên, thậm chí làm tăng, sức nặng của quyết định.</blockquote>
<h3>Vành đai người bên ngoài</h3>
<div class="tbl"><table><tr><th>Vai trò ngoài</th><th>Tần suất</th><th>Chức năng</th></tr>
<tr><td>Kế toán/thuế</td><td>Hằng tháng</td><td>Chốt sổ, ký nghĩa vụ thuế; AI chuẩn bị, người chịu trách nhiệm</td></tr>
<tr><td>Luật sư/tư vấn pháp lý</td><td>Theo vụ việc</td><td>Hợp đồng mẫu, rà soát rủi ro</td></tr>
<tr><td>Cố vấn ngành</td><td>Hằng quý</td><td>Phản biện chiến lược, chống "buồng vọng" giữa CEO và AI</td></tr>
<tr><td>Peer group</td><td>Hằng tuần–tháng</td><td>Đối trọng tâm lý, giảm cô lập</td></tr>
<tr><td>Người ủy quyền khẩn cấp</td><td>Có văn bản sẵn</td><td>Xử lý khi người sáng lập mất năng lực</td></tr></table></div>
<h3>Kém hiệu quả có chủ đích</h3>
<p>Doanh nghiệp một người phải chấp nhận kém hiệu quả ở vài chỗ để đổi lấy khả năng chống chịu: dự trữ tiền mặt cao hơn mức tối ưu, đa kênh dù tốn hơn, giữ quan hệ con người dù AI làm được. Sở hữu danh sách khách hàng ngoài nền tảng để không phụ thuộc một tài khoản có thể bị khóa.</p>`,
 ex:{t:'Mộc soát rủi ro', h:`<ul><li><b>Phụ thuộc một kênh:</b> 80% doanh thu từ một sàn → bắt đầu thu email, Zalo khách có đồng ý để sở hữu danh sách riêng.</li>
<li><b>Buồng vọng:</b> chủ xưởng và AI cùng thích ý tưởng mở quán → đặt lịch hằng quý với một cố vấn F&B để phản biện.</li>
<li><b>Mất năng lực:</b> soạn văn bản ủy quyền khẩn cấp và nơi ký gửi mật khẩu.</li></ul>`},
 help:{read:'Điền năm dòng vành đai người bên ngoài bằng tên người thật, nếu còn trống là việc cần làm.',mistakes:['Coi cố vấn là tùy chọn khi đã có AI.','Tối ưu chi phí đến mức không còn dự phòng.'],rel:['qt5','ai3','lt4-1']},
 q:[
  ['Nghịch lý cốt lõi của doanh nghiệp vận hành bằng AI là gì?',['AI làm tăng số nhân viên','AI loại con người khỏi thực thi nhưng giữ nguyên sức nặng của quyết định','AI làm giảm chất lượng','AI đắt hơn con người'],1,'Đề án mục 1.3.',''],
  ['Vai trò ngoài nào chống "buồng vọng" giữa CEO và AI?',['Kế toán','Cố vấn ngành hằng quý','Nhà cung cấp phần mềm','Khách hàng VIP'],1,'Cố vấn ngành phản biện chiến lược hằng quý.',''],
  ['"Kém hiệu quả có chủ đích" nghĩa là gì?',['Làm việc chậm lại','Chấp nhận tốn hơn ở vài chỗ để đổi lấy khả năng chống chịu','Không dùng AI','Bỏ đo lường'],1,'Ví dụ: dự trữ tiền mặt cao hơn tối ưu, đa kênh, giữ quan hệ con người.',''],
  ['Theo dữ liệu đề án, bao nhiêu phần trăm solopreneur Mỹ có dưới 6 tháng tiền dự phòng?',['18%','35%','68%','90%'],2,'68% có dưới 6 tháng tiền dự phòng.',''],
  ['Biện pháp cho rủi ro "tài khoản nền tảng bị khóa"?',['Mở thêm tài khoản cùng sàn','Đa kênh và sở hữu danh sách khách hàng ngoài nền tảng','Ngừng bán online','Tăng quảng cáo'],1,'Bảng rủi ro đề án mục 17.','']
 ]}
]}]},

{ id:'ai', code:'AI', name:'AI ứng dụng trực tiếp', tag:'Chương trình 02',
  who:'Mọi người trong doanh nghiệp sẽ giao việc cho AI hằng ngày',
  intro:'Dùng AI như một đồng nghiệp có kỷ luật: giao việc rõ, kiểm chứng đầu ra, nối vào tri thức chung, giữ dữ liệu và chi phí trong ngưỡng.',
  levels:[{ id:'ai-a', name:'Bảy học phần thực hành', note:'Mỗi học phần có bài làm trên việc thật', modules:[

{ id:'ai1', t:'AI hôm nay làm được gì, hỏng ở đâu', min:30,
 goals:['Phân biệt chatbot và agent có công cụ','Hiểu vì sao phần lớn dự án AI thất bại','Biết AI mạnh và yếu ở loại việc nào'],
 body:`<p>Trong hai năm qua, AI chuyển từ hỏi–đáp sang <dfn data-k="agent">agent</dfn>: lập kế hoạch, gọi API, thực thi và tự kiểm tra. Đề án ghi bảy chuyển dịch, trong đó bốn điều chủ doanh nghiệp cảm nhận rõ nhất:</p>
<ul><li>Từ chatbot sang agent có công cụ.</li><li>Từ tích hợp thủ công sang giao thức chuẩn (<dfn data-k="mcp">MCP</dfn>).</li><li>Từ prompt sang trí nhớ tổ chức.</li><li>Từ demo sang governance: ai thắng là người có eval, log, kill switch.</li></ul>
<h3>Vì sao phần lớn thất bại</h3>
<p>IDC ghi nhận khoảng 88% dự án thí điểm AI không lên được production; Gartner dự báo trên 40% dự án agentic AI bị hủy trước hết 2027. Nguyên nhân gốc theo Forrester: 41% do tiêu chí thành công không rõ, 33% do thiếu quyền truy cập dữ liệu/công cụ, 26% do sai lệch phạm vi đánh giá.</p>
<blockquote>Thất bại là vấn đề thiết kế tổ chức, không phải vấn đề công nghệ.</blockquote>
<h3>Mạnh và yếu</h3>
<p>AI xuất sắc trong nhận diện mẫu hình bên trong dữ liệu, nhưng thất bại trong suy luận về ngữ cảnh phi cấu trúc: sự kiện văn hóa, khủng hoảng ngoài mạng, thay đổi quy định. Một hệ thống từng xếp lịch chạy chiến dịch vào ngày quốc tang vì dữ liệu lưu lượng nói đó là thời điểm tốt.</p>`,
 ex:{t:'Hai cách Mộc thử AI', h:`<p><b>Lần 1:</b> chủ xưởng mở ChatGPT, nhờ "viết bài bán cà phê", dùng vài tuần rồi bỏ vì bài nào cũng na ná. Không có tiêu chí thành công, không có dữ liệu sản phẩm.</p>
<p><b>Lần 2:</b> chọn một việc (mô tả sản phẩm cho 12 loại hạt), đưa bảng thông số và 3 bài mẫu đạt chuẩn, đặt tiêu chí "duyệt không sửa từ 60% trở lên". Sau 30 mẫu, tỷ lệ đạt 70%. Cùng một công cụ, khác là cách tổ chức.</p>`},
 help:{read:'Nhớ ba con số 41/33/26: cả ba nguyên nhân đều là thiết kế, không phải mô hình.',mistakes:['Đổi công cụ khi kết quả kém, thay vì làm rõ tiêu chí và dữ liệu.','Tin AI hiểu bối cảnh văn hóa.'],rel:['ai2','ai3','lt1-2']},
 q:[
  ['Điểm khác cơ bản giữa agent và chatbot?',['Agent trả lời nhanh hơn','Agent có công cụ: lập kế hoạch, gọi API, thực thi, tự kiểm tra','Agent không cần dữ liệu','Agent miễn phí'],1,'Chuyển dịch số 1 trong đề án.',''],
  ['Theo IDC, khoảng bao nhiêu phần trăm pilot AI không lên được production?',['12%','40%','88%','99%'],2,'Khoảng 88%.',''],
  ['Nguyên nhân thất bại lớn nhất theo Forrester?',['Mô hình yếu','Tiêu chí thành công không rõ ràng (41%)','Chi phí quá cao','Thiếu GPU'],1,'41% do tiêu chí không rõ, 33% thiếu quyền truy cập dữ liệu/công cụ, 26% sai lệch phạm vi đánh giá.',''],
  ['AI thường thất bại ở loại suy luận nào?',['Nhận diện mẫu hình trong dữ liệu','Ngữ cảnh phi cấu trúc như sự kiện văn hóa, khủng hoảng','Tính toán số học','Tóm tắt văn bản'],1,'Ví dụ chiến dịch xếp vào ngày quốc tang.',''],
  ['Kết luận chung của đề án về thất bại khi triển khai AI?',['Cần mô hình mạnh hơn','Là vấn đề thiết kế tổ chức, không phải công nghệ','Doanh nghiệp nhỏ không nên dùng AI','Phải tự xây mọi thứ'],1,'Luận điểm trung tâm của LATTICE.','']
 ]},

{ id:'ai2', t:'Giao việc cho AI như giao cho người', min:45,
 goals:['Viết yêu cầu theo khung sáu phần','Sửa yêu cầu thay vì chỉ sửa đầu ra','Biến yêu cầu tốt thành tài sản của doanh nghiệp'],
 body:`<p>Một yêu cầu mơ hồ cho ra đầu ra mơ hồ. LATTICE rút gọn <dfn data-k="wo">Work Object</dfn> thành khung sáu phần dùng được ngay trong ô chat:</p>
<div class="tbl"><table><tr><th>Phần</th><th>Câu hỏi</th><th>Từ trường Work Object</th></tr>
<tr><td>Mục tiêu</td><td>Kết quả trông như thế nào?</td><td>objective</td></tr>
<tr><td>Đầu vào</td><td>Dữ liệu, tài liệu, bối cảnh nào?</td><td>inputs</td></tr>
<tr><td>Ràng buộc</td><td>Giọng, độ dài, điều cấm, ngân sách?</td><td>budget, risk_level</td></tr>
<tr><td>Định dạng</td><td>Bảng, danh sách, JSON, email?</td><td>evidence</td></tr>
<tr><td>Tiêu chí xong</td><td>Đạt khi nào?</td><td>done_criteria</td></tr>
<tr><td>Điểm dừng</td><td>Gặp gì thì dừng hỏi lại?</td><td>approval_state</td></tr></table></div>
<h3>Ví dụ mẫu thắng lời giải thích</h3>
<p>Kèm 2–3 mẫu đạt chuẩn và 1 mẫu không đạt kèm lý do. AI bắt chước mẫu tốt hơn là làm theo mô tả.</p>
<h3>Sửa yêu cầu, không chỉ sửa đầu ra</h3>
<p>Khi đầu ra sai, hỏi: thiếu đầu vào, thiếu ràng buộc hay thiếu tiêu chí? Sửa ở yêu cầu thì lần sau đúng; sửa ở đầu ra thì lần sau sai lại.</p>
<blockquote>Quy trình, prompt và cấu hình agent đã tinh chỉnh qua hàng nghìn lần chạy là bí mật kinh doanh, tài sản thật của doanh nghiệp AI-native.</blockquote>`,
 ex:{t:'Trước và sau', h:`<p><b>Trước:</b> "Viết mô tả cho cà phê Arabica Cầu Đất."</p>
<p><b>Sau:</b> "Mục tiêu: mô tả 120–150 chữ cho trang sản phẩm Shopee, giúp người mới chọn đúng vị. Đầu vào: bảng thông số đính kèm (độ cao, sơ chế, mức rang, nốt hương) và 2 mô tả mẫu. Ràng buộc: không nói công dụng sức khỏe, không so sánh thương hiệu khác, xưng 'bạn'. Định dạng: 1 câu mở, 3 gạch đầu dòng, 1 câu gợi ý cách pha. Xong khi: mọi thông số trong bài khớp bảng. Nếu bảng thiếu nốt hương, hỏi lại, không tự đặt."</p>`},
 help:{read:'Lấy một yêu cầu anh chị đã gửi AI tuần này, viết lại theo sáu phần và so kết quả.',mistakes:['Bỏ phần "điểm dừng", nên AI tự bịa khi thiếu dữ liệu.','Không lưu yêu cầu tốt, mỗi lần viết lại từ đầu.'],rel:['lt3-1','ai3','qt3']},
 q:[
  ['Phần nào giúp AI không tự bịa khi thiếu dữ liệu?',['Mục tiêu','Định dạng','Điểm dừng: gặp gì thì dừng hỏi lại','Ràng buộc độ dài'],2,'Điểm dừng tương ứng tiêu chí chuyển việc cho người.',''],
  ['Đầu ra sai lặp lại. Nên sửa ở đâu?',['Sửa tay từng đầu ra','Sửa yêu cầu: thiếu đầu vào, ràng buộc hay tiêu chí','Đổi công cụ AI','Bỏ việc đó'],1,'Sửa ở yêu cầu thì lần sau đúng.',''],
  ['Vì sao nên kèm mẫu đạt chuẩn?',['Để yêu cầu dài hơn','AI bắt chước mẫu tốt hơn làm theo mô tả','Để giảm chi phí','Bắt buộc về pháp lý'],1,'Mẫu cụ thể truyền đạt chuẩn rõ hơn lời giải thích.',''],
  ['"Tiêu chí xong" tương ứng trường nào của Work Object?',['owner','deadline','done_criteria','trace_id'],2,'done_criteria là điều kiện đóng việc.',''],
  ['Theo đề án, tài sản trí tuệ giá trị nhất của doanh nghiệp AI-native thường là gì?',['Logo','Hệ thống vận hành: quy trình, prompt, cấu hình quyền, bộ eval, knowledge base','Phần cứng','Danh sách nhân viên'],1,'Đề án mục 13.3.','']
 ]},

{ id:'ai3', t:'Kiểm chứng đầu ra AI', min:40,
 goals:['Thiết lập thói quen bắt AI trích nguồn','Phân biệt số của khách và số ngành','Biết vùng nào tuyệt đối không để AI tự phát ngôn'],
 body:`<p>Rủi ro "agent sai nhưng nghe hợp lý" được đề án xếp mức cao: sai sót phát hiện muộn. Ba biện pháp: eval suite, kiểm tra mẫu ngẫu nhiên, bắt buộc trích nguồn.</p>
<h3>Luật định giá của LATTICE</h3>
<p>Một con số chỉ được nêu khi dẫn được về nguồn cụ thể. Trong đề xuất cho khách, điểm đau chỉ gắn con số tiền khi con số đó dẫn được về câu trả lời của chính khách, và công thức phải hiện ra.</p>
<ul><li><b>Đúng:</b> "Theo A2, việc nhập đơn làm 80 lần/tuần, mỗi lần 20 phút, khoảng 27 giờ/tháng."</li>
<li><b>Sai:</b> "Doanh nghiệp như anh chị thường mất 3–8 triệu/tháng vì việc này."</li></ul>
<p>Số ngành được phép xuất hiện, nhưng ở dòng riêng, có nguồn, và ghi rõ "để đối chiếu".</p>
<h3>Vùng không để AI tự phát ngôn</h3>
<ul><li>Công dụng sản phẩm sức khỏe, mỹ phẩm, thực phẩm chức năng: vùng rủi ro xử phạt cao nhất.</li>
<li>Nội dung liên quan tài chính, pháp lý chưa kiểm tra sự thật.</li>
<li>Lịch đăng: phải kiểm lịch nhạy cảm văn hóa (Tết, giỗ Tổ, quốc tang, dịp tôn giáo, sự kiện chính trị) như một nguồn dữ liệu bắt buộc.</li></ul>`,
 ex:{t:'Kiểm một bài AI viết cho Lam Beauty', h:`<p>Bài nháp: "Serum giúp mờ thâm sau 7 ngày, được 90% khách hài lòng."</p>
<ul><li>"Mờ thâm sau 7 ngày" là công bố công dụng mỹ phẩm → gạch, thay bằng mô tả thành phần đã công bố.</li>
<li>"90% khách hài lòng" không có nguồn → gạch. Không công bố con số về khách khi không có dữ liệu.</li>
<li>Ngày đăng rơi vào ngày nhạy cảm trong lịch → dời.</li></ul>`},
 help:{read:'Mỗi con số trong đầu ra AI: hỏi "nguồn ở đâu?". Không trả lời được thì bỏ.',mistakes:['Để AI tự viết công dụng sản phẩm sức khỏe.','Trộn số ngành vào như số của khách.'],rel:['ai4','lt2-5','lt4-4']},
 q:[
  ['Ba biện pháp với rủi ro "agent sai nhưng nghe hợp lý"?',['Đổi mô hình, tăng ngân sách, thuê người','Eval suite, kiểm tra mẫu ngẫu nhiên, bắt buộc trích nguồn','Tắt AI, làm tay, báo cáo','Thêm agent kiểm tra agent'],1,'Bảng rủi ro đề án mục 17.',''],
  ['Câu nào đúng luật định giá của LATTICE?',['"Doanh nghiệp như anh chị thường mất 3–8 triệu/tháng"','"Theo A2, việc nhập đơn 80 lần/tuần × 20 phút ≈ 27 giờ/tháng"','"Chắc chắn tiết kiệm 50%"','"Theo kinh nghiệm của chúng tôi"'],1,'Con số phải dẫn về câu trả lời của chính khách, công thức hiện ra.',''],
  ['Số liệu ngành được dùng thế nào?',['Thay cho số của khách','Ở dòng riêng, có nguồn, ghi "để đối chiếu"','Không bao giờ dùng','Làm tiêu đề'],1,'Luật định giá, tài liệu chu trình khách hàng mục 9.',''],
  ['Vùng nào có rủi ro xử phạt cao nhất nếu để AI tự phát ngôn?',['Mô tả màu sắc sản phẩm','Công dụng sản phẩm sức khỏe/mỹ phẩm/TPCN','Giờ mở cửa','Hướng dẫn đổi trả'],1,'Ranh giới bổ sung số 2 tại Việt Nam.',''],
  ['Lịch nhạy cảm văn hóa nên được xử lý thế nào?',['Để người trực nhớ','Là nguồn dữ liệu bắt buộc mọi agent lên lịch phải kiểm tra','Bỏ qua','Chỉ kiểm dịp Tết'],1,'Lịch chặn phải là dữ liệu trong hệ thống, không phải trí nhớ của người trực.','']
 ]},

{ id:'ai4', t:'Tri thức và trí nhớ chung', min:40,
 goals:['Hiểu vì sao năm chatbot rời rạc chạm trần','Dựng knowledge base có trích dẫn','Giữ một định nghĩa cho một khái niệm'],
 body:`<blockquote>Trí nhớ chung là lõi, không phải phụ kiện. Năm chatbot rời rạc chạm trần rất nhanh vì mỗi phiên bắt đầu từ số không. Năm agent nối vào một knowledge base chung thì cộng dồn giá trị.</blockquote>
<h3>Knowledge base tối thiểu</h3>
<p><dfn data-k="kb">Knowledge base</dfn> chứa chính sách, sản phẩm, câu hỏi thường gặp, có nguồn sự thật duy nhất cho mỗi loại dữ liệu. Điều kiện để rời giai đoạn "AI hỗ trợ": knowledge base phủ từ 80% câu hỏi lặp lại.</p>
<h3>Cách LatticeTalk giữ kho tri thức đúng</h3>
<ul><li>Dòng nào có chữ số phải có một dòng trích nguyên văn từ trang thật ngay dưới.</li>
<li>Mọi con số trong dòng phải có trong trích dẫn của dòng đó.</li>
<li>Có danh sách "câu đã bỏ" (chính sách cũ); kho chứa câu cũ thì không sinh được tri thức cho bot.</li></ul>
<p>Một câu sai trong kho tri thức được nói lại với mọi khách, không chỉ một lần. Vì thế cặp hỏi đáp mới nạp vào kho được duyệt từng cặp, ở mức L1.</p>
<h3>Một khái niệm, một định nghĩa</h3>
<p>Diễn đạt lại một khái niệm ở nhiều nơi làm loãng tín hiệu và làm doanh nghiệp tự mâu thuẫn. Viết định nghĩa gốc ở một nơi, nơi khác trích dẫn.</p>`,
 ex:{t:'Khi hai tài liệu nói hai giá', h:`<p>Tháng 9/2026, bộ slide của LATTICE ghi "buổi chẩn đoán 60 phút miễn phí", còn website ghi gói có phí. Khách đọc slide rồi vào website sẽ thấy mình bị đổi điều kiện.</p>
<p>Cách xử lý (quyết định D-C01): chọn một nguồn gốc cho gói, giá, chính sách phí; sửa mọi tài liệu theo; đưa các câu cũ vào danh sách câu đã bỏ để chatbot không bao giờ nói lại.</p>`},
 help:{read:'Liệt kê 20 câu khách hỏi nhiều nhất. Đó là khung đầu tiên của knowledge base.',mistakes:['Mỗi người lưu tri thức trong chat riêng.','Nạp nội dung chưa duyệt vào kho chatbot.'],rel:['lt3-2','ai3','lt4-2']},
 q:[
  ['Vì sao năm chatbot rời rạc chạm trần nhanh?',['Vì quá đắt','Vì mỗi phiên bắt đầu từ số không, không có trí nhớ chung','Vì trả lời chậm','Vì không có giao diện'],1,'Nguyên tắc bổ sung trong đề án.',''],
  ['Điều kiện để rời giai đoạn "AI hỗ trợ" về tri thức?',['Có 5 agent','Knowledge base phủ từ 80% câu hỏi lặp lại','Có website','Có 100 khách'],1,'Lộ trình triển khai, đề án mục 18.',''],
  ['Trong kho tri thức LatticeTalk, dòng có chữ số cần gì?',['In đậm','Một dòng trích nguyên văn từ trang thật ngay dưới','Duyệt bởi AI','Không cần gì'],1,'Luật kho tri thức: số phải có trích dẫn nguyên văn.',''],
  ['Vì sao cặp hỏi đáp mới nạp vào kho chatbot được duyệt từng cặp?',['Để chậm lại','Vì một câu sai được nói lại với mọi khách','Vì luật yêu cầu','Vì chatbot không đọc được'],1,'Nhánh 7 của chu trình nội dung ở mức L1, duyệt từng cặp.',''],
  ['"Danh sách câu đã bỏ" dùng để làm gì?',['Lưu câu hay','Chặn chính sách cũ xuất hiện lại trong tài liệu và chatbot','Thống kê','Dịch thuật'],1,'Ví dụ ba câu chính sách cũ trong cau-cu.json.','']
 ]},

{ id:'ai5', t:'AI trong nội dung và marketing', min:45,
 goals:['Vận hành quy trình một gốc, nhiều nhánh','Viết nội dung để được AI trích dẫn','Giữ ba lằn ranh trên mạng xã hội'],
 body:`<h3>Một gốc, nhiều nhánh</h3>
<div class="tbl"><table><tr><th>Bước</th><th>Ai làm</th><th>Mức</th></tr>
<tr><td>1. Người sáng lập tạo 1 nội dung gốc/tuần</td><td>Người</td><td>—</td></tr>
<tr><td>2. Bóc tách thành 8–15 mảnh</td><td>Content Agent</td><td>L2</td></tr>
<tr><td>3. Chuyển thể theo kênh</td><td>Localization Agent</td><td>L2</td></tr>
<tr><td>4. Kiểm duyệt pháp lý, thương hiệu, sự thật</td><td>Risk Agent + người</td><td>Chặn cứng</td></tr>
<tr><td>5. Đăng theo lịch</td><td>Distribution Agent</td><td>L3</td></tr>
<tr><td>6. Trả lời bình luận theo kịch bản</td><td>Community Agent</td><td>L3</td></tr>
<tr><td>7. Phân tích, đề xuất chủ đề tiếp</td><td>Analytics Agent</td><td>L1</td></tr></table></div>
<p>Vòng này giữ con người ở đúng chỗ không thay được: nguồn gốc của góc nhìn.</p>
<h3><dfn data-k="geo">GEO/AEO</dfn>: năm quy tắc để được trích dẫn</h3>
<ol><li>Mỗi đoạn đứng độc lập.</li><li>Mỗi con số đi kèm nguồn và mốc thời gian ngay trong câu.</li><li>Đặt câu hỏi làm tiêu đề, bằng chữ khách dùng.</li><li>Nói cả điều bất lợi.</li><li>Một định nghĩa cho một khái niệm, lặp nguyên văn.</li></ol>
<h3>Ba lằn ranh</h3>
<ul><li>Không để agent tự phát ngôn khi khủng hoảng: bật <dfn data-k="im">chế độ im lặng</dfn>.</li><li>Không tự động hóa 100% phần "mặt người".</li><li>Không đăng nội dung chưa kiểm tra sự thật với sản phẩm sức khỏe, tài chính, pháp lý.</li></ul>`,
 ex:{t:'Một tuần nội dung của Mộc', h:`<p><b>Gốc:</b> video 12 phút chủ xưởng giải thích "vì sao cà phê rang mộc đắng ít hơn bạn nghĩ".</p>
<ul><li>4 clip ngắn TikTok, 1 carousel Instagram, 1 bài blog trả lời đúng câu hỏi "cà phê rang mộc có đắng không" (tiêu đề là câu hỏi), 1 email cho học viên cũ, 6 cặp hỏi đáp nạp chatbot (duyệt từng cặp).</li>
<li>Bình luận chê có từ "đau dạ dày" → chuyển người, không trả lời tự động.</li></ul>`},
 help:{read:'Chọn một nội dung đã có làm gốc, liệt kê 8 nhánh có thể sinh ra.',mistakes:['Để AI tạo cả nội dung gốc, mất góc nhìn riêng.','Viết bài dài phủ từ khóa thay vì đoạn trả lời được.'],rel:['qt6','lt4-3','ai3']},
 q:[
  ['Trong quy trình một gốc nhiều nhánh, ai tạo nội dung gốc?',['Content Agent','Người sáng lập','Analytics Agent','Khách hàng'],1,'Con người giữ nguồn gốc của góc nhìn.',''],
  ['Bước kiểm duyệt pháp lý, thương hiệu, sự thật có cơ chế gì?',['L3 tự động','Chặn cứng, có người','Bỏ qua khi gấp','L5'],1,'Bước 4: Risk Agent + người, chặn cứng.',''],
  ['Quy tắc GEO/AEO nào đúng?',['Đoạn văn phụ thuộc nhau','Con số đi kèm nguồn và mốc thời gian ngay trong câu','Chỉ khen sản phẩm','Diễn đạt khác nhau ở mỗi trang'],1,'Mô hình trích cả câu, không trích chân trang.',''],
  ['Khi phát hiện sentiment tiêu cực tăng đột biến, làm gì?',['Đăng nhiều bài hơn','Bật chế độ "chỉ nghe, không nói"','Xóa bình luận','Để agent trả lời hết'],1,'Lằn ranh số 1 trên mạng xã hội.',''],
  ['GEO/AEO đo thành công bằng gì?',['Số backlink','Tỷ lệ được nhắc và độ chính xác khi được AI nhắc','Số từ khóa','Thời gian trên trang'],1,'Bảng so sánh SEO và GEO/AEO, đề án mục 11.1.','']
 ]},

{ id:'ai6', t:'Kết nối và tự động hóa quy trình', min:40,
 goals:['Hiểu vai trò của MCP và tích hợp','Áp dụng nguyên tắc mua trước, xây sau','Tránh khóa chân dữ liệu'],
 body:`<blockquote>MCP là hệ thần kinh kết nối; agent là nhân sự số; workflow là quy trình; knowledge + memory là trí nhớ; governance là hệ miễn dịch.</blockquote>
<p>Tự động hóa thật bắt đầu khi dữ liệu chảy giữa các hệ thống mà không ai chép tay. Tích hợp thiết yếu cho doanh nghiệp nhỏ: email, CRM, kế toán, Zalo, sàn thương mại điện tử. Mục tiêu độ trễ đồng bộ dưới 15 phút.</p>
<h3>Thắng lợi sớm rẻ nhất</h3>
<p>Điểm đau L07 "chép tay từ chỗ này sang chỗ kia" (cùng một con số gõ lại ở nhiều phần mềm) thường là thắng lợi sớm rẻ nhất: giờ/tuần × 52 × đơn giá giờ.</p>
<h3><dfn data-k="muaxay">Mua trước, xây sau</dfn></h3>
<p>Pilot do đối tác dẫn dắt đạt production với tỷ lệ khoảng gấp đôi so với tự xây nội bộ. Chỉ tự xây ở chỗ tạo khác biệt (thường là dữ liệu và tri thức riêng). LATTICE tự áp: bảng tính có công thức chạy 14 luật chẩn đoán trước, chưa viết phần mềm cho đến khi có 15 hồ sơ để hiệu chỉnh luật.</p>
<h3>Đừng bị khóa chân</h3>
<p>Nếu không lấy được dữ liệu ra khỏi phần mềm đang dùng (điểm đau L10), mọi kiến trúc phía sau phải vòng qua rào này. Quy trình đó không vào danh sách ưu tiên; việc thay công cụ vào trước.</p>`,
 ex:{t:'Mộc nối ba hệ thống', h:`<p>Đơn Shopee, TikTok, website trước đây được chép tay vào Google Sheet mỗi tối, khoảng 6 giờ/tuần.</p>
<ul><li>Dùng công cụ gom đơn đa kênh có sẵn (mua), đẩy về một Sheet chung.</li>
<li>6 giờ × 52 tuần = 312 giờ/năm lấy lại.</li>
<li>Kiểm trước: phần mềm bán hàng xuất được dữ liệu ra tệp. Nếu không, đổi phần mềm trước.</li></ul>`},
 help:{read:'Vẽ sơ đồ: dữ liệu khách, đơn, tiền đang nằm ở những phần mềm nào và chảy tay ở đâu.',mistakes:['Tự xây thứ đã có sẵn trên thị trường.','Chọn phần mềm không xuất được dữ liệu.'],rel:['lt4-2','lt2-2','ai7']},
 q:[
  ['Trong ẩn dụ của đề án, MCP là gì?',['Hệ miễn dịch','Hệ thần kinh kết nối','Trí nhớ','Nhân sự số'],1,'MCP là hệ thần kinh kết nối; governance là hệ miễn dịch.',''],
  ['Điểm đau thường là thắng lợi sớm rẻ nhất?',['L07 chép tay giữa các hệ thống','L12 đội chưa từng đổi','L14 đã thử AI và thất vọng','L13 kỳ vọng lệch trần'],0,'Luật L07 ghi rõ: thường là thắng lợi sớm rẻ nhất.',''],
  ['Pilot do đối tác dẫn dắt so với tự xây nội bộ?',['Kém hơn','Đạt production với tỷ lệ khoảng gấp đôi','Bằng nhau','Không có dữ liệu'],1,'Đề án mục 9.',''],
  ['Khi không lấy được dữ liệu ra khỏi công cụ hiện tại (L10)?',['Vẫn tự động hóa quy trình đó trước','Quy trình đó không vào danh sách ba; thay công cụ vào trước','Bỏ qua','Nhập tay mãi'],1,'Luật ghi đè thứ hai trong công thức xếp hạng.',''],
  ['Mục tiêu độ trễ đồng bộ dữ liệu giữa các hệ thống?',['Dưới 15 phút','Dưới 1 ngày','Dưới 1 tuần','Không quan trọng'],0,'Kế hoạch 12 tháng, tháng 4.','']
 ]},

{ id:'ai7', t:'An toàn, dữ liệu và chi phí AI', min:40,
 goals:['Phân tách quyền đọc dữ liệu theo vai trò','Dựng bộ công cụ an toàn tối thiểu','Kiểm soát chi phí bằng trần cứng'],
 body:`<h3>Dữ liệu</h3>
<p>Phân tách quyền đọc theo vai trò: agent marketing không cần thấy số điện thoại đầy đủ, agent tài chính không cần thấy nội dung hội thoại. Dữ liệu khách hàng không phải "sở hữu" mà là "được ủy thác".</p>
<h3>Bộ công cụ an toàn tối thiểu</h3>
<div class="tbl"><table><tr><th>Cơ chế</th><th>Mục đích</th><th>Ngưỡng gợi ý</th></tr>
<tr><td><dfn data-k="kill">Kill switch</dfn></td><td>Dừng mọi hành động ra ngoài trong 1 thao tác</td><td>Luôn sẵn sàng</td></tr>
<tr><td>Trần chi phí</td><td>Chặn chi token và quảng cáo chạy loạn</td><td>Ngày / tuần / tháng</td></tr>
<tr><td>Hạn mức giao dịch</td><td>Chặn thanh toán vượt ngưỡng</td><td>Theo khẩu vị rủi ro</td></tr>
<tr><td><dfn data-k="rollback">Rollback</dfn></td><td>Hoàn tác hành động</td><td>Bắt buộc trước khi lên L3</td></tr>
<tr><td><dfn data-k="eval">Eval suite</dfn></td><td>Đo chất lượng agent</td><td>Hằng tuần</td></tr>
<tr><td><dfn data-k="audit">Audit log</dfn></td><td>Truy vết ai/agent nào làm gì</td><td>Tối thiểu 12 tháng</td></tr>
<tr><td>Chế độ im lặng</td><td>Ngừng phát ngôn tự động khi khủng hoảng</td><td>Kích hoạt thủ công</td></tr></table></div>
<h3>Điều cấm thật thì không cấu hình được</h3>
<p>LATTICE Work chặn bốn hành động không hoàn tác được ở tầng dữ liệu: gửi email ra ngoài, tự duyệt việc, xóa dữ liệu, sửa Scope Ledger. Chúng là văn bản cố định, không phải ô tích, "vì nếu là ô tích thì một ngày nào đó sẽ có người tích vào".</p>
<h3>Không phụ thuộc một nhà cung cấp</h3>
<p>Trừu tượng hóa lớp mô hình để đổi nhà cung cấp AI không phải làm lại; giữ tài khoản, dữ liệu, prompt, cấu hình đứng tên doanh nghiệp.</p>`,
 ex:{t:'Một đêm chi phí chạy loạn (tình huống giả định)', h:`<p>Một agent viết mô tả sản phẩm của Lam Beauty gặp lỗi vòng lặp lúc 23 giờ, gọi mô hình liên tục.</p>
<ul><li>Có trần chi phí ngày → dừng ở mức trần, gửi cảnh báo. Thiệt hại bị chặn.</li>
<li>Không có trần → sáng hôm sau mới thấy hóa đơn.</li></ul>
<p>Đây là lý do kho tri thức LATTICE nói: quan trọng hơn con số 2–8% là phải có trần chi phí cứng theo ngày ngay từ đầu.</p>`},
 help:{read:'Đánh dấu cơ chế nào trong bảng doanh nghiệp đang có, cơ chế nào chưa.',mistakes:['Cho mọi agent đọc toàn bộ dữ liệu khách.','Để nút cấm dưới dạng một cài đặt bật/tắt.'],rel:['lt3-3','ai6','qt5']},
 q:[
  ['Agent marketing có cần thấy số điện thoại đầy đủ của khách?',['Có, để gửi tin','Không; quyền đọc phân tách theo vai trò','Tùy ngày','Chỉ khi khách VIP'],1,'Nguyên tắc phân tách quyền đọc.',''],
  ['Audit log lưu tối thiểu bao lâu?',['1 tháng','3 tháng','12 tháng','Không cần lưu'],2,'Tối thiểu 12 tháng.',''],

  ['Biện pháp với rủi ro phụ thuộc một nhà cung cấp AI?',['Ký hợp đồng dài hạn','Trừu tượng hóa lớp mô hình, giữ dữ liệu ở chỗ mình','Dùng nhiều tài khoản','Không dùng AI'],1,'Bảng rủi ro đề án mục 17.','']
 ]}
