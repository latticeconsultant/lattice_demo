EXTRA['qt1'] = {
  warm: 'Nếu mai anh chị nghỉ một tháng, thứ gì trong doanh nghiệp sẽ mất giá trị nhanh nhất: tiền, khách quen, công thức làm hàng, hay uy tín?',
  viz: '<div class="v-layers"><div><b>Chuỗi tạo giá trị</b><span>Kinh doanh, vận hành, sản xuất, dịch vụ khách hàng: nơi tạo ra doanh thu</span></div><div><b>Năng lực hỗ trợ</b><span>Kế toán, nhân sự, pháp chế, hành chính: phục vụ chuỗi tạo giá trị</span></div><div><b>Nguồn lực cốt lõi</b><span>Vốn & Tài sản · Tri thức & Công nghệ · Con người & Văn hóa · Thương hiệu & Uy tín · Thị trường & Quan hệ</span></div></div><p class="v-cap">Chuỗi huy động nguồn lực; kết quả của chuỗi phải bồi đắp lại nguồn lực.</p><div class="v-flow"><div><b>Kinh doanh</b><span>nhận đơn</span></div><div><b>Kho</b><span>soạn hàng</span></div><div><b>Giao nhận</b><span>giao tới khách</span></div><div><b>Kế toán</b><span>thu tiền</span></div></div><p class="v-cap">Quy trình "Từ đơn hàng đến thu tiền" đi qua bốn bộ phận nhưng cần một người chịu trách nhiệm toàn tuyến.</p>',
  key: ['Doanh nghiệp có ba lớp khác bản chất: chuỗi tạo giá trị, năng lực hỗ trợ, nguồn lực cốt lõi.','Nguồn lực cốt lõi mất nhanh, xây chậm; doanh thu tăng mà nguồn lực hao hụt là tăng trưởng giả.','Đơn vị tổ chức là quy trình có đầu vào, đầu ra, người chịu trách nhiệm và chỉ tiêu, không chỉ là phòng ban.'],
  cards: [['Năm nguồn lực cốt lõi là gì?','Vốn & Tài sản; Tri thức & Công nghệ; Con người & Văn hóa; Thương hiệu & Uy tín; Thị trường & Quan hệ.'],['Kế toán thuộc lớp nào?','Năng lực hỗ trợ: phục vụ chuỗi tạo giá trị, không trực tiếp tạo doanh thu.'],['Đặc tính của nguồn lực cốt lõi?','Mất nhanh, xây chậm.'],['Quy trình xuyên nhiều bộ phận cần gì?','Một người chịu trách nhiệm hiệu quả của toàn quy trình.']],
  case: { t:'Tháng bán chạy của Lam Beauty', s:'Tháng 11 (giả định), Lam Beauty chạy khuyến mãi lớn, doanh thu tăng gấp đôi. Kho không kịp soạn, hơn một trăm đơn giao trễ, điểm đánh giá trên sàn tụt từ 4,8 xuống 4,4. Bộ phận kinh doanh báo cáo vượt chỉ tiêu, kho báo cáo đã làm hết công suất.', ask:'Tháng này doanh nghiệp đã mạnh lên hay yếu đi? Vấn đề nằm ở đâu?', a:'Yếu đi ở nguồn lực Thương hiệu & Uy tín, dù doanh thu tăng. Chuỗi tạo giá trị đã tiêu hao nguồn lực thay vì bồi đắp lại. Mỗi bộ phận làm đúng phần mình, nhưng không ai sở hữu quy trình "Từ đơn hàng đến thu tiền" để cân công suất kho với lượng đơn bán ra. Việc cần làm là giao một người chịu trách nhiệm toàn tuyến và đặt chỉ tiêu theo kết quả cuối (đơn giao đúng hẹn), không theo từng bộ phận.' },
  task: { t:'Bản đồ ba lớp của doanh nghiệp tôi', steps:['Liệt kê các khối tạo doanh thu, các bộ phận hỗ trợ và năm nguồn lực của doanh nghiệp.','Với mỗi nguồn lực, ghi một bằng chứng cụ thể đang có (ví dụ điểm đánh giá, danh sách khách cũ, số tháng tiền mặt).','Chọn một quy trình xuyên nhiều bộ phận và ghi tên người chịu trách nhiệm toàn tuyến (hoặc ghi "chưa có").'], out:'Một trang A4 hoặc một bảng gồm ba lớp, năm nguồn lực có bằng chứng, một quy trình xuyên suốt có người sở hữu.', rubric:[['Phân lớp đúng','Không xếp nhầm bộ phận hỗ trợ vào chuỗi tạo giá trị.'],['Nguồn lực có bằng chứng','Cả năm nguồn lực đều có một bằng chứng cụ thể, không chỉ tên gọi.'],['Quy trình có chủ','Quy trình xuyên suốt nêu rõ đầu vào, đầu ra, người chịu trách nhiệm và chỉ tiêu.']] },
  notes: [
    ['Sai. Kế toán và nhân sự là năng lực hỗ trợ: quan trọng nhưng phục vụ chuỗi tạo giá trị, không phải thứ doanh nghiệp "sở hữu và mất nhanh".','Sai. Kinh doanh và vận hành là các khối của chuỗi tạo giá trị: chúng huy động nguồn lực chứ không phải nguồn lực.','Đúng. Thương hiệu & Uy tín là một trong năm nguồn lực cốt lõi: thứ doanh nghiệp sở hữu, mất nhanh, xây chậm.','Sai. Website là công cụ, một tài sản kỹ thuật dễ thay; nhầm công cụ với nguồn lực là lỗi hay gặp.'],
    ['Sai. Thứ dễ thuê ngoài thường là năng lực hỗ trợ (kế toán dịch vụ); nguồn lực cốt lõi thì không mua ngoài được nhanh.','Đúng. Định nghĩa trong đề án mục 14: nguồn lực cốt lõi là thứ doanh nghiệp sở hữu, mất nhanh, xây chậm.','Sai. Uy tín, tri thức, quan hệ khách hàng không nằm trên bảng cân đối kế toán nhưng vẫn là nguồn lực cốt lõi.','Sai. Doanh nghiệp một người cũng có năm nguồn lực: tiền, công thức, khách quen, uy tín, chính người chủ.'],
    ['Sai. Kế toán không trực tiếp tạo doanh thu; xếp nó vào chuỗi tạo giá trị vì "quan trọng" là nhầm giữa quan trọng và tạo doanh thu.','Đúng. Kế toán phục vụ chuỗi tạo giá trị, nên thuộc lớp năng lực hỗ trợ cùng nhân sự, pháp chế, hành chính.','Sai. Kế toán là một hoạt động; nguồn lực là thứ được sở hữu như vốn hay uy tín.','Sai. Mọi bộ phận đều thuộc một trong ba lớp; kế toán có chỗ rõ ràng ở lớp hỗ trợ.'],
    ['Sai. Mỗi bộ phận tự đặt chỉ tiêu dẫn tới tình trạng ai cũng đạt mà khách vẫn nhận hàng trễ.','Đúng. Quy trình xuyên suốt cần một người sở hữu kết quả toàn tuyến, dù nhiều bộ phận cùng làm.','Sai. Không cần gộp bộ phận; chỉ cần một người chịu trách nhiệm hiệu quả của cả quy trình.','Sai. AI không chịu trách nhiệm được; trách nhiệm quy trình luôn thuộc về một người.'],
    ['Sai. Chuỗi tiêu nguồn lực mà không hoàn lại là chuỗi tự bào mòn, như tháng bán nhiều nhưng mất uy tín vì giao trễ.','Đúng. Đề án mục 14: chuỗi tạo giá trị huy động nguồn lực, và kết quả của nó phải bồi đắp lại nguồn lực.','Sai. Nguồn lực được chuỗi tạo giá trị huy động trực tiếp, không chỉ dành cho bộ phận hỗ trợ.','Sai. Hai lớp gắn chặt với nhau: chuỗi dùng nguồn lực và phải nuôi lại nguồn lực.']
  ]
};

EXTRA['qt2'] = {
  warm: 'Anh chị đang bán hàng hóa, bán giờ công, hay bán thứ mình tự làm ra? Câu trả lời thật quyết định cả bộ máy phía sau.',
  viz: '<div class="v-cards"><div><i>01</i><b>Thương mại & Hàng hóa</b><span>Mua về bán lại, có tồn kho. Nghẽn: vốn lưu động.</span></div><div><i>02</i><b>Dịch vụ</b><span>Bán giờ công, chỗ phục vụ, chuyên môn. Nghẽn: giờ công người có chuyên môn.</span></div><div><i>03</i><b>Sản xuất</b><span>Làm ra hàng rồi xuất kho. Nghẽn: tài sản vật lý, lao động trực tiếp.</span></div></div><div class="v-flow"><div><b>01/01/2026</b><span>Hộ kinh doanh tự kê khai, ngưỡng miễn thuế 1 tỷ/năm</span></div><div><b>Từ 1 tỷ/năm</b><span>Hóa đơn điện tử từ máy tính tiền (NĐ 70/2025)</span></div><div><b>01/7/2026</b><span>Luật TMĐT: xác minh người bán, người livestream</span></div></div><p class="v-cap">Kiểm tra lại hiệu lực văn bản trước khi trích dẫn chính thức.</p>',
  key: ['Ba kiến trúc tham chiếu xác định theo bản chất thứ được bán; làm nhiều mảng thì lấy mảng nhiều doanh thu nhất làm kiến trúc chính.','Hộ kinh doanh không cần chuyển lên công ty trước, nhưng nên vận hành sổ sách như doanh nghiệp từ đầu.','Ba tín hiệu nên chuyển: khách đòi VAT, hợp đồng rủi ro pháp lý đáng kể, ký kết dài hạn với đối tác lớn.'],
  cards: [['Spa thuộc kiến trúc nào?','Dịch vụ: bán giờ công và chỗ phục vụ.'],['Ba tín hiệu nên chuyển lên công ty?','Khách đòi VAT; hợp đồng rủi ro pháp lý đáng kể; ký kết dài hạn với đối tác lớn.'],['Ngưỡng miễn thuế hộ kinh doanh từ 2026?','1 tỷ đồng/năm (NĐ 68/2026, sửa đổi bởi NĐ 141/2026).'],['Làm cả hai mảng thì chọn kiến trúc chính thế nào?','Chọn mảng tạo nhiều doanh thu nhất.']],
  case: { t:'Xưởng cà phê Mộc xếp mình vào đâu', s:'Mộc tự rang hạt, mở workshop pha chế và bán túi cà phê, dụng cụ trên sàn. Chủ xưởng muốn được gọi là "doanh nghiệp sản xuất" vì nghe chuyên nghiệp. Doanh thu bán túi cà phê và dụng cụ chiếm phần lớn (giả định).', ask:'Kiến trúc chính của Mộc là gì, và hai mảng còn lại xử lý thế nào?', a:'Kiến trúc chính là Thương mại & Hàng hóa, vì đó là mảng tạo nhiều doanh thu nhất. Chọn theo tên gọi nghe hay là ngộ nhận phổ biến. Rang xay (sản xuất) và workshop (dịch vụ) được xử lý như các lớp riêng, mỗi lớp có trần tự động hóa riêng (học phần U4). Điểm nghẽn cần canh trước là vốn lưu động trong hạt thô và hàng tồn.' },
  task: { t:'Xác định kiến trúc và hồ sơ pháp lý', steps:['Ghi doanh thu ước lượng theo từng mảng và chọn kiến trúc chính.','Kiểm ba tín hiệu chuyển đổi: mỗi tín hiệu ghi Có/Chưa kèm ví dụ thật.','Liệt kê các mốc pháp lý 2026 áp dụng cho mình và việc phải làm (kèm ghi chú cần kiểm hiệu lực).'], out:'Bảng một trang: kiến trúc chính và các lớp phụ, ba tín hiệu, danh sách việc pháp lý.', rubric:[['Kiến trúc đúng','Chọn theo mảng nhiều doanh thu nhất, có số ước lượng.'],['Tín hiệu có căn cứ','Mỗi tín hiệu có ví dụ hoặc lý do cụ thể.'],['Pháp lý thận trọng','Các mốc pháp lý ghi rõ nguồn và lưu ý kiểm tra hiệu lực.']] },
  notes: [
    ['Sai. Spa có thể bán kèm mỹ phẩm, nhưng thứ chính được bán là liệu trình, tức giờ công, không phải hàng mua về bán lại.','Đúng. Spa bán giờ công và chỗ phục vụ, nên thuộc kiến trúc Dịch vụ; điểm nghẽn là giờ công kỹ thuật viên.','Sai. Spa không làm ra hàng rồi xuất kho; chăm sóc da là dịch vụ thực hiện trực tiếp.','Sai. Mọi doanh nghiệp đều xếp được vào một kiến trúc chính; mảng phụ thì tách lớp.'],
    ['Sai. Khách đòi hóa đơn VAT là tín hiệu thứ nhất nên chuyển lên công ty.','Sai. Hợp đồng có rủi ro pháp lý đáng kể là tín hiệu thứ hai.','Đúng. Muốn dùng AI không đòi hỏi chuyển hình thức pháp lý; điều cần là sổ sách và dữ liệu sạch.','Sai. Ký kết dài hạn với đối tác lớn là tín hiệu thứ ba.'],
    ['Sai. Sổ sách chuẩn không làm được miễn thuế; ngưỡng miễn thuế dựa trên doanh thu.','Đúng. Kho tri thức LATTICE: chất lượng dữ liệu tài chính quyết định agent tài chính có làm việc được hay không.','Sai. Không có quy định mọi hộ kinh doanh phải có kế toán trưởng; đây là lý do giả.','Sai. Vay vốn có thể dễ hơn, nhưng đó không phải lập luận LATTICE đưa ra.'],
    ['Sai. Số nhân viên không phản ánh bản chất kinh doanh; mảng nhiều người có thể ít doanh thu.','Đúng. Hướng dẫn Khảo sát nhanh: làm cả hai thì chọn mảng tạo nhiều doanh thu nhất.','Sai. Không có kiến trúc mặc định; chọn Dịch vụ cho mọi trường hợp làm sai danh sách khối nghiệp vụ.','Sai. Mảng mới thường chưa có doanh thu đều; Khảo sát nhanh còn khuyên chọn nhánh khởi sự cho mảng mới hoàn toàn.'],

EXTRA['qt3'] = {

  case: { t:'Lễ tân nghỉ phép ở Spa An Nhiên', s:'Lễ tân duy nhất của spa nghỉ một tuần. Lịch hẹn nằm trong điện thoại của cô ấy; cách xử lý khách xin đổi lịch lần thứ ba, khách đến trễ, khách dùng voucher hết hạn chưa từng được viết ra. Chủ spa phải tự trực, trả lời sai hai trường hợp.', ask:'Điều gì cần viết ra trước, và viết thế nào?', a:'Đây là rủi ro gián đoạn (L05): tri thức nằm trong đầu một người. Trước hết kiểm kê các việc lễ tân làm, chọn việc lặp nhiều nhất (đặt và đổi lịch) để viết SOP năm phần. Phần đáng giá nhất là ngưỡng và ngoại lệ: đổi lịch lần ba, khách trễ, voucher hết hạn, mỗi ca ghi rõ xử lý hay chuyển ai. Đồng thời đưa lịch hẹn từ điện thoại về một nơi lưu chung.' },

    ['Sai. Chỉ có tên việc thì không ước được giá trị tự động hóa hay rủi ro khi người làm vắng.','Đúng. Bộ câu hỏi Nhóm 1 (A1–A3) hỏi đúng bốn thông tin này: tần suất, thời lượng, ai làm, hậu quả nếu nghỉ.','Sai. Chi phí phần mềm thuộc phần công cụ, không phải thông tin kiểm kê một việc lặp lại.','Sai. Ý kiến khách hữu ích ở phần khác, không thay được số đo tần suất và thời lượng.'],

    ['Sai. Doanh thu không phải tiền đang có; doanh thu cao vẫn có thể cạn tiền vì công nợ và tồn kho.','Đúng. Đề án mục 16.2: số ngày tiền mặt = tiền mặt ÷ chi phí ngày.','Sai. Lợi nhuận chia 30 là lợi nhuận bình quân ngày, không đo được doanh nghiệp sống được bao lâu.','Sai. Tồn kho chưa phải tiền; dùng nó là phóng đại khả năng chịu đựng.'],
    ['Sai. 30 ngày quá mỏng: chỉ một tháng gián đoạn là hết tiền.','Sai. 90 ngày vẫn dưới ngưỡng cảnh báo 120 ngày.','Đúng. Trên 180 ngày, vì doanh nghiệp một người có rủi ro một điểm gãy; dưới 120 ngày là cảnh báo.','Sai. 365 ngày không phải ngưỡng đề án đặt; giữ quá nhiều tiền nhàn rỗi không phải yêu cầu.'],
    ['Sai. Tiền trong tài khoản là tiền mặt dùng được ngay, phải tính.','Sai. Tiền mặt tại quỹ cũng dùng được ngay, phải tính.','Đúng. Tiền khách còn nợ chưa thu về được ngay, nên không tính, giống hàng tồn kho.','Sai. Không phải cả ba; công nợ phải thu bị loại khỏi phép tính.'],
    ['Sai. Dưới 1% không phải chuẩn tham chiếu; đặt kỳ vọng quá thấp dễ dẫn tới cắt nhầm việc đáng làm.','Đúng. Kho tri thức LATTICE: 2–8% doanh thu tùy ngành, và quan trọng hơn là trần chi phí cứng theo ngày.','Sai. 10–15% vượt chuẩn tham chiếu, là dấu hiệu chi phí chạy loạn.','Sai. Trên 20% là mức báo động, không phải chuẩn.'],
    ['Sai. Quy độ trễ ra tiền sẽ phải bịa con số; luật định giá chỉ cho phép số dẫn về câu trả lời của khách.','Đúng. Luật L06 nêu độ trễ quyết định ("biết tháng trước lỗ thì tháng này đã lỗ tiếp"), không quy ra tiền.','Sai. Số liệu ngành chỉ dùng để đối chiếu, ở dòng riêng, không dùng để định giá điểm đau.','Sai. L06 là điểm đau được nêu trong đề xuất, chỉ là không gắn số tiền.']
  ]
};

/* ============================================================
   CHỈ MỤC + TIẾN ĐỘ (lưu trên trình duyệt người học)
   ============================================================ */
const EX = window.EXTRA || {};
const MODS = {}, ORDER = [];
PROGRAMS.forEach(p => p.levels.forEach(l => l.modules.forEach(m => { m.p = p; m.l = l; m.x = EX[m.id] || {}; MODS[m.id] = m; ORDER.push(m.id); })));
const KEY = 'lattice-academy-v2';
let S = { m:{}, x:{}, v:{}, t:{}, name:'' };
try {
  const r = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem('lattice-academy-v1') || 'null');
  if (r && typeof r === 'object') S = Object.assign(S, r);
} catch(e) {}
['m','x','v','t'].forEach(k => { if (!S[k] || typeof S[k] !== 'object') S[k] = {}; });
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
const PASS = 0.8;
const st = id => S.m[id] ? (S.m[id].best >= PASS ? 'done' : 'tried') : '';
const progModules = p => p.levels.flatMap(l => l.modules);
const progDone = p => progModules(p).filter(m => st(m.id) === 'done').length;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = s => document.querySelector(s);
const LETTER = 'ABCD';
const totalMin = p => progModules(p).reduce((a,m)=>a+m.min,0);
const hrs = n => (Math.round(n/6)/10).toString().replace('.', ',');
const pct = x => Math.round(x*100);
const STEPS = [['warm','Khởi động'],['learn','Học'],['ex','Ví dụ & tình huống'],['do','Thực hành'],['mem','Ghi nhớ'],['quiz','Kiểm tra']];
function setProg(pid){ document.getElementById('main').setAttribute('data-prog', pid || ''); }

/* Điểm tổng kết chương trình */
function progScore(p){
  const mods = progModules(p);
  const avg = mods.reduce((a,m)=>a+(S.m[m.id]?S.m[m.id].best:0),0)/mods.length;
  const fin = S.x[p.id] ? S.x[p.id].best : 0;
  const total = 0.4*avg + 0.6*fin;
  const eligible = progDone(p) === mods.length && fin >= PASS;
  const rank = !eligible ? 'Chưa đủ điều kiện' : total >= .95 ? 'Xuất sắc' : total >= .88 ? 'Giỏi' : 'Khá';
  return { avg, fin, total, eligible, rank };
}

    p.levels.forEach(l => {
      h += `<div class="nav-l">${p.levels.length>1?`<span class="lbl">${esc(l.name)}</span>`:''}`;
      l.modules.forEach(m => { h += `<a class="nav-m${cur===m.id?' cur':''}" href="#m-${m.id}"><i class="node ${st(m.id)}"></i><span>${esc(m.t)}</span></a>`; });

    h += `<a class="nav-m" href="#x-${p.id}"><i class="node ${S.x[p.id]&&S.x[p.id].best>=PASS?'done':''}" style="border-color:var(--c)"></i><span><b>Bài thi cuối chương trình</b></span></a></div>`;

  $('#side').innerHTML = h;
}

let QS = null, CUR = null;
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function prepQuestions(list){ return list.map(([q,opts,ans,why,hint,src,notes]) => { const order = shuffle(opts.map((_,i)=>i)); return { q, opts: order.map(i=>opts[i]), ans: order.indexOf(ans), why, hint, src, notes: notes ? order.map(i=>notes[i]) : null }; }); }
const withNotes = m => m.q.map((q,i) => [q[0],q[1],q[2],q[3],q[4],null,(m.x.notes||[])[i]||null]);

function motif(m, cur){
  const seen = new Set(S.v[m.id]||[]);

  return `<svg class="motif" width="290" height="70" viewBox="0 0 290 70" aria-hidden="true">

   ${xs.map((x,i)=>`<rect class="nd${seen.has(i)?' on':''}${cur===i?' cur':''}" x="${x-9}" y="${35-9}" width="18" height="18" transform="rotate(45 ${x} 35)"/>`).join('')}
   <circle class="hm" cx="145" cy="12" r="5"/></svg>`;
}

function goStep(si, first){
  if (!CUR) return; CUR.step = si;
  STEPS.forEach((_,k) => { const p = document.getElementById('pn'+k); if (p) p.hidden = k!==si; });
  const seen = new Set(S.v[CUR.id]||[]); seen.add(si); S.v[CUR.id] = [...seen].sort(); save();
  document.querySelectorAll('#steps button').forEach((b,k)=>{ b.classList.toggle('on',k===si); b.classList.toggle('seen', seen.has(k)); b.setAttribute('aria-current', k===si?'step':'false'); });
  const bar = $('#sbar'); if (bar) bar.style.width = ((si+1)/6*100)+'%';
  const mo = $('#motif'); if (mo) mo.innerHTML = motif(MODS[CUR.id], si);
  if (!first){ const st2 = $('#steps'); if (st2) { const y = st2.getBoundingClientRect().top + scrollY - 70; if (scrollY > y) scrollTo({top:y, behavior:'smooth'}); } }
}
function rubSum(){
  const el = $('#rubsum'); if (!el || !CUR) return; const m = MODS[CUR.id]; const tk = m.x.task; if (!tk) return;
  const sel = S.t[CUR.id] || {}; const n = tk.rubric.length; const got = Object.keys(sel).length;
  if (!got) { el.textContent = 'Chọn mức cho từng tiêu chí sau khi làm xong bài tập.'; return; }
  const pts = tk.rubric.map((_,i)=>sel[i]===2?100:sel[i]===1?80:sel[i]===0?40:0); const avg = Math.round(pts.reduce((a,b)=>a+b,0)/n);
  const ok = tk.rubric.every((_,i)=>sel[i]>=1);
  el.innerHTML = `Tự chấm ${got}/${n} tiêu chí · quy đổi <b>${avg}</b> điểm · ${ok?'<span class="cheer">Đạt: mọi tiêu chí từ mức Đạt.</span>':'chưa đạt: còn tiêu chí dưới mức Đạt hoặc chưa chấm.'}`;
}

function anaHTML(it, picked){
  if (!it.notes) return `<div class="qf"><b>${picked===it.ans?'Đúng.':'Chưa đúng. Đáp án: '+LETTER[it.ans]+'.'}</b> ${esc(it.why)}</div>`;

      return `<button class="${c}" role="radio" aria-checked="${oi===picked}" data-q="${qi}" data-o="${oi}" ${QS.done?'disabled':''}><span class="k">${LETTER[oi]}</span><span>${esc(o)}</span></button>`; }).join('')}</div>
      ${QS.done ? anaHTML(it, picked) + `<div class="qtools"><button class="linkbtn" data-ask="${qi}">Hỏi trợ giảng về câu này</button></div>`
      : (QS.kind==='m' && it.hint ? `<div class="qtools"><button class="linkbtn" data-hint="${qi}">Xem gợi ý</button></div><div class="qf hint" id="h${qi}" hidden>${esc(it.hint)}</div>` : '')}</div>`; }).join('');
  const got = items.filter((it,qi)=>QS.pick[qi]===it.ans).length, answered = Object.keys(QS.pick).length;
  if (!QS.done) h += `<div class="actions"><button class="btn" id="submitQ" ${answered<n?'disabled':''}>Nộp bài và chấm điểm</button><span class="note" style="align-self:center">Đã chọn ${answered}/${n}${answered<n?' · chọn đủ để nộp':''}</span></div>`;
  else { const ok = got/n >= PASS, score = QS.kind==='m' ? got*20 : Math.round(got/n*100);
    h = `<div class="result ${ok?'pass':'fail'}" id="res"><div class="sc"><b class="num">${score}</b><span class="lbl">${got}/${n} câu</span>${ok?'<div class="burst"><i></i><i></i><i></i><i></i><i></i></div>':''}</div><div class="ms"><b>${ok?(QS.kind==='x'?'Đạt bài thi cuối.':'Đạt học phần.'):'Chưa đạt lần này.'}</b> ${ok?'Kết quả đã được ghi. Phân tích từng câu ở dưới để anh chị củng cố cả những câu đã đúng.':'Cần từ '+Math.ceil(n*PASS)+'/'+n+' câu. Đọc phân tích các câu sai bên dưới, thử chế độ luyện tập, rồi làm lại; thứ tự phương án sẽ được đảo.'}
      <div class="actions"><button class="btn ghost" id="retryQ">Làm lại</button>${QS.kind==='m'&&ok&&ORDER[ORDER.indexOf(QS.id)+1]?`<a class="btn" href="#m-${ORDER[ORDER.indexOf(QS.id)+1]}">Học phần tiếp theo →</a>`:''}${QS.kind==='x'?`<a class="btn" href="#p-${QS.id}">Về chương trình</a>`:''}</div></div></div>` + h; }
  w.innerHTML = h;
}

document.addEventListener('click', e => {
  const sb = e.target.closest('[data-step]'); if (sb && CUR){ goStep(+sb.dataset.step); return; }
  const md = e.target.closest('[data-mode]'); if (md && CUR){ startQuiz(md.dataset.mode); return; }
  if (e.target.closest('[data-back]')){ QS = null; drawQuizMenu(); return; }
  const o = e.target.closest('.opt[data-q]');
  if (o && QS && !QS.done){ QS.pick[+o.dataset.q] = +o.dataset.o; const y = scrollY; drawQuiz(); scrollTo(0,y); return; }
  if (e.target.closest('[data-next]') && QS){ QS.idx++; drawQuiz(); const q = $('#quizbox')||$('#quiz'); if (q) q.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  const hb = e.target.closest('[data-hint]'); if (hb){ const el = document.getElementById('h'+hb.dataset.hint); if (el) el.hidden = !el.hidden; return; }
  const rv = e.target.closest('[data-reveal]'); if (rv){ const el = document.getElementById(rv.dataset.reveal); if (el){ el.hidden = !el.hidden; rv.textContent = el.hidden ? 'Xem đáp án mẫu và phân tích' : 'Ẩn đáp án mẫu'; } return; }
  const fl = e.target.closest('.flip'); if (fl){ fl.classList.toggle('on'); fl.setAttribute('aria-pressed', fl.classList.contains('on')); return; }
  const rb = e.target.closest('[data-rub]'); if (rb && CUR){ const t = S.t[CUR.id] = S.t[CUR.id] || {}; t[rb.dataset.rub] = +rb.dataset.lv; save();
    rb.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b===rb)); rubSum(); return; }
  if (e.target.id === 'submitQ' && QS){ QS.done = true;
    const n = QS.items.length, got = QS.items.filter((it,qi)=>QS.pick[qi]===it.ans).length, sc = got/n;
    const bag = QS.kind==='m' ? S.m : S.x; const prev = bag[QS.id] || { best:0, tries:0 };
    bag[QS.id] = { best: Math.max(prev.best, sc), tries: prev.tries+1, last: sc, at: sc>=prev.best ? Date.now() : (prev.at||Date.now()) };
    save(); drawQuiz(); renderSide(QS.kind==='m'?QS.id:null);
    const r = $('#res'); if (r) r.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  if (e.target.id === 'retryQ' && QS){
    QS.items = QS.kind==='m' ? prepQuestions(withNotes(MODS[QS.id])) : examItems(QS.id);
    QS.pick = {}; QS.done = false; QS.idx = 0; drawQuiz(); const q = $('#quiz'); if (q) q.scrollIntoView({behavior:'smooth'}); return; }
  const ab = e.target.closest('[data-ask]'); if (ab && QS){ const it = QS.items[+ab.dataset.ask]; const t = $('#tq'); const tut = $('#tutor'); const pk = QS.pick[+ab.dataset.ask];
    if (t && tut && !tut.hidden){ t.value = `Giải thích giúp tôi câu: "${it.q}". Đáp án đúng là "${it.opts[it.ans]}"${pk!==it.ans&&pk!==undefined?`, tôi đã chọn "${it.opts[pk]}"`:''}. Vì sao?`; tut.scrollIntoView({behavior:'smooth',block:'center'}); t.focus(); }
    else { ab.textContent = 'Trợ giảng AI chưa sẵn sàng ở chế độ xem này'; ab.disabled = true; } return; }
  const d = e.target.closest('dfn[data-k], .chip[data-k]'); if (d){ showPop(d); e.stopPropagation(); return; }
  if (!e.target.closest('#pop')) hidePop();
  if (e.target.closest('.nav-m, .nav-p a, .nav-x a') && innerWidth <= 900) toggleSide(false);
});

}

let SAMPLE = null, sampleTried = false;
async function getSample(){ if (sampleTried) return SAMPLE; sampleTried = true; try { SAMPLE = window.claude && window.claude.use ? await window.claude.use('sample') : null; } catch(e){ SAMPLE = null; } return SAMPLE; }
const plain = h => h.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
function initTutor(m){
  getSample().then(s => {
    const box = $('#tutor'); if (!box || !s || !CUR || CUR.id !== m.id) return; box.hidden = false;
    const log = $('#tlog'), q = $('#tq'), send = $('#tsend'), stop = $('#tstop'), note = $('#tnote');
    const turns = []; let ctl = null;
    const ctx = `Bạn là trợ giảng của LATTICE Academy (LATTICE Next Solutions). Trả lời bằng tiếng Việt, xưng "tôi", gọi người học là "anh chị". Giọng điềm tĩnh, thân thiện, có số liệu, nói thẳng cả điều bất lợi; không hô khẩu hiệu, không hứa "tự động hóa 100%". Chỉ dựa trên nội dung học phần dưới đây. Nếu câu hỏi vượt ra ngoài nội dung, nói rõ và gợi ý học phần liên quan nếu có; không bịa con số hay chính sách. Không tư vấn pháp lý, thuế hay y tế cụ thể. Trả lời ngắn: tối đa khoảng 180 chữ, văn xuôi hoặc 3–5 gạch đầu dòng, không dùng tiêu đề Markdown.

HỌC PHẦN: ${m.t} (${m.p.name} · ${m.l.name})
MỤC TIÊU: ${m.goals.join('; ')}
NỘI DUNG: ${plain(m.body).slice(0,7000)}
GHI NHỚ: ${(m.x.key||[]).join(' | ')}
VÍ DỤ (${m.ex.t}): ${plain(m.ex.h).slice(0,1800)}
HỌC PHẦN LIÊN QUAN: ${m.help.rel.filter(r=>MODS[r]).map(r=>MODS[r].t).join('; ')}`;
    const add = (role, text) => { const d = document.createElement('div'); d.className = 'msg ' + (role==='user'?'u':'a'); d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; };
    const COPY = { not_granted:'Trợ giảng cần anh chị cho phép trang dùng Claude. Đã từ chối thì trợ giảng tắt trong lần xem này.', sampling_disabled:'Tài khoản này chưa dùng được Claude từ trang.', rate_limited:'Đang hỏi quá nhanh hoặc chạm giới hạn sử dụng. Thử lại sau ít phút.', session_expired:'Phiên đăng nhập đã hết. Đăng nhập lại rồi hỏi tiếp.', refused:'Trợ giảng không trả lời câu này. Thử hỏi sát nội dung học phần hơn.', prompt_too_large:'Câu hỏi quá dài. Rút gọn lại.' };
    send.addEventListener('click', async () => {
      const text = q.value.trim(); if (!text) { note.textContent = 'Nhập câu hỏi trước khi bấm Hỏi.'; return; }
      note.textContent = ''; add('user', text); q.value = ''; turns.push({role:'user', content:text});
      const out = add('assistant', 'Đang nghĩ…'); send.disabled = true; stop.hidden = false; ctl = new AbortController();
      try {
        const keep = turns.slice(-6);
        const { text: ans, truncated } = await s([{role:'user', content: ctx + '\n\n(Hết phần bối cảnh. Các lượt sau là trao đổi với người học.)'}, ...(keep[0].role==='assistant'?keep.slice(1):keep)], { cache:false, signal: ctl.signal, onText: ({text}) => { out.textContent = text; log.scrollTop = log.scrollHeight; } });
        out.textContent = ans; turns.push({role:'assistant', content: ans});
        if (truncated) note.textContent = 'Câu trả lời bị cắt ngắn. Hỏi hẹp hơn để có câu đầy đủ.';
      } catch (err) {
        turns.pop();
        if (err && err.code === 'cancelled') { out.textContent = err.text || 'Đã dừng.'; }
        else { out.textContent = (err && err.text) || ''; if (!out.textContent) out.remove();
          note.textContent = COPY[err && err.code] || 'Không kết nối được trợ giảng. Thử lại sau.';
          if (err && ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(err.code)) { send.disabled = true; q.disabled = true; } }
      } finally { if (!q.disabled) send.disabled = false; stop.hidden = true; }
    });
    stop.addEventListener('click', () => ctl && ctl.abort());
    q.addEventListener('keydown', e => { if (e.key==='Enter' && (e.metaKey||e.ctrlKey)) send.click(); });
  });
}

/* ============================================================
   THUẬT NGỮ · POPOVER
   ============================================================ */
function showPop(el){
  const t = TERMS[el.dataset.k]; if (!t) return; const pop = $('#pop');
  const used = ORDER.filter(id => MODS[id].body.indexOf('data-k="'+el.dataset.k+'"')>=0).slice(0,3);
  pop.innerHTML = `<b>${esc(t.t)}</b>${esc(t.d)}${used.length?`<span class="lbl">Xuất hiện ở</span>${used.map(id=>`<a href="#m-${id}" style="display:block;font-size:13px">${esc(MODS[id].t)}</a>`).join('')}`:''}`;
  pop.hidden = false; const r = el.getBoundingClientRect(), pw = Math.min(340, innerWidth-32);
  let x = Math.min(Math.max(16, r.left), innerWidth - pw - 16), y = r.bottom + 8;
  pop.style.width = pw+'px'; pop.style.left = x+'px'; pop.style.top = y+'px';
  const ph = pop.offsetHeight; if (y + ph > innerHeight - 10) pop.style.top = Math.max(10, r.top - ph - 8) + 'px';
}
function hidePop(){ const p = $('#pop'); if (p) p.hidden = true; }
document.addEventListener('keydown', e => { if (e.key==='Escape') { hidePop(); toggleSide(false); } });
addEventListener('scroll', hidePop, {passive:true});

function renderGlossary(){
  setProg(''); CUR = null;
  const keys = Object.keys(TERMS).sort((a,b)=>TERMS[a].t.localeCompare(TERMS[b].t,'vi'));
  $('#main').innerHTML = `<div class="wrap"><div class="crumb"><a href="#home">Trang chủ</a> / Thuật ngữ</div><h1 class="h1">Bảng thuật ngữ</h1>
   <p class="lead">${keys.length} khái niệm. Một khái niệm, một định nghĩa: mọi học phần dùng đúng các định nghĩa dưới đây.</p>
   <div class="gl" style="margin-top:24px">${keys.map(k=>{ const used = ORDER.filter(id=>MODS[id].body.indexOf('data-k="'+k+'"')>=0);
     return `<div><b>${esc(TERMS[k].t)}</b><span>${esc(TERMS[k].d)}</span>${used.length?`<div class="note" style="margin-top:6px">Học ở: ${used.slice(0,4).map(id=>`<a href="#m-${id}">${esc(id.toUpperCase())}</a>`).join(', ')}</div>`:''}</div>`; }).join('')}</div></div>`;
}

/* ============================================================
   ĐIỀU HƯỚNG
   ============================================================ */
function toggleSide(force){ const s = $('#side'), b = $('#menuBtn'); const open = force === undefined ? !s.classList.contains('open') : force; s.classList.toggle('open', open); b.setAttribute('aria-expanded', open); }
$('#menuBtn').addEventListener('click', e => { e.stopPropagation(); toggleSide(); });
function route(){
  const h = (location.hash || '#home').slice(1); hidePop();
  let cur = null; CUR = null;
  if (h.startsWith('m-') && MODS[h.slice(2)]) { cur = h.slice(2); renderModule(cur); }
  else if (h.startsWith('p-')) renderProgram(h.slice(2));
  else if (h.startsWith('x-')) renderExam(h.slice(2));
  else if (h.startsWith('k-')) renderKey(h.slice(2));
  else if (h === 'qc') renderRules();
  else if (h === 'gl') renderGlossary();
  else renderHome();
  renderSide(cur); window.scrollTo(0,0);
}
addEventListener('hashchange', route);
route();

</script>
