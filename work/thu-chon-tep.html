<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thử chọn tệp</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px}input{font-size:16px;margin:12px 0}#out{padding:12px;background:#f3f2f2;border-radius:8px}</style></head>
<body><h1>Thử chọn tệp</h1>
<p>Đây là ô chọn tệp gốc của trình duyệt, không có mã nào can thiệp. Bấm vào nút bên dưới.</p>
<input type="file" id="f">
<p id="out">Chưa chọn tệp.</p>
<script>
var o=document.getElementById('out');
document.getElementById('f').addEventListener('click',function(){o.textContent='Đã nhận cú bấm — hộp chọn tệp phải hiện ra ngay. Nếu không hiện: trình duyệt đang chặn hộp chọn tệp.';});
document.getElementById('f').addEventListener('change',function(e){var f=e.target.files[0];o.textContent=f?('Đã chọn: '+f.name+' · '+Math.round(f.size/1024)+' KB · '+(f.type||'không rõ loại')):'Đã hủy.';});
</script></body></html>
